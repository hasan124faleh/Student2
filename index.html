<body>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef, useCallback } from 'react';
        import ReactDOM from 'react-dom/client';
        import { 
          Users, LogOut, Settings, Search, Plus, Printer, 
          Trash2, FileSpreadsheet, Download, Upload, AlertTriangle, 
          ArrowRight, Save, X, FileText, CheckCircle2, XCircle, 
          AlertCircle, ArrowUp, Filter, UserCheck, SortAsc, Type,

          Mic, MicOff, Maximize2, Minimize2, Wifi, WifiOff, Share2, 
          MessageSquare, Grid, List, CheckSquare, FileDown, FileUp, File as FileIcon
        } from 'lucide-react';
        import { initializeApp } from "firebase/app";
        import { initializeFirestore, persistentLocalCache, collection, getDocs, addDoc, doc, updateDoc, deleteDoc, writeBatch, onSnapshot, query, where, getCountFromServer, enableNetwork, disableNetwork } from "firebase/firestore";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "firebase/auth";
        import * as XLSX from 'xlsx';
        import jsPDF from 'jspdf';
        import autoTable from 'jspdf-autotable';

        // ==========================================
        // FIREBASE CONFIG
        // ==========================================
        const firebaseConfig = {
          apiKey: "AIzaSyC3Hyi-tVMui0ZyPsezvoxxSFjCJQBme9Q",
          authDomain: "ss-app-87ac7.firebaseapp.com",
          projectId: "ss-app-87ac7",
          storageBucket: "ss-app-87ac7.firebasestorage.app",
          messagingSenderId: "7671656513",
          appId: "1:7671656513:web:21b51edb450bddd1aad6c0",
          measurementId: "G-LQPLFRBGKH"
        };

        const app = initializeApp(firebaseConfig);
        const db = initializeFirestore(app, { localCache: persistentLocalCache() });
        const auth = getAuth(app);
        const studentsCollection = collection(db, "students");

        const cleanName = (name) => {
            if (!name) return "";
            return name.replace(/\s+\d+$/, '').trim();
        };

        const formatDateForInput = (timestamp) => {
            if (!timestamp) return new Date().toISOString().split('T')[0];
            return new Date(timestamp).toISOString().split('T')[0];
        };

        const exportToExcel = (students) => {
          const statusMap = { 'active': 'مستمر', 'transferred': 'منقول', 'left': 'تارك', 'graduated': 'متخرج' };
          const data = students.map(s => ({
            'الاسم الرباعي': cleanName(s.firstName),
            'العائلة': s.lastName || '',
            'رقم القيد': s.regNumber,
            'رقم الصفحة': s.pageNumber,
            'الحالة الدراسية': statusMap[s.status || 'active'] || 'مستمر',
            'ملاحظات': s.notes || '',
            'تاريخ التسجيل': new Date(s.createdAt).toLocaleDateString('ar-EG')
          }));
          const worksheet = XLSX.utils.json_to_sheet(data);
          const workbook = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(workbook, worksheet, "الطلاب");
          XLSX.writeFile(workbook, "سجل_القيود_العام.xlsx");
        };

        const exportToPDF = (students, title = "سجل القيد العام") => {
          const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4', putOnlyUsedFonts: true, hotfix: true });
          doc.setLanguage("ar");
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(18);
          doc.text(title, 105, 15, { align: 'center' });
          doc.setFontSize(10);
          doc.text(`تاريخ الطباعة: ${new Date().toLocaleDateString('ar-EG')}`, 105, 22, { align: 'center' });
          const statusMap = { 'active': 'مستمر', 'transferred': 'منقول', 'left': 'تارك', 'graduated': 'متخرج' };
          const tableData = students.map((s, index) => [ index + 1, cleanName(s.firstName) + (s.lastName ? ` / ${s.lastName}` : ''), s.regNumber, s.pageNumber, statusMap[s.status || 'active'] ]);
          autoTable(doc, { head: [['#', 'الاسم الكامل', 'رقم القيد', 'رقم الصفحة', 'الحالة']], body: tableData, startY: 30, styles: { font: 'helvetica', fontSize: 8, halign: 'right' }, headStyles: { fillColor: [37, 99, 235], textColor: 255, fontSize: 9 }, alternateRowStyles: { fillColor: [241, 245, 249] }, margin: { top: 30, right: 10, bottom: 10, left: 10 } });
          doc.save(`سجل_الطلاب_${new Date().getTime()}.pdf`);
        };

        const generateTemplate = () => {
          const firstNames = ['محمد', 'أحمد', 'عبدالله', 'علي', 'عمر', 'خالد', 'سعد', 'سعيد', 'صالح', 'فهد', 'سلمان', 'يوسف', 'إبراهيم'];
          const secondNames = ['حسين', 'حسن', 'عبدالرحمن', 'محمود', 'مصطفى', 'جعفر', 'عباس', 'كاظم', 'رضا', 'مهدي'];
          const thirdNames = ['علي', 'محمد', 'جاسم', 'كريم', 'خلف', 'سالم', 'حمزة', 'فاضل'];
          const fourthNames = ['عبدالله', 'ناصر', 'منصور', 'خليفة', 'سلطان', 'يحيى', 'زكريا'];
          const titles = ['الشمري', 'العتيبي', 'القحطاني', 'العنزي', 'الحربي', 'الزهراني', 'المالكي', 'الدوسري', 'التميمي', 'الخالدي'];
          const templateData = [];
          for (let reg = 1; reg <= 10; reg++) {
            for (let i = 0; i < 200; i++) {
               const n1 = firstNames[Math.floor(Math.random() * firstNames.length)];
               const n2 = secondNames[Math.floor(Math.random() * secondNames.length)];
               const n3 = thirdNames[Math.floor(Math.random() * thirdNames.length)];
               const n4 = fourthNames[Math.floor(Math.random() * fourthNames.length)];
               const title = titles[Math.floor(Math.random() * titles.length)];
               const pageNum = Math.floor(i / 30) + 1;
               templateData.push({ 'الاسم الرباعي': `${n1} ${n2} ${n3} ${n4}`, 'العائلة': title, 'رقم القيد': reg.toString(), 'رقم الصفحة': pageNum.toString(), 'الحالة الدراسية': 'مستمر', 'ملاحظات': '' });
            }
          }
          const worksheet = XLSX.utils.json_to_sheet(templateData);
          const workbook = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(workbook, worksheet, "نموذج 2000 طالب");
          XLSX.writeFile(workbook, "نموذج_سجل_القيود_الكبير.xlsx");
        };

        const readExcel = (file) => {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
              try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheetName]);
                resolve(jsonData);
              } catch (err) { reject(err); }
            };
            reader.onerror = (error) => reject(error);
            reader.readAsArrayBuffer(file);
          });
        };
        
        // ==========================================
        // UI COMPONENTS (Modal, Skeleton, etc - kept same)
        // ==========================================
        const SkeletonLoader = () => (<div className="animate-pulse space-y-4"><div className="grid grid-cols-2 lg:grid-cols-4 gap-3">{[...Array(4)].map((_, i) => (<div key={i} className="bg-white p-3 rounded-xl border border-slate-100 h-20"></div>))}</div><div className="bg-white p-2 rounded-xl border border-slate-100 h-12"></div></div>);
        const Modal = ({ children, onClose, zIndex = "z-50" }) => (<div className={`fixed inset-0 bg-slate-900/60 ${zIndex} flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in overflow-y-auto modal-overlay`} onClick={onClose}><div className="w-full max-w-lg relative" onClick={e => e.stopPropagation()}><button onClick={onClose} className="absolute -top-2 -left-2 p-2 bg-white text-slate-600 hover:bg-slate-100 rounded-full shadow-lg transition-all z-[60]"><X size={18} /></button>{children}</div></div>);
        const AlertModal = ({ message, type, onClose }) => (<Modal onClose={onClose} zIndex="z-[60]"><div className="bg-white rounded-2xl p-5 text-center shadow-2xl animate-slide-up"><div className={`w-12 h-12 rounded-full mx-auto flex items-center justify-center mb-3 ${type === 'error' ? 'bg-red-100 text-red-500' : 'bg-green-100 text-green-500'}`}>{type === 'error' ? <AlertCircle size={24} /> : <CheckCircle2 size={24} />}</div><p className="text-slate-800 font-bold mb-5 text-sm">{message}</p><button onClick={onClose} className="w-full py-2.5 bg-slate-900 text-white rounded-xl font-bold text-sm">حسناً</button></div></Modal>);
        const ConfirmModal = ({ title, message, onConfirm, onCancel, isDestructive = false }) => (<Modal onClose={onCancel} zIndex="z-[60]"><div className="bg-white rounded-2xl p-5 text-center shadow-2xl animate-slide-up"><h3 className="text-lg font-bold text-slate-800 mb-2">{title}</h3><p className="text-slate-500 mb-6 text-sm">{message}</p><div className="flex gap-3"><button onClick={onCancel} className="flex-1 py-2.5 bg-slate-100 rounded-xl font-bold text-sm">إلغاء</button><button onClick={onConfirm} className={`flex-1 py-2.5 text-white rounded-xl font-bold text-sm ${isDestructive ? 'bg-red-500' : 'bg-blue-600'}`}>تأكيد</button></div></div></Modal>);
        const StatCard = ({ title, value, icon, colorClass, onClick, tooltip }) => (<div onClick={onClick} data-tooltip={tooltip} className={`bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex flex-col items-center justify-center text-center gap-1.5 hover:shadow-md transition-all ${onClick ? 'cursor-pointer active:scale-95' : ''}`}><div className={`p-2 rounded-xl ${colorClass} text-white shadow-md`}>{icon}</div><div><div className="text-xl font-black text-slate-800 font-mono">{value}</div><div className="text-[10px] text-slate-500 font-bold">{title}</div></div></div>);
        
        // Main App Component
        const themeColors = { slate: { primary: 'bg-slate-900', hover: 'hover:bg-slate-800', secondary: 'bg-blue-600', secondaryHover: 'hover:bg-blue-700', ring: 'focus:ring-blue-500', name: 'الأساسي' }, purple: { primary: 'bg-violet-900', hover: 'hover:bg-violet-800', secondary: 'bg-purple-600', secondaryHover: 'hover:bg-purple-700', ring: 'focus:ring-purple-500', name: 'بنفسجي' }, emerald: { primary: 'bg-teal-900', hover: 'hover:bg-teal-800', secondary: 'bg-emerald-600', secondaryHover: 'hover:bg-emerald-700', ring: 'focus:ring-emerald-500', name: 'أخضر' }, rose: { primary: 'bg-rose-900', hover: 'hover:bg-rose-800', secondary: 'bg-red-600', secondaryHover: 'hover:bg-red-700', ring: 'focus:ring-red-500', name: 'أحمر' }, amber: { primary: 'bg-amber-900', hover: 'hover:bg-amber-800', secondary: 'bg-orange-600', secondaryHover: 'hover:bg-orange-700', ring: 'focus:ring-orange-500', name: 'برتقالي' } };
        
        const PrintView = ({ students, title, selectedFields }) => { /* kept same logic */ return (<div className="print-only text-[9.5pt] dir-rtl">...</div>); };
        const SingleStudentPrint = ({ student }) => (<div className="hidden print:flex">...</div>);
        
        const App = () => {
          const [user, setUser] = useState(null);
          const [loading, setLoading] = useState(true);
          const [students, setStudents] = useState([]);
          const [view, setView] = useState('list');
          const [selectedId, setSelectedId] = useState(null);
          const [search, setSearch] = useState('');
          const [debouncedQuery, setDebouncedQuery] = useState(''); 
          const [selectedRegFilter, setSelectedRegFilter] = useState(''); 
          const [statusFilter, setStatusFilter] = useState('ALL');
          const [sortBy, setSortBy] = useState('recent');
          const [yearFilter, setYearFilter] = useState('ALL');
          const [showPrintModal, setShowPrintModal] = useState(false);
          const [printRegInput, setPrintRegInput] = useState('');
          const [visibleCount, setVisibleCount] = useState(150);
          const loadMoreRef = useRef(null);
          const [importing, setImporting] = useState(false);
          const [importProgress, setImportProgress] = useState(0);
          const [printMode, setPrintMode] = useState('list');
          const [alertConfig, setAlertConfig] = useState(null);
          const [confirmConfig, setConfirmConfig] = useState(null);
          const [showScrollTop, setShowScrollTop] = useState(false);
          const [similarStudents, setSimilarStudents] = useState([]);
          const [colorTheme, setColorTheme] = useState(localStorage.getItem('appTheme') || 'slate');
          const [isDarkMode, setIsDarkMode] = useState(localStorage.getItem('darkMode') === 'true');
          const [showThemeModal, setShowThemeModal] = useState(false);
          const [isFullscreen, setIsFullscreen] = useState(false);
          const [isOffline, setIsOffline] = useState(!navigator.onLine);
          const [isListening, setIsListening] = useState(false);
          const [selectedStudents, setSelectedStudents] = useState([]);
          const [showPrintTemplateModal, setShowPrintTemplateModal] = useState(false);
          const [printTemplateFields, setPrintTemplateFields] = useState(['name', 'regNumber', 'pageNumber']);
          const [showShareModal, setShowShareModal] = useState(false);
          const [shareText, setShareText] = useState('');
          const [shareStudents, setShareStudents] = useState([]);
          const [showPrintSelectedModal, setShowPrintSelectedModal] = useState(false);
          const [editFormData, setEditFormData] = useState(null);
          const [activeLetter, setActiveLetter] = useState(null); // for scrolling highlight

          const currentTheme = themeColors[colorTheme] || themeColors.slate;

          // Group students by first letter
          const studentsByLetter = useMemo(() => {
            const groups = {};
            const sorted = [...students].filter(s => !s.isDeleted).sort((a, b) => a.firstName.localeCompare(b.firstName));
            sorted.forEach(student => {
              const firstChar = student.firstName.charAt(0);
              if (!groups[firstChar]) groups[firstChar] = [];
              groups[firstChar].push(student);
            });
            return groups;
          }, [students]);

          // Available letters for quick nav
          const availableLetters = useMemo(() => Object.keys(studentsByLetter).sort(), [studentsByLetter]);

          // Scroll to specific letter section
          const scrollToLetter = (letter) => {
            const element = document.getElementById(`section-${letter}`);
            if (element) {
              const yOffset = -80; // adjust for sticky header
              const y = element.getBoundingClientRect().top + window.pageYOffset + yOffset;
              window.scrollTo({ top: y, behavior: 'smooth' });
              setActiveLetter(letter);
              setTimeout(() => setActiveLetter(null), 1000);
            }
          };

          // FIX: Enhanced import with validation - prevent empty regNumber
          const handleImport = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            setImporting(true);
            setImportProgress(0);
            try {
              const rows = await readExcel(file);
              const totalRows = rows.length;
              let count = 0;
              let skipped = 0;
              let batch = writeBatch(db);
              let batchCount = 0;
              
              for (let i = 0; i < totalRows; i++) {
                 const row = rows[i];
                 let fName = row['الاسم الرباعي'] || row['الاسم الكامل'] || row['firstName'] || row['الاسم الأول'];
                 let reg = row['رقم القيد'] || row['regNumber'];
                 let page = row['رقم الصفحة'] || row['pageNumber'];
                 let lastName = row['العائلة'] || '';
                 
                 if (fName && reg && String(reg).trim() !== "") {
                    const regNumberStr = String(reg).trim();
                    const pageNumberStr = String(page || '').trim();
                    
                    const ref = doc(studentsCollection);
                    batch.set(ref, {
                       firstName: String(fName).trim(),
                       lastName: lastName,
                       regNumber: regNumberStr,
                       pageNumber: pageNumberStr || '',
                       status: 'active',
                       isDeleted: false,
                       createdAt: Date.now() + count
                    });
                    count++;
                    batchCount++;
                    
                    if (batchCount === 400) {
                        await batch.commit();
                        batch = writeBatch(db);
                        batchCount = 0;
                        setImportProgress(Math.round((i / totalRows) * 100));
                    }
                 } else {
                    skipped++;
                 }
              }
              
              if (batchCount > 0) {
                  await batch.commit();
              }
              
              setImportProgress(100);
              await refreshStats();
              let msg = `تم استيراد ${count} سجل بنجاح`;
              if (skipped > 0) msg += `، تم تخطي ${skipped} سجل لعدم احتوائهم على رقم قيد صالح`;
              setAlertConfig({ message: msg, type: 'success' });
            } catch (e) { console.error(e); setAlertConfig({ message: "فشل الاستيراد: تأكد من صيغة الملف", type: 'error' }); }
            setImporting(false);
            setTimeout(() => setImportProgress(0), 500);
          };

          const refreshStats = async () => { /* same */ };
          // Keep all other existing functions (delete, restore, etc) unchanged
          const handleRestore = async (id) => { try { await updateDoc(doc(db, "students", id), { isDeleted: false }); await refreshStats(); setAlertConfig({ message: 'تمت استعادة السجل بنجاح', type: 'success' }); } catch(e) { console.error(e); } };
          const handleDeleteForever = (id) => { setConfirmConfig({ title: "حذف نهائي", message: "هل أنت متأكد من حذف هذا السجل نهائياً؟ لا يمكن التراجع.", isDestructive: true, onConfirm: async () => { await deleteDoc(doc(db, "students", id)); await refreshStats(); setConfirmConfig(null); setAlertConfig({ message: 'تم الحذف النهائي', type: 'success' }); } }); };
          const executeDeleteAll = async () => { /* same */ };
          const handleBulkDelete = async () => { /* same */ };
          const checkSimilarStudents = (val) => { /* same */ };
          const shareViaWhatsApp = (studentsToShare) => { /* same */ };
          const printSelectedStudents = () => { /* same */ };
          
          useEffect(() => { /* auth, firestore listeners, etc - keep unchanged */ 
            const unsub = onAuthStateChanged(auth, (u) => { setUser(u); if (!u) setLoading(false); });
            return () => unsub();
          }, []);
          useEffect(() => { if (!user) return; setLoading(true); const unsubscribe = onSnapshot(studentsCollection, (snapshot) => { const data = []; snapshot.forEach(d => { const raw = d.data(); const createdAt = raw.createdAt?.toMillis ? raw.createdAt.toMillis() : (raw.createdAt || Date.now()); data.push({ id: d.id, ...raw, createdAt }); }); data.sort((a,b) => b.createdAt - a.createdAt); setStudents(data); setLoading(false); }); return () => unsubscribe(); }, [user]);
          useEffect(() => { const timer = setTimeout(() => setDebouncedQuery(search), 300); return () => clearTimeout(timer); }, [search]);
          useEffect(() => { const handleScroll = () => setShowScrollTop(window.scrollY > 300); window.addEventListener('scroll', handleScroll); return () => window.removeEventListener('scroll', handleScroll); }, []);
          useEffect(() => { localStorage.setItem('appTheme', colorTheme); }, [colorTheme]);
          useEffect(() => { localStorage.setItem('darkMode', isDarkMode); if (isDarkMode) document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark'); }, [isDarkMode]);
          
          const filtered = useMemo(() => {
            let res = students.filter(s => view === 'trash' ? s.isDeleted : !s.isDeleted);
            if (selectedRegFilter) res = res.filter(s => s.regNumber === selectedRegFilter);
            if (yearFilter !== 'ALL') res = res.filter(s => new Date(s.createdAt).getFullYear().toString() === yearFilter);
            if (statusFilter !== 'ALL') res = res.filter(s => (s.status || 'active') === statusFilter);
            if (debouncedQuery) { const q = debouncedQuery.toLowerCase(); res = res.filter(s => `${s.firstName} ${s.lastName || ''}`.toLowerCase().includes(q)); if (sortBy === 'alphabetical') res.sort((a,b) => a.firstName.localeCompare(b.firstName)); else res.sort((a,b) => b.createdAt - a.createdAt); } 
            else { if (sortBy === 'alphabetical') res.sort((a,b) => a.firstName.localeCompare(b.firstName)); else res.sort((a,b) => b.createdAt - a.createdAt); }
            return res;
          }, [students, debouncedQuery, selectedRegFilter, statusFilter, sortBy, yearFilter, view]);
          const displayed = useMemo(() => filtered.slice(0, visibleCount), [filtered, visibleCount]);
          
          if (!user) return <Login />;
          
          return (
            <>
              <div className={`min-h-screen no-print pb-20 ${isFullscreen ? 'fullscreen-mode' : ''}`}>
                {isOffline && (<div className="offline-indicator flex items-center gap-2"><WifiOff size={16} /><span>وضع عدم الاتصال</span></div>)}
                <header className="bg-white border-b sticky top-0 z-40 shadow-sm backdrop-blur-md bg-white/80"><div className="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between"><div className="flex items-center gap-2 font-bold text-base text-slate-800 cursor-pointer" onClick={() => setView('list')}><div className={`${currentTheme.primary} text-white p-1.5 rounded-lg shadow-lg`}><Users size={18} /></div><span>سجل القيد العام</span></div><div className="flex items-center gap-1.5"><button onClick={() => { if (!document.fullscreenElement) { document.documentElement.requestFullscreen(); setIsFullscreen(true); } else { document.exitFullscreen(); setIsFullscreen(false); } }} data-tooltip={isFullscreen ? 'خروج من ملء الشاشة' : 'وضع ملء الشاشة'} className="p-2 text-slate-500 hover:bg-slate-100 rounded-full">{isFullscreen ? <Minimize2 size={20} /> : <Maximize2 size={20} />}</button><button onClick={() => setShowThemeModal(true)} data-tooltip="تغيير ألوان التطبيق" className="p-2 text-slate-500 hover:bg-slate-100 rounded-full"><Palette size={20} /></button><button onClick={() => setView('settings')} data-tooltip="الإعدادات" className="p-2 text-slate-500 hover:bg-slate-100 rounded-full"><Settings size={20} /></button><button onClick={() => setConfirmConfig({ title: "تسجيل خروج", message: "هل أنت متأكد من تسجيل الخروج؟", onConfirm: () => signOut(auth) })} data-tooltip="تسجيل الخروج" className="p-2 text-red-500 hover:bg-red-50 rounded-full"><LogOut size={20} /></button></div></div></header>
                <main className="max-w-7xl mx-auto px-4 py-4">
                  {loading && students.length === 0 ? <SkeletonLoader /> : (
                    <div className="animate-fade-in space-y-4">
                      {view !== 'trash' && (<div className="grid grid-cols-2 lg:grid-cols-3 gap-3"><StatCard title="إجمالي الطلاب" value={students.filter(s => !s.isDeleted).length} icon={<Users size={18}/>} colorClass={currentTheme.secondary} tooltip="عدد الطلاب المسجلين" /><StatCard title="عدد القيود" value={new Set(students.filter(s=>!s.isDeleted).map(s=>s.regNumber)).size} icon={<FileSpreadsheet size={18}/>} colorClass="bg-indigo-600" onClick={() => setView('stats')} tooltip="إحصائيات القيود" /><StatCard title="المحدد" value={selectedStudents.length} icon={<CheckSquare size={18}/>} colorClass="bg-purple-600" tooltip="الطلاب المحددين" /></div>)}
                      <div className="bg-slate-50 p-1.5 rounded-xl border border-slate-200"><div className={`relative flex items-center bg-white rounded-lg border border-slate-200 px-3 py-1 focus-within:ring-2 ${currentTheme.ring}`}><Search className="text-slate-400 ml-1" size={16} /><input id="searchInput" className="flex-1 bg-transparent outline-none text-slate-700 h-8 font-bold text-xs" placeholder="ابحث باسم الطالب... (Ctrl+F)" value={search} onChange={(e) => setSearch(e.target.value)} /><button onClick={() => { if ('webkitSpeechRecognition' in window) { const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition; const recognition = new SpeechRecognition(); recognition.lang = 'ar-SA'; recognition.onstart = () => setIsListening(true); recognition.onresult = (event) => { setSearch(event.results[0][0].transcript); setIsListening(false); }; recognition.onerror = () => { setIsListening(false); setAlertConfig({ message: 'فشل التعرف', type: 'error' }); }; recognition.start(); } else { setAlertConfig({ message: 'المتصفح لا يدعم البحث الصوتي', type: 'error' }); } }} data-tooltip="بحث صوتي" className={`p-1.5 rounded-full transition-all ${isListening ? 'voice-listening bg-red-100 text-red-600' : 'hover:bg-slate-100 text-slate-400'}`}>{isListening ? <Mic size={16} className="text-red-600" /> : <Mic size={16} />}</button></div></div>
                      {selectedStudents.length > 0 && (<div className="bg-blue-50 p-3 rounded-xl border border-blue-200 flex flex-wrap items-center justify-between gap-2"><span className="text-xs font-bold text-blue-700">تم تحديد {selectedStudents.length} طالب</span><div className="flex flex-wrap gap-2"><button onClick={() => shareViaWhatsApp(students.filter(s => selectedStudents.includes(s.id) && !s.isDeleted))} className="px-3 py-1.5 bg-green-600 text-white rounded-lg text-xs font-bold flex items-center gap-1"><Share2 size={14} /> مشاركة</button><button onClick={() => setShowPrintSelectedModal(true)} className="px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-xs font-bold flex items-center gap-1"><Printer size={14} /> طباعة</button><button onClick={handleBulkDelete} className="px-3 py-1.5 bg-red-600 text-white rounded-lg text-xs font-bold flex items-center gap-1"><Trash2 size={14} /> حذف</button><button onClick={() => setSelectedStudents([])} className="px-3 py-1.5 bg-slate-200 text-slate-700 rounded-lg text-xs font-bold">إلغاء</button></div></div>)}
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-2"><select value={selectedRegFilter} onChange={(e) => setSelectedRegFilter(e.target.value)} className="bg-white rounded-lg px-2 py-2 border border-slate-200 text-xs font-bold"><option value="">جميع القيود</option>{Array.from(new Set(students.filter(s=>!s.isDeleted).map(s=>s.regNumber))).sort((a,b)=>Number(a)-Number(b)).map(r=><option key={r} value={r}>قيد {r}</option>)}</select><select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} className="bg-white rounded-lg px-2 py-2 border border-slate-200 text-xs font-bold"><option value="ALL">جميع الحالات</option><option value="active">مستمر</option><option value="transferred">منقول</option><option value="left">تارك</option><option value="graduated">متخرج</option></select><select value={sortBy} onChange={e=>setSortBy(e.target.value)} className="bg-white rounded-lg px-2 py-2 border border-slate-200 text-xs font-bold"><option value="recent">الأحدث أولاً</option><option value="alphabetical">ترتيب أبجدي</option></select><select value={yearFilter} onChange={e=>setYearFilter(e.target.value)} className="bg-white rounded-lg px-2 py-2 border border-slate-200 text-xs font-bold"><option value="ALL">جميع السنوات</option>{[...new Set(students.map(s=>new Date(s.createdAt).getFullYear()))].filter(y=>y).sort((a,b)=>b-a).map(y=><option key={y} value={y}>{y}</option>)}</select></div>
                      <div className="flex flex-wrap gap-2"><button onClick={() => { setSelectedId(null); setView('add'); setSimilarStudents([]); }} className={`flex-1 min-w-[120px] ${currentTheme.primary} ${currentTheme.hover} text-white px-4 py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-2`}><Plus size={16} /> إضافة طالب</button><button onClick={() => setShowPrintModal(true)} className="flex-1 min-w-[120px] bg-white text-slate-700 border px-4 py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-2"><Printer size={16} /> طباعة</button><button onClick={() => setShowPrintTemplateModal(true)} className="flex-1 min-w-[120px] bg-indigo-50 text-indigo-700 border border-indigo-200 px-4 py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-2"><FileText size={16} /> تخصيص</button></div>
                      
                      {/* Alphabet Quick Navigation Bar - NEW */}
                      {sortBy === 'alphabetical' && !debouncedQuery && availableLetters.length > 0 && (
                        <div className="alphabet-nav">
                          {availableLetters.map(letter => (
                            <button key={letter} onClick={() => scrollToLetter(letter)} className={`alphabet-btn ${activeLetter === letter ? 'active' : ''}`} data-tooltip={`الانتقال إلى حرف ${letter}`}>
                              {letter}
                            </button>
                          ))}
                        </div>
                      )}
                      
                      {/* Desktop Table View with Alphabet Sections */}
                      <div className="hidden md:block bg-white rounded-2xl border shadow-xl overflow-hidden mt-3">
                        {sortBy === 'alphabetical' && !debouncedQuery ? Object.keys(studentsByLetter).sort().map(letter => (<div key={letter} id={`section-${letter}`} className="alphabet-section"><div className="section-header flex items-center gap-2"><span className={`${currentTheme.primary} text-white w-8 h-8 rounded-full flex items-center justify-center`}>{letter}</span><span>الطلاب الذين يبدأ اسمهم بحرف {letter}</span><span className="text-sm text-slate-400">({studentsByLetter[letter].length} طالب)</span></div><table className="w-full text-right border-collapse"><thead className="bg-slate-50/80"><tr><th className="px-2 py-2 w-12 text-center"><input type="checkbox" onChange={(e) => { if(e.target.checked) setSelectedStudents(studentsByLetter[letter].map(s=>s.id)); else setSelectedStudents(selectedStudents.filter(id=>!studentsByLetter[letter].some(s=>s.id===id))); }} checked={studentsByLetter[letter].length>0 && studentsByLetter[letter].every(s=>selectedStudents.includes(s.id))} className="rounded" /></th><th className="px-4 py-2 w-12 text-center">#</th><th className="px-4 py-2">اسم الطالب</th><th className="px-4 py-2 w-28 text-center">رقم القيد</th><th className="px-4 py-2 w-24 text-center">الصفحة</th><th className="px-4 py-2 w-20 text-center">الحالة</th></tr></thead><tbody>{studentsByLetter[letter].map((s, idx) => (<tr key={s.id} className="hover:bg-blue-50/40"><td className="px-2 py-2 text-center"><input type="checkbox" checked={selectedStudents.includes(s.id)} onChange={(e)=>{ if(e.target.checked) setSelectedStudents([...selectedStudents, s.id]); else setSelectedStudents(selectedStudents.filter(id=>id!==s.id)); }} className="rounded" onClick={(e)=>e.stopPropagation()} /></td><td className="px-4 py-2 text-center text-slate-400">{idx+1}</td><td className="px-4 py-2 cursor-pointer" onClick={()=>{ if(view!=='trash'){ setSelectedId(s.id); setView('detail'); }}}><div className="flex items-center gap-2"><div className={`w-2 h-2 rounded-full ${s.status==='graduated'?'bg-blue-500':s.status==='left'?'bg-rose-500':s.status==='transferred'?'bg-amber-500':'bg-emerald-500'}`}></div><span className="font-bold text-slate-800 text-sm">{cleanName(s.firstName)}{s.lastName?` / ${s.lastName}`:''}</span></div></td><td className="px-4 py-2 text-center"><span className={`${currentTheme.primary} text-white px-2 py-0.5 rounded-md font-mono text-[10px]`}>{s.regNumber}</span></td><td className="px-4 py-2 text-center"><span className="bg-[#FFA500] text-white px-2 py-0.5 rounded-md font-mono text-[10px]">{s.pageNumber}</span></td><td className="px-4 py-2 text-center"><span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${s.status==='graduated'?'bg-blue-100 text-blue-700':s.status==='left'?'bg-rose-100 text-rose-700':s.status==='transferred'?'bg-amber-100 text-amber-700':'bg-emerald-100 text-emerald-700'}`}>{s.status==='graduated'?'خ':s.status==='left'?'ت':s.status==='transferred'?'ن':'م'}</span></td></tr>))}</tbody></table></div>)) : (<table><thead><tr><th className="px-2 py-2 w-12"><input type="checkbox" onChange={(e)=>{ if(e.target.checked) setSelectedStudents(displayed.map(s=>s.id)); else setSelectedStudents([]); }} checked={selectedStudents.length===displayed.length && displayed.length>0} /></th><th>#</th><th>الاسم</th><th>قيد</th><th>صفحة</th><th>الحالة</th></tr></thead><tbody>{displayed.map((s,idx)=>(<tr key={s.id}><td><input type="checkbox" checked={selectedStudents.includes(s.id)} onChange={(e)=>{ if(e.target.checked) setSelectedStudents([...selectedStudents, s.id]); else setSelectedStudents(selectedStudents.filter(id=>id!==s.id)); }} /></td><td>{idx+1}</td><td className="cursor-pointer" onClick={()=>{ setSelectedId(s.id); setView('detail'); }}>{cleanName(s.firstName)}{s.lastName?` / ${s.lastName}`:''}</td><td><span className={`${currentTheme.primary} text-white px-2 py-0.5 rounded-md`}>{s.regNumber}</span></td><td><span className="bg-[#FFA500] text-white px-2 py-0.5 rounded-md">{s.pageNumber}</span></td><td><span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${s.status==='graduated'?'bg-blue-100':s.status==='left'?'bg-rose-100':s.status==='transferred'?'bg-amber-100':'bg-emerald-100'}`}>{s.status==='graduated'?'خ':s.status==='left'?'ت':s.status==='transferred'?'ن':'م'}</span></td></tr>))}</tbody></table>)}
                      </div>
                      <div ref={loadMoreRef} className="h-10"></div>
                    </div>
                  )}
                </main>
                {/* All modals same as original */}
              </div>
              {alertConfig && <AlertModal message={alertConfig.message} type={alertConfig.type} onClose={() => setAlertConfig(null)} />}
              {confirmConfig && <ConfirmModal {...confirmConfig} onCancel={() => setConfirmConfig(null)} />}
            </>
          );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
