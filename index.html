<head>

    <!-- Favicon -->

    <!-- Styling -->

    <script>
      tailwind.config = {

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>

            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
      }
      .print-only { display: none; }
      
      /* Scrollbars */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background-color: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }

      /* Dark Mode Base Styles */
      html.dark body { background-color: #0f172a; color: #f8fafc; }
      html.dark .bg-white { background-color: #1e293b !important; border-color: #334155 !important; color: #f8fafc !important; }
      html.dark .bg-slate-50 { background-color: #0f172a !important; border-color: #334155 !important; color: #f8fafc !important; }

      html.dark .text-slate-700 { color: #e2e8f0 !important; }
      html.dark .text-slate-600, html.dark .text-slate-500 { color: #cbd5e1 !important; }

    <!-- React and Babel -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- XLSX -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // ==========================================
        // FIREBASE CONFIG
        // ==========================================
        const firebaseConfig = {
          apiKey: "AIzaSyC3Hyi-tVMui0ZyPsezvoxxSFjCJQBme9Q",
          authDomain: "ss-app-87ac7.firebaseapp.com",
          projectId: "ss-app-87ac7",
          storageBucket: "ss-app-87ac7.firebasestorage.app",
          messagingSenderId: "7671656513",
          appId: "1:7671656513:web:21b51edb450bddd1aad6c0",
          measurementId: "G-LQPLFRBGKH"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(app);
        const auth = firebase.auth(app);
        
        // Enable offline persistence
        db.enablePersistence()
          .catch((err) => {
            if (err.code == 'failed-precondition') {
              console.log('Persistence failed');
            } else if (err.code == 'unimplemented') {
              console.log('Persistence not available');
            }
          });

        // Collections
        const studentsCollection = db.collection("students");

        // ==========================================
        // UTILS
        // ==========================================
        const cleanName = (name) => {
            if (!name) return "";
            return name.replace(/\s+\d+$/, '').trim();
        };

        const formatDateForInput = (timestamp) => {
            if (!timestamp) return new Date().toISOString().split('T')[0];
            if (timestamp.toDate) {
                return timestamp.toDate().toISOString().split('T')[0];
            }
            return new Date(timestamp).toISOString().split('T')[0];
        };

        const formatDate = (timestamp) => {
            if (!timestamp) return '';
            if (timestamp.toDate) {
                return timestamp.toDate().toLocaleDateString('ar-EG');
            }
            return new Date(timestamp).toLocaleDateString('ar-EG');
        };

        const exportToExcel = (students) => {
          const statusMap = { 'active': 'مستمر', 'transferred': 'منقول', 'left': 'تارك', 'graduated': 'متخرج' };
          const data = students.filter(s => !s.isDeleted).map(s => ({
            'الاسم الرباعي': cleanName(s.firstName),
            'العائلة': s.lastName || '',
            'رقم القيد': s.regNumber,
            'رقم الصفحة': s.pageNumber,
            'الحالة الدراسية': statusMap[s.status || 'active'] || 'مستمر',
            'ملاحظات': s.notes || '',
            'تاريخ التسجيل': formatDate(s.createdAt)
          }));
          const worksheet = XLSX.utils.json_to_sheet(data);
          const workbook = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(workbook, worksheet, "الطلاب");
          XLSX.writeFile(workbook, "سجل_القيود_العام.xlsx");
        };

        const generateTemplate = () => {
          const firstNames = ['محمد', 'أحمد', 'عبدالله', 'علي', 'عمر', 'خالد', 'سعد', 'سعيد', 'صالح', 'فهد', 'سلمان', 'يوسف', 'إبراهيم'];
          const secondNames = ['حسين', 'حسن', 'عبدالرحمن', 'محمود', 'مصطفى', 'جعفر', 'عباس', 'كاظم', 'رضا', 'مهدي'];
          const thirdNames = ['علي', 'محمد', 'جاسم', 'كريم', 'خلف', 'سالم', 'حمزة', 'فاضل'];
          const fourthNames = ['عبدالله', 'ناصر', 'منصور', 'خليفة', 'سلطان', 'يحيى', 'زكريا'];
          const titles = ['الشمري', 'العتيبي', 'القحطاني', 'العنزي', 'الحربي', 'الزهراني', 'المالكي', 'الدوسري', 'التميمي', 'الخالدي'];

          const templateData = [];
          
          for (let reg = 1; reg <= 10; reg++) {
            for (let i = 0; i < 200; i++) {
               const n1 = firstNames[Math.floor(Math.random() * firstNames.length)];
               const n2 = secondNames[Math.floor(Math.random() * secondNames.length)];
               const n3 = thirdNames[Math.floor(Math.random() * thirdNames.length)];
               const n4 = fourthNames[Math.floor(Math.random() * fourthNames.length)];
               const title = titles[Math.floor(Math.random() * titles.length)];
               
               const pageNum = Math.floor(i / 30) + 1;

               templateData.push({
                  'الاسم الرباعي': `${n1} ${n2} ${n3} ${n4}`, 
                  'العائلة': title,
                  'رقم القيد': reg.toString(),
                  'رقم الصفحة': pageNum.toString(),
                  'الحالة الدراسية': 'مستمر',
                  'ملاحظات': ''
               });
            }
          }

          const worksheet = XLSX.utils.json_to_sheet(templateData);
          const workbook = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(workbook, worksheet, "نموذج 2000 طالب");
          XLSX.writeFile(workbook, "نموذج_سجل_القيود_الكبير.xlsx");
        };

        const readExcel = (file) => {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
              try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheetName]);
                resolve(jsonData);
              } catch (err) { reject(err); }
            };
            reader.onerror = (error) => reject(error);
            reader.readAsArrayBuffer(file);
          });
        };

        // ==========================================
        // UI COMPONENTS
        // ==========================================
        const SkeletonLoader = () => (
          <div className="animate-pulse space-y-4">
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
              {[...Array(4)].map((_, i) => (
                <div key={i} className="bg-white p-3 rounded-xl border border-slate-100 h-20"></div>
              ))}
            </div>
            <div className="bg-white p-2 rounded-xl border border-slate-100 h-12"></div>
          </div>
        );

        const Modal = ({ children, onClose, zIndex = "z-50" }) => (
          <div className={`fixed inset-0 bg-slate-900/60 ${zIndex} flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in overflow-y-auto`} onClick={onClose}>
            <div className="w-full max-w-lg relative" onClick={e => e.stopPropagation()}>
                <button 
                    onClick={onClose} 
                    className="absolute top-3 left-3 p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-full transition-all z-[60]"
                    title="إغلاق"
                >
                    <span>✕</span>
                </button>
                {children}
            </div>
          </div>
        );

        const AlertModal = ({ message, type, onClose }) => (
          <Modal onClose={onClose} zIndex="z-[60]">
            <div className="bg-white rounded-2xl p-5 text-center shadow-2xl animate-slide-up">
              <div className={`w-12 h-12 rounded-full mx-auto flex items-center justify-center mb-3 ${type === 'error' ? 'bg-red-100 text-red-500' : 'bg-green-100 text-green-500'}`}>
                {type === 'error' ? <span>❌</span> : <span>✅</span>}
              </div>
              <p className="text-slate-800 font-bold mb-5 text-sm">{message}</p>
              <button onClick={onClose} className="w-full py-2.5 bg-slate-900 text-white rounded-xl font-bold text-sm">حسناً</button>
            </div>
          </Modal>
        );

        const ConfirmModal = ({ title, message, onConfirm, onCancel, isDestructive = false }) => (
          <Modal onClose={onCancel} zIndex="z-[60]">
            <div className="bg-white rounded-2xl p-5 text-center shadow-2xl animate-slide-up">
              <h3 className="text-lg font-bold text-slate-800 mb-2">{title}</h3>
              <p className="text-slate-500 mb-6 text-sm">{message}</p>
              <div className="flex gap-3">
                <button onClick={onCancel} className="flex-1 py-2.5 bg-slate-100 rounded-xl font-bold text-sm">إلغاء</button>
                <button onClick={onConfirm} className={`flex-1 py-2.5 text-white rounded-xl font-bold text-sm ${isDestructive ? 'bg-red-500' : 'bg-blue-600'}`}>تأكيد</button>
              </div>
            </div>
          </Modal>
        );

        const StatCard = ({ title, value, icon, colorClass, onClick }) => (
          <div onClick={onClick} className={`bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex flex-col items-center justify-center text-center gap-1.5 hover:shadow-md transition-all ${onClick ? 'cursor-pointer active:scale-95' : ''}`}>
            <div className={`p-2 rounded-xl ${colorClass} text-white shadow-md`}>{icon}</div>
            <div>
              <div className="text-xl font-black text-slate-800 font-mono">{value}</div>
              <div className="text-[10px] text-slate-500 font-bold">{title}</div>
            </div>
          </div>
        );

        const Tooltip = ({ children, text }) => (
          <div className="tooltip">
            {children}
            <span className="tooltip-text">{text}</span>
          </div>
        );

        const SingleStudentPrint = ({ student }) => {
          const statusLabels = { 'active': 'مستمر', 'transferred': 'منقول', 'left': 'تارك', 'graduated': 'متخرج' };
          const printDate = new Date().toLocaleDateString('ar-EG');
          return (
            <div className="hidden print:flex flex-col items-center justify-start w-full h-screen bg-white p-0 overflow-hidden">
              <div className="w-[190mm] h-[250mm] border-[6px] border-double border-slate-800 p-6 rounded-none relative overflow-hidden flex flex-col justify-between mx-auto mt-0 shadow-none">
                <div className="absolute top-2 right-2 w-16 h-16 border-t-4 border-r-4 border-slate-900"></div>
                <div className="absolute top-2 left-2 w-16 h-16 border-t-4 border-l-4 border-slate-900"></div>
                <div className="absolute bottom-2 right-2 w-16 h-16 border-b-4 border-r-4 border-slate-900"></div>
                <div className="absolute bottom-2 left-2 w-16 h-16 border-b-4 border-l-4 border-slate-900"></div>

                <div className="text-center border-b-2 border-slate-900 pb-4 mb-4 relative z-10">
                  <div className="flex justify-between items-start mb-2 px-2">
                    <div className="text-sm font-bold leading-relaxed">جمهورية العراق<br/>وزارة التربية<br/>المديرية العامة للتربية</div>
                    <div className="w-20 h-20 border-2 border-slate-800 rounded-full flex items-center justify-center bg-slate-50 shadow-sm"><span className="text-3xl">🎓</span></div>
                    <div className="text-sm font-bold leading-relaxed text-left">التاريخ: {printDate}<br/>العدد: ............</div>
                  </div>
                  <h1 className="text-4xl font-black text-slate-900 mt-4 font-cairo tracking-wide">بطاقة الطالب الشخصية</h1>
                  <p className="text-lg font-bold text-slate-600 mt-2 bg-slate-100 inline-block px-6 py-1 rounded-full border border-slate-300">نسخة طبق الأصل من سجل القيد</p>
                </div>

                <div className="flex-1 flex flex-col gap-4 justify-start pt-2 px-4 relative z-10">
                   <div className="text-center space-y-3 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                      <span className="text-lg font-bold text-slate-500 block">الاسم الرباعي والعائلة</span>
                      <div className="text-3xl font-black text-slate-900 pb-1">{cleanName(student.firstName)} {student.lastName || ''}</div>
                   </div>

                   <div className="grid grid-cols-2 gap-6 my-2">
                      <div className="border-2 border-slate-800 p-4 text-center rounded-xl bg-white shadow-[2px_2px_0px_0px_rgba(30,41,59,1)]">
                        <span className="text-base font-bold text-slate-600 uppercase block mb-1">رقم القيد العام</span>
                        <div className="text-5xl font-mono font-black text-slate-900 tracking-wider">{student.regNumber}</div>
                      </div>
                      <div className="border-2 border-slate-800 p-4 text-center rounded-xl bg-white shadow-[2px_2px_0px_0px_rgba(30,41,59,1)]">
                        <span className="text-base font-bold text-slate-600 uppercase block mb-1">رقم الصفحة</span>
                        <div className="text-5xl font-mono font-black text-slate-900 tracking-wider">{student.pageNumber}</div>
                      </div>
                   </div>

                   <div className="grid grid-cols-2 gap-6 text-right px-2 mt-2">
                      <div className="flex flex-col border-b-2 border-slate-200 pb-2">
                         <span className="text-base font-bold text-slate-500 mb-1">الوضع الأكاديمي</span>
                         <span className="text-2xl font-bold text-slate-900">{statusLabels[student.status || 'active']}</span>
                      </div>
                      <div className="flex flex-col border-b-2 border-slate-200 pb-2">
                         <span className="text-base font-bold text-slate-500 mb-1">تاريخ القيد</span>
                         <span className="text-2xl font-bold text-slate-900 font-mono">{formatDate(student.createdAt)}</span>
                      </div>
                      {student.notes && (
                        <div className="col-span-2 flex flex-col bg-yellow-50 p-3 rounded-xl border border-yellow-200 mt-1">
                           <span className="text-xs font-bold text-yellow-700 mb-1">ملاحظات</span>
                           <span className="text-lg font-bold text-slate-800">{student.notes}</span>
                        </div>
                      )}
                   </div>
                </div>

                <div className="mt-4 pt-4 border-t-2 border-slate-900 flex justify-between items-end px-8 pb-4 relative z-10">
                   <div className="text-center"><div className="h-16"></div><div className="font-bold text-lg text-slate-900 border-t-2 border-slate-900 pt-2 w-40 mx-auto">توقيع الموظف المختص</div></div>
                   <div className="text-center"><div className="h-16"></div><div className="font-bold text-lg text-slate-900 border-t-2 border-slate-900 pt-2 w-40 mx-auto">ختم وتوقيع المدير</div></div>
                </div>
                
                <div className="absolute inset-0 flex items-center justify-center opacity-[0.04] pointer-events-none z-0 select-none">
                     <div className="transform -rotate-45 text-[150px] font-black text-slate-900 whitespace-nowrap border-4 border-slate-900 p-12 rounded-3xl">وثيقة رسمية</div>
                </div>
              </div>
            </div>
          );
        };

        const PrintView = ({ students, title }) => {
          const sortedStudents = React.useMemo(() => {
             return [...students].sort((a, b) => (a.firstName || '').localeCompare(b.firstName || '')).map((s, i) => ({ ...s, printIndex: i + 1 }));
          }, [students]);

          const ROWS_PER_COLUMN_MAX = 31; 
          const COLUMNS_PER_PAGE = 2;
          const MAX_ITEMS_PER_PAGE = ROWS_PER_COLUMN_MAX * COLUMNS_PER_PAGE;
          const totalItems = sortedStudents.length;
          const totalPages = Math.ceil(totalItems / MAX_ITEMS_PER_PAGE);
          const printDate = new Date().toLocaleDateString('ar-EG');
          
          const pages = [];
          for (let i = 0; i < totalPages; i++) {
            pages.push(sortedStudents.slice(i * MAX_ITEMS_PER_PAGE, (i + 1) * MAX_ITEMS_PER_PAGE));
          }
          
          return (
            <div className="print-only text-[9.5pt] dir-rtl">
              {pages.map((pageStudents, pageIndex) => (
                <div key={pageIndex} className="print-page-container">
                   <div className="flex justify-between items-end border-b-2 border-black pb-2 mb-4 w-full h-[40px]">
                      <div className="text-[10px] font-medium text-gray-500 w-32 text-right">صفحة {pageIndex + 1} من {totalPages}</div>
                      <h1 className="text-xl font-bold flex-1 text-center">{title || "كشف القيد العام"}</h1>
                      <div className="text-[10px] font-medium text-gray-500 w-32 text-left">تاريخ: {printDate}</div>
                   </div>
                   <div className="flex flex-row gap-[8mm] flex-1">
                     {[0, 1].map((colIndex) => {
                       const colStudents = pageStudents.slice(colIndex * ROWS_PER_COLUMN_MAX, (colIndex + 1) * ROWS_PER_COLUMN_MAX);
                       return (
                         <div key={colIndex} className="flex-1 flex flex-col">
                           <table className="w-full border-collapse table-fixed">
                             <thead>
                               <tr className="bg-gray-100 h-[36px]">
                                 <th className="p-1 text-center w-[35px] text-[8.5pt]">م</th>
                                 <th className="p-1 text-right">الاسم الكامل</th>
                                 <th className="p-1 text-center w-[40px] font-bold text-[8.5pt]">قيد</th>
                                 <th className="p-1 text-center w-[40px] font-bold text-[8.5pt]">صفحة</th>
                               </tr>
                             </thead>
                             <tbody>
                               {Array.from({ length: ROWS_PER_COLUMN_MAX }).map((_, rowIndex) => {
                                 const s = colStudents[rowIndex];
                                 return (
                                   <tr key={rowIndex} className="h-[31px]">
                                     <td className="px-1 text-center font-medium whitespace-nowrap">{s ? s.printIndex : ''}</td>
                                     <td className="px-2 align-middle whitespace-nowrap overflow-hidden leading-relaxed font-bold">{s ? cleanName(s.firstName) + ' ' + (s.lastName || '') : ''}</td>
                                     <td className="px-1 text-center font-bold font-mono text-[10.5pt] align-middle">{s ? s.regNumber : ''}</td>
                                     <td className="px-1 text-center font-bold font-mono text-[10.5pt] align-middle">{s ? s.pageNumber : ''}</td>
                                   </tr>
                                 );
                               })}
                             </tbody>
                           </table>
                         </div>
                       );
                     })}
                   </div>
                </div>
              ))}
            </div>
          );
        };

        const Login = () => {
          const [email, setEmail] = React.useState('');
          const [password, setPassword] = React.useState('');
          const [error, setError] = React.useState('');
          const [loading, setLoading] = React.useState(false);

          const handleSubmit = async (e) => {
            e.preventDefault();
            setLoading(true);
            setError('');
            
            try {
              await auth.signInWithEmailAndPassword(email, password);
            } catch (err) {
              setError('البريد الإلكتروني أو كلمة المرور غير صحيحة');
            } finally {
              setLoading(false);
            }
          };

          return (
            <div className="min-h-screen bg-gradient-to-br from-blue-600 to-purple-600 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
                <div className="text-center mb-8">
                  <div className="w-20 h-20 bg-blue-600 rounded-2xl mx-auto mb-4 flex items-center justify-center transform -rotate-6">
                    <span className="text-white text-3xl">📋</span>
                  </div>
                  <h2 className="text-2xl font-bold text-slate-800">سجل القيد العام</h2>
                  <p className="text-slate-500 text-sm mt-1">نظام إدارة شؤون الطلاب</p>
                </div>
                
                <form onSubmit={handleSubmit} className="space-y-4">
                  <div>
                    <label className="block text-sm font-bold text-slate-500 mb-1">البريد الإلكتروني</label>
                    <input
                      type="email"
                      required
                      value={email}
                      onChange={(e) => setEmail(e.target.value)}
                      className="w-full p-3 border border-slate-200 rounded-xl outline-none focus:border-blue-500 transition-colors"
                      dir="ltr"
                    />
                  </div>
                  
                  <div>
                    <label className="block text-sm font-bold text-slate-500 mb-1">كلمة المرور</label>
                    <input
                      type="password"
                      required
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      className="w-full p-3 border border-slate-200 rounded-xl outline-none focus:border-blue-500 transition-colors"
                      dir="ltr"
                    />
                  </div>
                  
                  {error && (
                    <p className="text-red-500 text-sm text-center bg-red-50 p-2 rounded-lg">
                      {error}
                    </p>
                  )}
                  
                  <button
                    type="submit"
                    disabled={loading}
                    className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                  >
                    {loading ? 'جاري التحقق...' : 'دخول'}
                  </button>
                </form>
                
                <div className="mt-6 text-center text-sm text-slate-400">
                  <p>نظام موحد لإدارة سجلات الطلاب</p>
                </div>
              </div>
            </div>
          );
        };

        const themeColors = {
          slate: { primary: 'bg-slate-900', hover: 'hover:bg-slate-800', secondary: 'bg-blue-600', secondaryHover: 'hover:bg-blue-700', ring: 'focus:ring-blue-500', name: 'الأساسي (أزرق)' },
          purple: { primary: 'bg-violet-900', hover: 'hover:bg-violet-800', secondary: 'bg-purple-600', secondaryHover: 'hover:bg-purple-700', ring: 'focus:ring-purple-500', name: 'بنفسجي' },
          emerald: { primary: 'bg-teal-900', hover: 'hover:bg-teal-800', secondary: 'bg-emerald-600', secondaryHover: 'hover:bg-emerald-700', ring: 'focus:ring-emerald-500', name: 'أخضر' },
          rose: { primary: 'bg-rose-900', hover: 'hover:bg-rose-800', secondary: 'bg-red-600', secondaryHover: 'hover:bg-red-700', ring: 'focus:ring-red-500', name: 'أحمر' },
          amber: { primary: 'bg-amber-900', hover: 'hover:bg-amber-800', secondary: 'bg-orange-600', secondaryHover: 'hover:bg-orange-700', ring: 'focus:ring-orange-500', name: 'برتقالي' },
        };
        
        const App = () => {
          const [user, setUser] = React.useState(null);
          const [loading, setLoading] = React.useState(true);
          const [students, setStudents] = React.useState([]);
          const [view, setView] = React.useState('list');
          const [selectedId, setSelectedId] = React.useState(null);
          const [search, setSearch] = React.useState('');
          const [debouncedQuery, setDebouncedQuery] = React.useState(''); 
          const [selectedRegFilter, setSelectedRegFilter] = React.useState(''); 
          const [statusFilter, setStatusFilter] = React.useState('ALL');
          const [sortBy, setSortBy] = React.useState('recent');
          const [yearFilter, setYearFilter] = React.useState('ALL');
          const [showPrintModal, setShowPrintModal] = React.useState(false);
          const [printRegInput, setPrintRegInput] = React.useState('');
          const [visibleCount, setVisibleCount] = React.useState(150);
          const loadMoreRef = React.useRef(null);
          const [importing, setImporting] = React.useState(false);
          const [importProgress, setImportProgress] = React.useState(0);
          const [printMode, setPrintMode] = React.useState('list');
          const [alertConfig, setAlertConfig] = React.useState(null);
          const [confirmConfig, setConfirmConfig] = React.useState(null);
          const [showScrollTop, setShowScrollTop] = React.useState(false);
          const [similarStudents, setSimilarStudents] = React.useState([]);
          const [colorTheme, setColorTheme] = React.useState(localStorage.getItem('appTheme') || 'slate');
          const [isDarkMode, setIsDarkMode] = React.useState(localStorage.getItem('darkMode') === 'true');

          const currentTheme = themeColors[colorTheme] || themeColors.slate;

          // Auth state observer
          React.useEffect(() => {
            const unsubscribe = auth.onAuthStateChanged((user) => {
              setUser(user);
              setLoading(false);
            });
            return () => unsubscribe();
          }, []);

          // Load students
          React.useEffect(() => {
            if (!user) return;

            const unsubscribe = studentsCollection.onSnapshot((snapshot) => {
              const data = [];
              snapshot.forEach(doc => {
                const docData = doc.data();
                data.push({ 
                  id: doc.id, 
                  ...docData,
                  createdAt: docData.createdAt?.toDate ? docData.createdAt.toDate().getTime() : docData.createdAt 
                });
              });
              setStudents(data);
            }, (error) => {
              console.error("Error loading students:", error);
            });

            return () => unsubscribe();
          }, [user]);

          // Debounce search
          React.useEffect(() => {
            const timer = setTimeout(() => setDebouncedQuery(search), 300);
            return () => clearTimeout(timer);
          }, [search]);

          // Scroll to top button
          React.useEffect(() => {
             const handleScroll = () => {
                setShowScrollTop(window.scrollY > 300);
             };
             window.addEventListener('scroll', handleScroll);
             return () => window.removeEventListener('scroll', handleScroll);
          }, []);

          // Dark mode
          React.useEffect(() => {
            localStorage.setItem('darkMode', isDarkMode);
            if (isDarkMode) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
          }, [isDarkMode]);

          // Infinite scroll
          React.useEffect(() => {
            const observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting) setVisibleCount((prev) => prev + 50);
            }, { threshold: 0.1 });
            if (loadMoreRef.current) observer.observe(loadMoreRef.current);
            return () => observer.disconnect();
          }, [students.length]);

          // Stats
          const regsCount = React.useMemo(() => {
             return new Set(students.filter(s => !s.isDeleted).map(s => s.regNumber)).size;
          }, [students]);

          const regStats = React.useMemo(() => {
             const active = students.filter(s => !s.isDeleted);
             const statsMap = {};
             active.forEach(s => {
                 const reg = s.regNumber;
                 if (!statsMap[reg]) {
                     statsMap[reg] = { total: 0, active: 0, transferred: 0, left: 0, graduated: 0 };
                 }
                 statsMap[reg].total++;
                 const status = s.status || 'active';
                 if (statsMap[reg][status] !== undefined) {
                     statsMap[reg][status]++;
                 }
             });
             return Object.entries(statsMap).map(([reg, counts]) => ({ reg, ...counts })).sort((a, b) => Number(a.reg) - Number(b.reg));
          }, [students]);

          const statusStats = React.useMemo(() => {
            const active = students.filter(s => !s.isDeleted);
            const counts = { active: 0, transferred: 0, left: 0, graduated: 0 };
            active.forEach(s => {
                const st = s.status || 'active';
                if (counts[st] !== undefined) counts[st]++;
            });
            return [
                { label: 'مستمر', count: counts.active, color: 'bg-emerald-100 text-emerald-800' },
                { label: 'منقول', count: counts.transferred, color: 'bg-amber-100 text-amber-800' },
                { label: 'تارك', count: counts.left, color: 'bg-rose-100 text-rose-800' },
                { label: 'متخرج', count: counts.graduated, color: 'bg-blue-100 text-blue-800' }
            ];
          }, [students]);

          const years = React.useMemo(() => {
             const y = new Set(students.map(s => {
                const d = new Date(s.createdAt);
                return isNaN(d.getFullYear()) ? null : d.getFullYear();
             }).filter(y => y !== null));
             return Array.from(y).sort((a,b) => b - a);
          }, [students]);

          // Import handler
          const handleImport = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            setImporting(true);
            setImportProgress(0);
            
            try {
              const rows = await readExcel(file);
              const totalRows = rows.length;
              let count = 0;
              const batch = db.batch();
              
              rows.forEach((row, index) => {
                 const fName = row['الاسم الرباعي'] || row['الاسم الكامل'] || row['firstName'];
                 const reg = row['رقم القيد'] || row['regNumber'];
                 const page = row['رقم الصفحة'] || row['pageNumber'];
                 
                 if (fName && reg) {
                    const docRef = studentsCollection.doc();
                    batch.set(docRef, {
                       firstName: String(fName).trim(),
                       lastName: row['العائلة'] || '',
                       regNumber: String(reg).trim(),
                       pageNumber: String(page || '').trim(),
                       status: 'active',
                       isDeleted: false,
                       notes: row['ملاحظات'] || '',
                       createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    count++;
                 }
                 setImportProgress(Math.round((index / totalRows) * 100));
              });
              
              await batch.commit();
              setAlertConfig({ message: `تم استيراد ${count} سجل بنجاح`, type: 'success' });
            } catch (e) { 
              setAlertConfig({ message: "فشل الاستيراد", type: 'error' }); 
            }
            setImporting(false);
          };

          // Delete all data
          const executeDeleteAll = async () => {
             setConfirmConfig(null);
             setLoading(true);
             try {
               const snapshot = await studentsCollection.get();
               const batch = db.batch();
               snapshot.docs.forEach((doc) => {
                  batch.delete(doc.ref);
               });
               await batch.commit();
               setAlertConfig({ message: 'تم حذف جميع البيانات بنجاح', type: 'success' });
               setView('list');
             } catch (e) { 
               setAlertConfig({ message: "فشل حذف البيانات", type: 'error' }); 
             }
             finally { setLoading(false); }
          };

          // Restore student
          const handleRestore = async (id) => {
            try {
                await studentsCollection.doc(id).update({ isDeleted: false });
                setAlertConfig({ message: 'تمت استعادة السجل بنجاح', type: 'success' });
            } catch(e) { console.error(e); }
          };

          // Permanently delete
          const handleDeleteForever = (id) => {
            setConfirmConfig({
                title: "حذف نهائي",
                message: "هل أنت متأكد من حذف هذا السجل نهائياً؟ لا يمكن التراجع عن هذا الإجراء.",
                isDestructive: true,
                onConfirm: async () => {
                    await studentsCollection.doc(id).delete();
                    setConfirmConfig(null);
                    setAlertConfig({ message: 'تم الحذف النهائي', type: 'success' });
                }
            });
          };

          // Check similar names
          const checkSimilarStudents = (val) => {
            const name = val.trim();
            if (name.length < 2) {
                setSimilarStudents([]);
                return;
            }
            const matches = students.filter(s => 
                !s.isDeleted && 
                s.id !== selectedId &&
                s.firstName && s.firstName.includes(name)
            );
            setSimilarStudents(matches);
          };

          // Filter students
          const filtered = React.useMemo(() => {
            let res = students.filter(s => view === 'trash' ? s.isDeleted : !s.isDeleted);
            if (selectedRegFilter) res = res.filter(s => s.regNumber === selectedRegFilter);
            if (yearFilter !== 'ALL') res = res.filter(s => {
              const year = s.createdAt ? new Date(s.createdAt).getFullYear().toString() : '';
              return year === yearFilter;
            });
            if (statusFilter !== 'ALL') res = res.filter(s => (s.status || 'active') === statusFilter);
            if (debouncedQuery) {
               const q = debouncedQuery.toLowerCase();
               res = res.filter(s => {
                   const fullName = `${s.firstName || ''} ${s.lastName || ''}`.toLowerCase();
                   return fullName.includes(q);
               });
               res.sort((a, b) => {
                   const aName = `${a.firstName || ''} ${a.lastName || ''}`.toLowerCase();
                   const bName = `${b.firstName || ''} ${b.lastName || ''}`.toLowerCase();
                   
                   const aIndex = aName.indexOf(q);
                   const bIndex = bName.indexOf(q);
                   
                   if (aIndex !== bIndex) {
                       return aIndex - bIndex;
                   }
                   
                   if (sortBy === 'alphabetical') return (a.firstName || '').localeCompare(b.firstName || '');
                   return (b.createdAt || 0) - (a.createdAt || 0);
               });
            } else {
               if (sortBy === 'alphabetical') res.sort((a,b) => (a.firstName || '').localeCompare(b.firstName || ''));
               else res.sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));
            }
            return res;
          }, [students, debouncedQuery, selectedRegFilter, statusFilter, sortBy, yearFilter, view]);

          const displayed = React.useMemo(() => filtered.slice(0, visibleCount), [filtered, visibleCount]);

          if (loading) {
            return (
              <div className="min-h-screen flex items-center justify-center">
                <div className="text-center">
                  <div className="loading-spinner mx-auto mb-4"></div>
                  <p className="text-slate-600">جاري تحميل النظام...</p>
                </div>
              </div>
            );
          }

          if (!user) {
            return <Login />;
          }

          return (
            <>
              <div className="min-h-screen no-print pb-20">
                <header className="bg-white border-b sticky top-0 z-40 shadow-sm backdrop-blur-md bg-white/80">
                  <div className="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
                    <div className="flex items-center gap-2 font-bold text-base text-slate-800 cursor-pointer" onClick={() => setView('list')}>
                      <div className={`${currentTheme.primary} text-white p-1.5 rounded-lg shadow-lg transition-colors`}>
                        <span>📋</span>
                      </div>
                      <span>سجل القيد العام</span>
                    </div>
                    <div className="flex items-center gap-1.5">
                      <Tooltip text="تغيير الألوان">
                        <button onClick={() => setColorTheme(colorTheme === 'slate' ? 'purple' : colorTheme === 'purple' ? 'emerald' : 'slate')} className="p-2 text-slate-500 hover:bg-slate-100 rounded-full transition-colors">
                          <span>🎨</span>
                        </button>
                      </Tooltip>
                      
                      <Tooltip text="الوضع الليلي">
                        <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 text-slate-500 hover:bg-slate-100 rounded-full transition-colors">
                          {isDarkMode ? <span>☀️</span> : <span>🌙</span>}
                        </button>
                      </Tooltip>
                      
                      <Tooltip text="الإعدادات">
                        <button onClick={() => setView('settings')} className="p-2 text-slate-500 hover:bg-slate-100 rounded-full transition-colors">
                          <span>⚙️</span>
                        </button>
                      </Tooltip>
                      
                      <Tooltip text="تسجيل الخروج">
                        <button onClick={() => setConfirmConfig({ title: "تسجيل خروج", message: "هل أنت متأكد من تسجيل الخروج؟", onConfirm: () => auth.signOut() })} className="p-2 text-red-500 hover:bg-red-50 rounded-full transition-colors">
                          <span>🚪</span>
                        </button>
                      </Tooltip>
                    </div>
                  </div>
                </header>

                <main className="max-w-7xl mx-auto px-4 py-4">
                    {loading && students.length === 0 ? <SkeletonLoader /> : (
                        <div className="animate-fade-in space-y-4">
                          {view === 'trash' && (
                            <div className="flex items-center justify-between bg-red-50 p-3 rounded-xl border border-red-100 animate-slide-up">
                                <div className="flex items-center gap-2 text-red-700 font-bold text-sm">
                                    <span>🗑️</span>
                                    <span>سلة المحذوفات</span>
                                </div>
                                <button onClick={() => setView('list')} className="flex items-center gap-2 bg-white text-slate-700 px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm hover:bg-slate-50 transition-colors">
                                  <span>←</span> العودة إلى الرئيسية
                                </button>
                            </div>
                          )}

                          {view !== 'trash' && (
                            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
                                <StatCard title="إجمالي الطلاب" value={students.filter(s => !s.isDeleted).length} icon={<span>👥</span>} colorClass={currentTheme.secondary} />
                                <StatCard title="عدد القيود" value={regsCount} icon={<span>📚</span>} colorClass="bg-indigo-600" onClick={() => setView('stats')} />
                                <StatCard title="مستمر" value={students.filter(s => !s.isDeleted && s.status === 'active').length} icon={<span>✅</span>} colorClass="bg-emerald-600" />
                                <StatCard title="حالات أخرى" value={students.filter(s => !s.isDeleted && s.status !== 'active').length} icon={<span>⚠️</span>} colorClass="bg-amber-500" onClick={() => setView('statusStats')} />
                            </div>
                          )}

                          {/* Search Bar */}
                          <div className="bg-slate-50 p-1.5 rounded-xl border border-slate-200 transition-all mb-3">
                             <div className={`relative flex items-center bg-white rounded-lg border border-slate-200 px-3 py-1 focus-within:ring-2 ${currentTheme.ring} transition-all`}>
                                 <span className="text-slate-400 ml-1">🔍</span>
                                 <input 
                                   id="searchInput" 
                                   className="flex-1 bg-transparent outline-none text-slate-700 h-8 font-bold text-xs" 
                                   placeholder="ابحث باسم الطالب... (Ctrl+F)" 
                                   value={search} 
                                   onChange={(e) => setSearch(e.target.value)} 
                                 />
                                 {search && (
                                   <button onClick={() => setSearch('')} className="text-slate-400 hover:text-slate-600">
                                     <span>✕</span>
                                   </button>
                                 )}
                             </div>
                          </div>

                          {/* Filters */}
                          <div className="grid grid-cols-2 md:grid-cols-4 gap-2 items-center mb-4">
                              <select value={selectedRegFilter} onChange={(e) => setSelectedRegFilter(e.target.value)} className="bg-white rounded-lg px-2 py-2 border border-slate-200 text-xs font-bold outline-none h-9">
                                  <option value="">جميع القيود</option>
                                  {Array.from(new Set(students.filter(s => !s.isDeleted).map(s => s.regNumber))).sort((a,b) => Number(a)-Number(b)).map(r => <option key={r} value={r}>قيد رقم {r}</option>)}
                              </select>
                              <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} className="bg-white rounded-lg px-2 py-2 border border-slate-200 text-xs font-bold outline-none h-9">
                                  <option value="ALL">جميع الحالات</option>
                                  <option value="active">مستمر</option>
                                  <option value="transferred">منقول</option>
                                  <option value="left">تارك</option>
                                  <option value="graduated">متخرج</option>
                              </select>
                              <select value={sortBy} onChange={e => setSortBy(e.target.value)} className="bg-white rounded-lg px-2 py-2 border border-slate-200 text-xs font-bold outline-none h-9">
                                  <option value="recent">الأحدث أولاً</option>
                                  <option value="alphabetical">ترتيب أبجدي</option>
                              </select>
                              <select value={yearFilter} onChange={e => setYearFilter(e.target.value)} className="bg-white rounded-lg px-2 py-2 border border-slate-200 text-xs font-bold outline-none h-9">
                                  <option value="ALL">جميع السنوات</option>
                                  {years.map(y => <option key={y} value={y}>{y}</option>)}
                              </select>
                          </div>

                          {/* Action Buttons */}
                          <div className="flex gap-3">
                                <Tooltip text="إضافة طالب جديد (Ctrl+N)">
                                  <button onClick={() => { setSelectedId(null); setView('add'); setSimilarStudents([]); }} className={`flex-1 ${currentTheme.primary} ${currentTheme.hover} text-white px-4 py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-2 shadow-lg transition-colors`}>
                                    <span>➕</span> إضافة طالب جديد
                                  </button>
                                </Tooltip>
                                
                                <Tooltip text="طباعة السجل (Ctrl+P)">
                                  <button onClick={() => setShowPrintModal(true)} className="flex-1 bg-white text-slate-700 border px-4 py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-2 hover:bg-slate-50 transition-colors">
                                    <span>🖨️</span> طباعة السجل
                                  </button>
                                </Tooltip>
                          </div>

                          {/* Desktop Table View */}
                          <div className="hidden md:block bg-white rounded-2xl border shadow-xl overflow-hidden mt-3">
                            <table className="w-full text-right border-collapse">
                              <thead className="bg-slate-50/80 border-b border-slate-200 text-slate-500 text-[10px] font-bold uppercase">
                                <tr>
                                  <th className="px-4 py-2 w-12 text-center">#</th>
                                  <th className="px-4 py-2">اسم الطالب</th>
                                  <th className="px-4 py-2 w-28 text-center">رقم القيد</th>
                                  <th className="px-4 py-2 w-24 text-center">الصفحة</th>
                                  <th className="px-4 py-2 w-24 text-center">الحالة</th>
                                  {view === 'trash' && <th className="px-4 py-2 w-32 text-center">إجراءات</th>}
                                </tr>
                              </thead>

                            <div className="grid grid-cols-2 gap-3">
                               <div className={`${currentTheme.primary} text-white p-4 rounded-xl shadow-lg flex flex-col items-center justify-center transform transition-transform hover:scale-[1.02]`}>
                                   <span className="text-slate-200 text-[10px] font-bold uppercase tracking-wider mb-1">رقم القيد</span>
                                   <span className="text-3xl font-mono font-black">{s.regNumber}</span>
                               </div>
                               <div className="bg-white border-2 border-slate-100 p-4 rounded-xl shadow-sm flex flex-col items-center justify-center transform transition-transform hover:scale-[1.02]">
                                   <span className="text-slate-400 text-[10px] font-bold uppercase tracking-wider mb-1">رقم الصفحة</span>
                                   <span className="text-3xl font-mono font-black text-slate-800">{s.pageNumber}</span>
                               </div>
                            </div>

                            <div className="bg-slate-50 rounded-xl p-4 border border-slate-100 space-y-3">
                                <div className="flex justify-between items-center border-b border-slate-200 pb-3">
                                    <div className="flex items-center gap-2">
                                        <div className="p-1.5 bg-white rounded-lg shadow-sm"><span>📅</span></div>
                                        <div>
                                            <div className="text-[10px] font-bold text-slate-400">تاريخ القيد</div>
                                            <div className="font-bold text-slate-800 text-sm">{formatDate(s.createdAt)}</div>
                                        </div>
                                    </div>
                                </div>
                                <div className="flex justify-between items-center">
                                    <div className="flex items-center gap-2">
                                        <div className="p-1.5 bg-white rounded-lg shadow-sm"><span>ℹ️</span></div>
                                        <div>
                                            <div className="text-[10px] font-bold text-slate-400">الوضع الأكاديمي</div>
                                            <div className={`inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-bold mt-0.5 ${statusColors[s.status] || statusColors['active']}`}>
                                                {statusLabels[s.status] || 'مستمر'}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                {s.notes && (
                                    <div className="pt-3 border-t border-slate-200">
                                        <div className="text-[10px] font-bold text-slate-400 mb-1">ملاحظات</div>
                                        <p className="text-slate-700 font-medium leading-relaxed text-sm">{s.notes}</p>
                                    </div>
                                )}
                            </div>

                            <button onClick={() => { setSelectedId(s.id); setPrintMode('single'); setTimeout(() => window.print(), 500); }} className={`w-full ${currentTheme.secondary} ${currentTheme.secondaryHover} text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all shadow-lg text-sm`}>
                              <span>🖨️</span> طباعة البطاقة الشخصية
                            </button>
                            
                            <div className="flex gap-2">
                                <button onClick={() => { setView('edit'); setSimilarStudents([]); }} className="flex-1 bg-slate-100 py-2.5 rounded-xl font-bold hover:bg-slate-200 text-slate-700 transition-colors text-sm">
                                  تعديل البيانات
                                </button>
                                
                                {view !== 'trash' && (
                                    <button onClick={() => setConfirmConfig({ title: "حذف الطالب", message: "هل تريد نقل هذا الطالب إلى سلة المحذوفات؟", onConfirm: async () => { 
                                      await studentsCollection.doc(s.id).update({ isDeleted: true }); 
                                      setView('list'); 
                                      setConfirmConfig(null); 
                                      setSelectedId(null); 
                                      setAlertConfig({ message: 'تم نقل الطالب إلى سلة المحذوفات', type: 'success' }); 
                                    } })} className="flex-1 bg-red-50 text-red-600 py-2.5 rounded-xl font-bold hover:bg-red-100 transition-colors text-sm">
                                      حذف
                                    </button>
                                )}
                            </div>
                         </div>
                      </Modal>
                    );
                })()}

                {/* Print Modal */}
                {showPrintModal && (
                    <Modal onClose={() => setShowPrintModal(false)}>
                       <div className="bg-white rounded-2xl p-5 text-center space-y-3 shadow-xl">
                          <h3 className="text-lg font-bold">خيارات الطباعة</h3>
                          <button onClick={() => { setPrintMode('list'); setPrintRegInput(''); setShowPrintModal(false); setTimeout(() => window.print(), 500); }} className={`w-full py-2.5 ${currentTheme.primary} ${currentTheme.hover} text-white rounded-xl font-bold transition-colors text-sm`}>
                            طباعة السجل الحالي بالكامل
                          </button>
                          <div className="text-slate-400 text-[10px]">أو طباعة قيد محدد</div>
                          <select value={printRegInput} onChange={(e) => setPrintRegInput(e.target.value)} className={`w-full p-2.5 border rounded-xl text-center font-bold outline-none text-sm ${currentTheme.ring}`}>
                               <option value="">اختر رقم القيد...</option>
                               {Array.from(new Set(students.filter(s => !s.isDeleted).map(s => s.regNumber))).sort().map(r => <option key={r} value={r}>قيد رقم {r}</option>)}
                          </select>
                          <button onClick={() => { setPrintMode('list'); setSelectedRegFilter(printRegInput); setShowPrintModal(false); setTimeout(() => window.print(), 500); }} className={`w-full py-2.5 ${currentTheme.secondary} ${currentTheme.secondaryHover} text-white rounded-xl font-bold disabled:opacity-50 transition-colors text-sm`} disabled={!printRegInput}>
                            طباعة القيد المحدد
                          </button>
                       </div>
                    </Modal>
                )}

                {/* Confirm Modal */}
                {confirmConfig && (
                  <ConfirmModal 
                    title={confirmConfig.title} 
                    message={confirmConfig.message} 
                    onConfirm={confirmConfig.onConfirm} 
                    onCancel={() => setConfirmConfig(null)} 
                    isDestructive={confirmConfig.isDestructive} 
                  />
                )}
                
                {/* Alert Modal */}
                {alertConfig && (
                  <AlertModal 
                    message={alertConfig.message} 
                    type={alertConfig.type} 
                    onClose={() => setAlertConfig(null)} 
                  />
                )}
                
                {/* Import Progress */}
                {importing && (
                  <Modal onClose={() => {}} zIndex="z-[80]">
                    <div className="bg-white rounded-2xl p-8 flex flex-col items-center gap-4 shadow-2xl">
                      <div className="relative flex items-center justify-center">
                          <div className="loading-spinner"></div>
                          <div className="absolute text-sm font-bold text-blue-800" dir="ltr">{importProgress}%</div>
                      </div>
                      <h3 className="text-xl font-bold text-slate-800">جاري استيراد البيانات...</h3>
                      <p className="text-slate-500">يرجى الانتظار قليلاً</p>
                      <div className="w-full bg-slate-100 rounded-full h-2 mt-2 overflow-hidden">
                          <div className="bg-blue-600 h-2 rounded-full transition-all duration-300" style={{ width: `${importProgress}%` }}></div>
                      </div>
                    </div>
                  </Modal>
                )}
              </div>
              
              {/* Print Views */}
              {printMode === 'list' && <PrintView students={filtered} title={selectedRegFilter ? `كشف الطلاب - قيد رقم ${selectedRegFilter}` : "كشف القيد العام"} />}
              {printMode === 'single' && students.find(s=>s.id===selectedId) && <SingleStudentPrint student={students.find(s=>s.id===selectedId)} />}
            </>
          );
        };

        // Render app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
