    {
      "imports": {

<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef, useCallback } from 'react';
        import ReactDOM from 'react-dom/client';
        import { 
          Users, LogOut, Settings, Search, Plus, Printer, 
          Trash2, FileSpreadsheet, Download, Upload, AlertTriangle, ArrowRight, Save, X, FileText, CheckCircle2, XCircle, AlertCircle, ArrowUp, Filter, UserCheck, SortAsc, Type, ChevronDown, ListFilter, RotateCcw, Info, Calendar, Clock, ArrowLeft, Palette, Loader2, BarChart3, PieChart, Moon, Sun, Mic, Maximize2, Minimize2
        } from 'lucide-react';
        import { initializeApp } from "firebase/app";
        import { initializeFirestore, persistentLocalCache, collection, getDocs, addDoc, doc, updateDoc, deleteDoc, writeBatch, onSnapshot, query, where, getCountFromServer } from "firebase/firestore";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "firebase/auth";
        import * as XLSX from 'xlsx';

        // ==========================================
        // FIREBASE CONFIG
        // ==========================================
        const firebaseConfig = {
          apiKey: "AIzaSyC3Hyi-tVMui0ZyPsezvoxxSFjCJQBme9Q",
          authDomain: "ss-app-87ac7.firebaseapp.com",
          projectId: "ss-app-87ac7",
          storageBucket: "ss-app-87ac7.firebasestorage.app",
          messagingSenderId: "7671656513",
          appId: "1:7671656513:web:21b51edb450bddd1aad6c0",
          measurementId: "G-LQPLFRBGKH"
        };

        const app = initializeApp(firebaseConfig);
        
        // Initialize Firestore with Persistent Local Cache (Modern Way)
        const db = initializeFirestore(app, {
            localCache: persistentLocalCache()
        });

        const auth = getAuth(app);
        const studentsCollection = collection(db, "students");

        // ==========================================
        // UTILS
        // ==========================================
        const cleanName = (name) => {
            if (!name) return "";
            return name.replace(/\s+\d+$/, '').trim();
        };

        const formatDateForInput = (timestamp) => {
            if (!timestamp) return new Date().toISOString().split('T')[0];
            return new Date(timestamp).toISOString().split('T')[0];
        };

        const exportToExcel = (students) => {
          const statusMap = { 'active': 'مستمر', 'transferred': 'منقول', 'left': 'تارك', 'graduated': 'متخرج' };
          const data = students.map(s => ({
            'الاسم الرباعي': cleanName(s.firstName),
            'العائلة': s.lastName || '',
            'رقم القيد': s.regNumber,
            'رقم الصفحة': s.pageNumber,
            'الحالة الدراسية': statusMap[s.status || 'active'] || 'مستمر',
            'المرحلة': s.educationLevel || '',
            'الصف': s.grade || '',
            'الشعبة': s.section || '',
            'سنة التخرج': s.graduationYear || '',
            'جهة النقل': s.transferDestination || '',
            'تاريخ الترك': s.dropoutDate ? new Date(s.dropoutDate).toLocaleDateString('ar-EG') : '',
            'سبب الترك': s.dropoutReason || '',
            'ملاحظات': s.notes || '',
            'تاريخ التسجيل': new Date(s.createdAt).toLocaleDateString('ar-EG')
          }));
          const worksheet = XLSX.utils.json_to_sheet(data);
          const workbook = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(workbook, worksheet, "الطلاب");
          XLSX.writeFile(workbook, "سجل_القيود_العام.xlsx");
        };

        const generateTemplate = () => {
          const firstNames = ['محمد', 'أحمد', 'عبدالله', 'علي', 'عمر', 'خالد', 'سعد', 'سعيد', 'صالح', 'فهد', 'سلمان', 'يوسف', 'إبراهيم'];
          const secondNames = ['حسين', 'حسن', 'عبدالرحمن', 'محمود', 'مصطفى', 'جعفر', 'عباس', 'كاظم', 'رضا', 'مهدي'];
          const thirdNames = ['علي', 'محمد', 'جاسم', 'كريم', 'خلف', 'سالم', 'حمزة', 'فاضل'];
          const fourthNames = ['عبدالله', 'ناصر', 'منصور', 'خليفة', 'سلطان', 'يحيى', 'زكريا'];
          const titles = ['الشمري', 'العتيبي', 'القحطاني', 'العنزي', 'الحربي', 'الزهراني', 'المالكي', 'الدوسري', 'التميمي', 'الخالدي'];

          const templateData = [];
          
          for (let reg = 1; reg <= 10; reg++) {
            for (let i = 0; i < 200; i++) {
               const n1 = firstNames[Math.floor(Math.random() * firstNames.length)];
               const n2 = secondNames[Math.floor(Math.random() * secondNames.length)];
               const n3 = thirdNames[Math.floor(Math.random() * thirdNames.length)];
               const n4 = fourthNames[Math.floor(Math.random() * fourthNames.length)];
               const title = titles[Math.floor(Math.random() * titles.length)];
               
               const pageNum = Math.floor(i / 30) + 1;

               templateData.push({
                  'الاسم الرباعي': `${n1} ${n2} ${n3} ${n4}`, 
                  'العائلة': title,
                  'رقم القيد': reg.toString(),
                  'رقم الصفحة': pageNum.toString(),
                  'الحالة الدراسية': 'مستمر',
                  'المرحلة': i % 2 === 0 ? 'متوسطة' : 'إعدادية',
                  'الصف': i % 2 === 0 ? 'الثاني متوسط' : 'السادس الإعدادي',
                  'الشعبة': i % 2 === 0 ? 'أ' : 'علمي',
                  'ملاحظات': ''
               });
            }
          }

          const worksheet = XLSX.utils.json_to_sheet(templateData);
          const workbook = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(workbook, worksheet, "نموذج 2000 طالب");
          XLSX.writeFile(workbook, "نموذج_سجل_القيود_الكبير.xlsx");
        };

        const readExcel = (file) => {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
              try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheetName]);
                resolve(jsonData);
              } catch (err) { reject(err); }
            };
            reader.onerror = (error) => reject(error);
            reader.readAsArrayBuffer(file);
          });
        };
        
        // Request Notification Permission
        const requestNotificationPermission = async () => {
          if ('Notification' in window && Notification.permission !== 'granted' && Notification.permission !== 'denied') {
            await Notification.requestPermission();
          }
        };

        // Show Desktop Notification
        const showNotification = (title, body, icon = '📋') => {
          if ('Notification' in window && Notification.permission === 'granted') {
            new Notification(title, { body, icon: `data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>${icon}</text></svg>` });
          }
        };
        
        // ==========================================
        // UI COMPONENTS
        // ==========================================
        const SkeletonLoader = () => (
          <div className="animate-pulse space-y-4">
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
              {[...Array(2)].map((_, i) => ( // Reduced skeleton loaders
                <div key={i} className="bg-white p-3 rounded-xl border border-slate-100 h-20"></div>
              ))}
            </div>
            <div className="bg-white p-2 rounded-xl border border-slate-100 h-12"></div>
          </div>
        );

        const Modal = ({ children, onClose, zIndex = "z-50" }) => (
          <div className={`fixed inset-0 bg-slate-900/60 ${zIndex} flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in overflow-y-auto`} onClick={onClose}>
            <div className="w-full max-w-lg relative" onClick={e => e.stopPropagation()}>
                <button 
                    onClick={onClose} 
                    className="absolute top-3 left-3 p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-full transition-all z-[60]"
                    title="إغلاق"
                >
                    <X size={20} />
                </button>
                {children}
            </div>
          </div>
        );

        const AlertModal = ({ message, type, onClose }) => (
          <Modal onClose={onClose} zIndex="z-[60]">
            <div className="bg-white rounded-2xl p-5 text-center shadow-2xl animate-slide-up">
              <div className={`w-12 h-12 rounded-full mx-auto flex items-center justify-center mb-3 ${type === 'error' ? 'bg-red-100 text-red-500' : 'bg-green-100 text-green-500'}`}>
                {type === 'error' ? <AlertCircle size={24} /> : <CheckCircle2 size={24} />}
              </div>
              <p className="text-slate-800 font-bold mb-5 text-sm">{message}</p>
              <button onClick={onClose} className="w-full py-2.5 bg-slate-900 text-white rounded-xl font-bold text-sm">حسناً</button>
            </div>
          </Modal>
        );

        const ConfirmModal = ({ title, message, onConfirm, onCancel, isDestructive = false }) => (
          <Modal onClose={onCancel} zIndex="z-[60]">
            <div className="bg-white rounded-2xl p-5 text-center shadow-2xl animate-slide-up">
              <h3 className="text-lg font-bold text-slate-800 mb-2">{title}</h3>
              <p className="text-slate-500 mb-6 text-sm">{message}</p>
              <div className="flex gap-3">
                <button onClick={onCancel} className="flex-1 py-2.5 bg-slate-100 rounded-xl font-bold text-sm">إلغاء</button>
                <button onClick={onConfirm} className={`flex-1 py-2.5 text-white rounded-xl font-bold text-sm ${isDestructive ? 'bg-red-500' : 'bg-blue-600'}`}>تأكيد</button>
              </div>
            </div>
          </Modal>
        );

        const StatCard = ({ title, value, icon, colorClass, onClick }) => (
          <div onClick={onClick} className={`bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex flex-col items-center justify-center text-center gap-1.5 hover:shadow-md transition-all ${onClick ? 'cursor-pointer active:scale-95' : ''}`}>
            <div className={`p-2 rounded-xl ${colorClass} text-white shadow-md`}>{icon}</div>
            <div>
              <div className="text-xl font-black text-slate-800 font-mono">{value}</div>
              <div className="text-[10px] text-slate-500 font-bold">{title}</div>
            </div>
          </div>
        );

        const SingleStudentPrint = ({ student }) => {
          const statusLabels = { 'active': 'مستمر', 'transferred': 'منقول', 'left': 'تارك', 'graduated': 'متخرج' };
          const printDate = new Date().toLocaleDateString('ar-EG');
          return (
            <div className="hidden print:flex flex-col items-center justify-start w-full h-screen bg-white p-0 overflow-hidden">
              <div className="w-[190mm] h-[250mm] border-[6px] border-double border-slate-800 p-6 rounded-none relative overflow-hidden flex flex-col justify-between mx-auto mt-0 shadow-none">
                <div className="absolute top-2 right-2 w-16 h-16 border-t-4 border-r-4 border-slate-900"></div>
                <div className="absolute top-2 left-2 w-16 h-16 border-t-4 border-l-4 border-slate-900"></div>
                <div className="absolute bottom-2 right-2 w-16 h-16 border-b-4 border-r-4 border-slate-900"></div>
                <div className="absolute bottom-2 left-2 w-16 h-16 border-b-4 border-l-4 border-slate-900"></div>

                <div className="text-center border-b-2 border-slate-900 pb-4 mb-4 relative z-10">
                  <div className="flex justify-between items-start mb-2 px-2">
                    <div className="text-sm font-bold leading-relaxed">جمهورية العراق<br/>وزارة التربية<br/>المديرية العامة للتربية</div>
                    <div className="w-20 h-20 border-2 border-slate-800 rounded-full flex items-center justify-center bg-slate-50 shadow-sm"><span className="text-3xl">🎓</span></div>
                    <div className="text-sm font-bold leading-relaxed text-left">التاريخ: {printDate}<br/>العدد: ............</div>
                  </div>
                  <h1 className="text-4xl font-black text-slate-900 mt-4 font-cairo tracking-wide">بطاقة الطالب الشخصية</h1>
                  <p className="text-lg font-bold text-slate-600 mt-2 bg-slate-100 inline-block px-6 py-1 rounded-full border border-slate-300">نسخة طبق الأصل من سجل القيد</p>
                </div>

                <div className="flex-1 flex flex-col gap-4 justify-start pt-2 px-4 relative z-10">
                   <div className="text-center space-y-3 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                      <span className="text-lg font-bold text-slate-500 block">الاسم الرباعي والعائلة</span>
                      <div className="text-3xl font-black text-slate-900 pb-1">{cleanName(student.firstName)} {student.lastName || ''}</div>
                   </div>

                   <div className="grid grid-cols-2 gap-6 my-2">
                      <div className="border-2 border-slate-800 p-4 text-center rounded-xl bg-white shadow-[2px_2px_0px_0px_rgba(30,41,59,1)]">
                        <span className="text-base font-bold text-slate-600 uppercase block mb-1">رقم القيد العام</span>
                        <div className="text-5xl font-mono font-black text-slate-900 tracking-wider">{student.regNumber}</div>
                      </div>
                      <div className="border-2 border-slate-800 p-4 text-center rounded-xl bg-white shadow-[2px_2px_0px_0px_rgba(30,41,59,1)]">
                        <span className="text-base font-bold text-slate-600 uppercase block mb-1">رقم الصفحة</span>
                        <div className="text-5xl font-mono font-black text-slate-900 tracking-wider">{student.pageNumber}</div>
                      </div>
                   </div>

                   <div className="grid grid-cols-2 gap-6 text-right px-2 mt-2">
                      <div className="flex flex-col border-b-2 border-slate-200 pb-2">
                         <span className="text-base font-bold text-slate-500 mb-1">الوضع الأكاديمي</span>
                         <span className="text-2xl font-bold text-slate-900">{statusLabels[student.status || 'active']}</span>
                      </div>
                      <div className="flex flex-col border-b-2 border-slate-200 pb-2">
                         <span className="text-base font-bold text-slate-500 mb-1">تاريخ القيد</span>
                         <span className="text-2xl font-bold text-slate-900 font-mono">{new Date(student.createdAt).toLocaleDateString('ar-EG')}</span>
                      </div>
                      {student.educationLevel && (
                        <div className="flex flex-col border-b-2 border-slate-200 pb-2">
                           <span className="text-base font-bold text-slate-500 mb-1">المرحلة</span>
                           <span className="text-2xl font-bold text-slate-900">{student.educationLevel}</span>
                        </div>
                      )}
                      {student.grade && (
                        <div className="flex flex-col border-b-2 border-slate-200 pb-2">
                           <span className="text-base font-bold text-slate-500 mb-1">الصف</span>
                           <span className="text-2xl font-bold text-slate-900">{student.grade}</span>
                        </div>
                      )}
                      {student.section && (
                        <div className="flex flex-col border-b-2 border-slate-200 pb-2">
                           <span className="text-base font-bold text-slate-500 mb-1">الشعبة</span>
                           <span className="text-2xl font-bold text-slate-900">{student.section}</span>
                        </div>
                      )}
                      {student.graduationYear && student.status === 'graduated' && (
                        <div className="flex flex-col border-b-2 border-slate-200 pb-2">
                           <span className="text-base font-bold text-slate-500 mb-1">سنة التخرج</span>
                           <span className="text-2xl font-bold text-slate-900">{student.graduationYear}</span>
                        </div>
                      )}
                      {student.transferDestination && student.status === 'transferred' && (
                        <div className="flex flex-col border-b-2 border-slate-200 pb-2">
                           <span className="text-base font-bold text-slate-500 mb-1">جهة النقل</span>
                           <span className="text-2xl font-bold text-slate-900">{student.transferDestination}</span>
                        </div>
                      )}
                      {student.dropoutDate && student.status === 'left' && (
                        <div className="flex flex-col border-b-2 border-slate-200 pb-2">
                           <span className="text-base font-bold text-slate-500 mb-1">تاريخ الترك</span>
                           <span className="text-2xl font-bold text-slate-900">{new Date(student.dropoutDate).toLocaleDateString('ar-EG')}</span>
                        </div>
                      )}
                      {student.dropoutReason && student.status === 'left' && (
                        <div className="flex flex-col border-b-2 border-slate-200 pb-2">
                           <span className="text-base font-bold text-slate-500 mb-1">سبب الترك</span>
                           <span className="text-2xl font-bold text-slate-900">{student.dropoutReason}</span>

                   <div className="text-center"><div className="h-16"></div><div className="font-bold text-lg text-slate-900 border-t-2 border-slate-900 pt-2 w-40 mx-auto">ختم وتوقيع المدير</div></div>

              </div>

        };

        const PrintView = ({ students, title }) => {
          const sortedStudents = useMemo(() => {
             return [...students].sort((a, b) => a.firstName.localeCompare(b.firstName)).map((s, i) => ({ ...s, printIndex: i + 1 }));
          }, [students]);

          const ROWS_PER_COLUMN_MAX = 31; 
          const COLUMNS_PER_PAGE = 2;
          const MAX_ITEMS_PER_PAGE = ROWS_PER_COLUMN_MAX * COLUMNS_PER_PAGE;
          const totalItems = sortedStudents.length;
          const totalPages = Math.ceil(totalItems / MAX_ITEMS_PER_PAGE);
          const printDate = new Date().toLocaleDateString('ar-EG');
          
          const pages = [];
          for (let i = 0; i < totalPages; i++) {
            pages.push(sortedStudents.slice(i * MAX_ITEMS_PER_PAGE, (i + 1) * MAX_ITEMS_PER_PAGE));
          }
          
          return (
            <div className="print-only text-[9.5pt] dir-rtl">
              {pages.map((pageStudents, pageIndex) => (
                <div key={pageIndex} className="print-page-container">
                   <div className="flex justify-between items-end border-b-2 border-black pb-2 mb-4 w-full h-[40px]">
                      <div className="text-[10px] font-medium text-gray-500 w-32 text-right">صفحة {pageIndex + 1} من {totalPages}</div>
                      <h1 className="text-xl font-bold flex-1 text-center">{title || "كشف القيد العام"}</h1>
                      <div className="text-[10px] font-medium text-gray-500 w-32 text-left">تاريخ: {printDate}</div>
                   </div>
                   <div className="flex flex-row gap-[8mm] flex-1">
                     {[0, 1].map((colIndex) => {
                       const colStudents = pageStudents.slice(colIndex * ROWS_PER_COLUMN_MAX, (colIndex + 1) * ROWS_PER_COLUMN_MAX);
                       return (
                         <div key={colIndex} className="flex-1 flex flex-col">
                           <table className="w-full border-collapse table-fixed">
                             <thead>
                               <tr className="bg-gray-100 h-[36px]">
                                 <th className="p-1 text-center w-[35px] text-[8.5pt]">ت</th>
                                 <th className="p-1 text-right">الاسم الكامل</th>
                                 <th className="p-1 text-center w-[40px] font-bold text-[8.5pt]">قيد</th>
                                 <th className="p-1 text-center w-[40px] font-bold text-[8.5pt]">ص</th>
                               </tr>
                             </thead>
                             <tbody>
                               {Array.from({ length: ROWS_PER_COLUMN_MAX }).map((_, rowIndex) => {
                                 const s = colStudents[rowIndex];
                                 return (
                                   <tr key={rowIndex} className="h-[31px]">
                                     <td className="px-1 text-center font-medium whitespace-nowrap">{s ? s.printIndex : ''}</td>
                                     <td className="px-2 align-middle whitespace-nowrap overflow-hidden leading-relaxed font-bold">{s ? cleanName(s.firstName) + ' ' + (s.lastName || '') : ''}</td>
                                     <td className="px-1 text-center font-bold font-mono text-[10.5pt] align-middle">{s ? s.regNumber : ''}</td>
                                     <td className="px-1 text-center font-bold font-mono text-[10.5pt] align-middle">{s ? s.pageNumber : ''}</td>
                                   </tr>
                                 );
                               })}
                             </tbody>
                           </table>
                         </div>
                       );
                     })}
                   </div>
                </div>
              ))}
            </div>
          );
        };

        const Login = () => {
          const [email, setEmail] = useState('');
          const [password, setPassword] = useState('');
          const [error, setError] = useState('');
          const [loading, setLoading] = useState(false);
          const handleSubmit = async (e) => {
            e.preventDefault();
            setLoading(true);
            try { await signInWithEmailAndPassword(auth, email, password); } 
            catch (err) { setError('البريد الإلكتروني أو كلمة المرور غير صحيحة'); } 
            finally { setLoading(false); }
          };
          return (
            <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4" dir="rtl">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-md p-8 animate-fade-in">
                <div className="text-center mb-8">
                  <div className="w-16 h-16 bg-blue-600 rounded-2xl mx-auto mb-4 flex items-center justify-center shadow-lg"><Users className="w-8 h-8 text-white" /></div>
                  <h2 className="text-2xl font-bold text-slate-800">الدخول إلى النظام</h2>
                </div>
                <form onSubmit={handleSubmit} className="space-y-4">
                  <input type="email" required className="w-full px-4 py-3 rounded-xl border border-slate-300 outline-none text-left bg-slate-50" dir="ltr" placeholder="البريد الإلكتروني" value={email} onChange={(e) => setEmail(e.target.value)} />
                  <input type="password" required className="w-full px-4 py-3 rounded-xl border border-slate-300 outline-none text-left bg-slate-50" dir="ltr" placeholder="كلمة المرور" value={password} onChange={(e) => setPassword(e.target.value)} />
                  {error && <p className="text-red-500 text-sm text-center">{error}</p>}
                  <button type="submit" disabled={loading} className="w-full bg-slate-900 text-white font-bold py-4 rounded-xl shadow-lg transition-all">{loading ? 'جاري التحقق...' : 'دخول'}</button>
                </form>
              </div>
            </div>
          );
        };

        const themeColors = {
          slate: { primary: 'bg-slate-900', hover: 'hover:bg-slate-800', secondary: 'bg-blue-600', secondaryHover: 'hover:bg-blue-700', ring: 'focus:ring-blue-500', name: 'الأساسي (أزرق)' },
          purple: { primary: 'bg-violet-900', hover: 'hover:bg-violet-800', secondary: 'bg-purple-600', secondaryHover: 'hover:bg-purple-700', ring: 'focus:ring-purple-500', name: 'بنفسجي' },
          emerald: { primary: 'bg-teal-900', hover: 'hover:bg-teal-800', secondary: 'bg-emerald-600', secondaryHover: 'hover:bg-emerald-700', ring: 'focus:ring-emerald-500', name: 'أخضر' },
          rose: { primary: 'bg-rose-900', hover: 'hover:bg-rose-800', secondary: 'bg-red-600', secondaryHover: 'hover:bg-red-700', ring: 'focus:ring-red-500', name: 'أحمر' },
          amber: { primary: 'bg-amber-900', hover: 'hover:bg-amber-800', secondary: 'bg-orange-600', secondaryHover: 'hover:bg-orange-700', ring: 'focus:ring-orange-500', name: 'برتقالي' },
        };
        
        const App = () => {
          const [user, setUser] = useState(null);
          const [loading, setLoading] = useState(true);
          const [students, setStudents] = useState([]);
          const [view, setView] = useState('list');
          const [selectedId, setSelectedId] = useState(null);
          const [search, setSearch] = useState('');
          const [debouncedQuery, setDebouncedQuery] = useState(''); 
          const [selectedRegFilter, setSelectedRegFilter] = useState(''); 
          const [statusFilter, setStatusFilter] = useState('ALL');
          const [sortBy, setSortBy] = useState('recent');
          const [yearFilter, setYearFilter] = useState('ALL');
          const [showPrintModal, setShowPrintModal] = useState(false);
          const [printRegInput, setPrintRegInput] = useState('');
          const [visibleCount, setVisibleCount] = useState(150);
          const loadMoreRef = useRef(null);
          const [importing, setImporting] = useState(false);
          const [importProgress, setImportProgress] = useState(0);
          const [printMode, setPrintMode] = useState('list');
          const [alertConfig, setAlertConfig] = useState(null);
          const [confirmConfig, setConfirmConfig] = useState(null);
          const [showScrollTop, setShowScrollTop] = useState(false);
          const [similarStudents, setSimilarStudents] = useState([]);
          const [colorTheme, setColorTheme] = useState(localStorage.getItem('appTheme') || 'slate');
          const [isDarkMode, setIsDarkMode] = useState(localStorage.getItem('darkMode') === 'true');
          const [showThemeModal, setShowThemeModal] = useState(false);
          // Voice Search State
          const [isListening, setIsListening] = useState(false);
          // Fullscreen State
          const [isFullscreen, setIsFullscreen] = useState(false);
          // Toast for shortcuts
          const [showShortcutToast, setShowShortcutToast] = useState(() => {
            return !localStorage.getItem('shortcutsToastShown');
          });

          const currentTheme = themeColors[colorTheme] || themeColors.slate;

          const [stats, setStats] = React.useState({ total: 0, active: 0, graduated: 0 });

          const regsCount = useMemo(() => {
             return new Set(students.filter(s => !s.isDeleted).map(s => s.regNumber)).size;
          }, [students]);

          const regStats = useMemo(() => {
             const active = students.filter(s => !s.isDeleted);
             const statsMap = {};
             active.forEach(s => {
                 const reg = s.regNumber;
                 if (!statsMap[reg]) {
                     statsMap[reg] = { total: 0, active: 0, transferred: 0, left: 0, graduated: 0 };
                 }
                 statsMap[reg].total++;
                 const status = s.status || 'active';
                 if (statsMap[reg][status] !== undefined) {
                     statsMap[reg][status]++;
                 }
             });
             return Object.entries(statsMap).map(([reg, counts]) => ({ reg, ...counts })).sort((a, b) => Number(a.reg) - Number(b.reg));
          }, [students]);

          const statusStats = useMemo(() => {
            const active = students.filter(s => !s.isDeleted);
            const counts = { active: 0, transferred: 0, left: 0, graduated: 0 };
            active.forEach(s => {
                const st = s.status || 'active';
                if (counts[st] !== undefined) counts[st]++;
            });
            return [
                { label: 'مستمر', count: counts.active, color: 'bg-emerald-100 text-emerald-800' },
                { label: 'منقول', count: counts.transferred, color: 'bg-amber-100 text-amber-800' },
                { label: 'تارك', count: counts.left, color: 'bg-rose-100 text-rose-800' },
                { label: 'متخرج', count: counts.graduated, color: 'bg-blue-100 text-blue-800' }
            ];
          }, [students]);

          const years = useMemo(() => {
             const y = new Set(students.map(s => {
                const d = new Date(s.createdAt);
                return isNaN(d.getFullYear()) ? null : d.getFullYear();
             }).filter(y => y !== null));
             return Array.from(y).sort((a,b) => b - a);
          }, [students]);

          const refreshStats = async () => {
             try {
                 const baseConstraints = [where("isDeleted", "==", false)];
                 if (selectedRegFilter) baseConstraints.push(where("regNumber", "==", selectedRegFilter));
                 
                 const totalQ = query(studentsCollection, ...baseConstraints);
                 const totalSnap = await getCountFromServer(totalQ);
                 const total = totalSnap.data().count;

                 const activeQ = query(studentsCollection, ...baseConstraints, where("status", "==", "active"));
                 const activeSnap = await getCountFromServer(activeQ);
                 const active = activeSnap.data().count;

                 const graduatedQ = query(studentsCollection, ...baseConstraints, where("status", "==", "graduated"));
                 const graduatedSnap = await getCountFromServer(graduatedQ);
                 const graduated = graduatedSnap.data().count;

                 setStats({ total, active, graduated });
             } catch (error) {
                 console.error("Error fetching stats:", error);
             }
          };

          // Request notification permission on load
          useEffect(() => {
            requestNotificationPermission();
          }, []);

          // Hide shortcut toast after 5 seconds
          useEffect(() => {
            if (showShortcutToast) {
              const timer = setTimeout(() => {
                setShowShortcutToast(false);
                localStorage.setItem('shortcutsToastShown', 'true');
              }, 5000);
              return () => clearTimeout(timer);
            }
          }, [showShortcutToast]);

          // Keyboard shortcuts
          useEffect(() => {
            const handleKeyDown = (e) => {
              // Ctrl+F for search
              if (e.ctrlKey && e.key === 'f') {
                e.preventDefault();
                document.getElementById('searchInput')?.focus();
                setAlertConfig({ message: 'اختصار: Ctrl+F للبحث', type: 'success' });
              }
              // Ctrl+P for print
              if (e.ctrlKey && e.key === 'p') {
                e.preventDefault();
                setShowPrintModal(true);
                setAlertConfig({ message: 'اختصار: Ctrl+P للطباعة', type: 'success' });
              }
              // Ctrl+N for new student
              if (e.ctrlKey && e.key === 'n') {
                e.preventDefault();
                setSelectedId(null);
                setView('add');
                setSimilarStudents([]);
                setAlertConfig({ message: 'اختصار: Ctrl+N لإضافة طالب', type: 'success' });
              }
              // F11 for fullscreen
              if (e.key === 'F11') {
                e.preventDefault();
                toggleFullscreen();
              }
            };
            window.addEventListener('keydown', handleKeyDown);
            return () => window.removeEventListener('keydown', handleKeyDown);
          }, []);

          // Fullscreen toggle function
          const toggleFullscreen = () => {
            if (!document.fullscreenElement) {
              document.documentElement.requestFullscreen();
              setIsFullscreen(true);
            } else {
              if (document.exitFullscreen) {
                document.exitFullscreen();
                setIsFullscreen(false);
              }
            }
          };

          // Listen for fullscreen change events
          useEffect(() => {
            const handleFullscreenChange = () => {
              setIsFullscreen(!!document.fullscreenElement);
            };
            document.addEventListener('fullscreenchange', handleFullscreenChange);
            return () => document.removeEventListener('fullscreenchange', handleFullscreenChange);
          }, []);

          useEffect(() => {
             if (user) {
                 refreshStats();
             }
          }, [user, selectedRegFilter]);

          useEffect(() => {
            const unsub = onAuthStateChanged(auth, (u) => {
              setUser(u);
              if (!u) setLoading(false);
            });
            return () => unsub();
          }, []);

          useEffect(() => {
            if (!user) return;
            setLoading(true);
            const unsubscribe = onSnapshot(studentsCollection, (snapshot) => {
               const data = [];
               snapshot.forEach(d => {
                  const raw = d.data();
                  const createdAt = raw.createdAt?.toMillis ? raw.createdAt.toMillis() : (raw.createdAt || Date.now());
                  data.push({ id: d.id, ...raw, createdAt });
               });
               data.sort((a,b) => b.createdAt - a.createdAt);
               setStudents(data);
               setLoading(false);
            }, (error) => {
               console.error("Error fetching students:", error);
               setLoading(false);
            });
            return () => unsubscribe();
          }, [user]);

          useEffect(() => {
            const timer = setTimeout(() => setDebouncedQuery(search), 300);
            return () => clearTimeout(timer);
          }, [search]);

          useEffect(() => {
             const handleScroll = () => {
                setShowScrollTop(window.scrollY > 300);
             };
             window.addEventListener('scroll', handleScroll);
             return () => window.removeEventListener('scroll', handleScroll);
          }, []);

          useEffect(() => {
            localStorage.setItem('appTheme', colorTheme);
          }, [colorTheme]);

          useEffect(() => {
            localStorage.setItem('darkMode', isDarkMode);
            if (isDarkMode) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
          }, [isDarkMode]);

          useEffect(() => {
            const observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting) setVisibleCount((prev) => prev + 50);
            }, { threshold: 0.1 });
            if (loadMoreRef.current) observer.observe(loadMoreRef.current);
            return () => observer.disconnect();
          }, [students.length]);

          const handleImport = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            setImporting(true);
            setImportProgress(0);
            try {
              const rows = await readExcel(file);
              const totalRows = rows.length;
              let count = 0;
              let batch = writeBatch(db);
              let batchCount = 0;
              
              for (let i = 0; i < totalRows; i++) {
                 const row = rows[i];
                 const fName = row['الاسم الرباعي'] || row['الاسم الكامل'] || row['firstName'] || row['الاسم الأول'];
                 const reg = row['رقم القيد'] || row['regNumber'];
                 const page = row['رقم الصفحة'] || row['pageNumber'];
                 if (fName && reg) {
                    const ref = doc(studentsCollection);
                    batch.set(ref, {
                       firstName: String(fName).trim(),
                       lastName: row['العائلة'] || '',
                       regNumber: String(reg).trim(),
                       pageNumber: String(page || '').trim(),
                       educationLevel: row['المرحلة'] || '',
                       grade: row['الصف'] || '',
                       section: row['الشعبة'] || '',
                       graduationYear: row['سنة التخرج'] || '',
                       transferDestination: row['جهة النقل'] || '',
                       dropoutDate: row['تاريخ الترك'] ? new Date(row['تاريخ الترك']).getTime() : null,
                       dropoutReason: row['سبب الترك'] || '',
                       status: row['الحالة الدراسية'] === 'منقول' ? 'transferred' : 
                               row['الحالة الدراسية'] === 'تارك' ? 'left' : 
                               row['الحالة الدراسية'] === 'متخرج' ? 'graduated' : 'active',
                       isDeleted: false,
                       createdAt: Date.now() + count
                    });
                    count++;
                    batchCount++;
                    
                    if (batchCount === 400) {
                        await batch.commit();
                        batch = writeBatch(db);
                        batchCount = 0;
                        setImportProgress(Math.round((i / totalRows) * 100));
                    }
                 }
              }
              
              if (batchCount > 0) {
                  await batch.commit();
              }
              
              setImportProgress(100);
              await refreshStats();
              setAlertConfig({ message: `تم استيراد ${count} سجل بنجاح`, type: 'success' });
              showNotification('استيراد ناجح', `تم استيراد ${count} سجل بنجاح`, '✅');
            } catch (e) { 
              setAlertConfig({ message: "فشل الاستيراد", type: 'error' });
              showNotification('فشل الاستيراد', 'حدث خطأ أثناء استيراد الملف', '❌');
            }
            setImporting(false);
            setTimeout(() => setImportProgress(0), 500);
          };

          const executeDeleteAll = async () => {
             setConfirmConfig(null);
             setLoading(true);
             try {
               const snap = await getDocs(studentsCollection);
               const CHUNK_SIZE = 400;
               const allDocs = snap.docs;
               for (let i = 0; i < allDocs.length; i += CHUNK_SIZE) {
                  const batch = writeBatch(db);
                  const chunk = allDocs.slice(i, i + CHUNK_SIZE);
                  chunk.forEach((d) => batch.delete(d.ref));
                  await batch.commit();
               }
               await refreshStats();
               setAlertConfig({ message: 'تم حذف جميع البيانات بنجاح', type: 'success' });
               setView('list');
             } catch (e) { setAlertConfig({ message: "فشل حذف البيانات", type: 'error' }); }
             finally { setLoading(false); }
          };

          const handleRestore = async (id) => {
            try {
                await updateDoc(doc(db, "students", id), { isDeleted: false });
                await refreshStats();
                setAlertConfig({ message: 'تمت استعادة السجل بنجاح', type: 'success' });
            } catch(e) { console.error(e); }
          };

          const handleDeleteForever = (id) => {
            setConfirmConfig({
                title: "حذف نهائي",
                message: "هل أنت متأكد من حذف هذا السجل نهائياً؟ لا يمكن التراجع عن هذا الإجراء.",
                isDestructive: true,
                onConfirm: async () => {
                    await deleteDoc(doc(db, "students", id));
                    await refreshStats();
                    setConfirmConfig(null);
                    setAlertConfig({ message: 'تم الحذف النهائي', type: 'success' });
                }
            });
          };

          const checkSimilarStudents = (val) => {
            const name = val.trim();
            if (name.length < 2) {
                setSimilarStudents([]);
                return;
            }
            const matches = students.filter(s => 
                !s.isDeleted && 
                s.id !== selectedId &&
                s.firstName.includes(name)
            );
            setSimilarStudents(matches);
          };

          const filtered = useMemo(() => {
            let res = students.filter(s => view === 'trash' ? s.isDeleted : !s.isDeleted);
            if (selectedRegFilter) res = res.filter(s => s.regNumber === selectedRegFilter);
            if (yearFilter !== 'ALL') res = res.filter(s => new Date(s.createdAt).getFullYear().toString() === yearFilter);
            if (statusFilter !== 'ALL') res = res.filter(s => (s.status || 'active') === statusFilter);
            if (debouncedQuery) {
               const q = debouncedQuery.toLowerCase();
               res = res.filter(s => {
                   const fullName = `${s.firstName} ${s.lastName || ''}`.toLowerCase();
                   return fullName.includes(q);
               });
               res.sort((a, b) => {
                   const aName = `${a.firstName} ${a.lastName || ''}`.toLowerCase();
                   const bName = `${b.firstName} ${b.lastName || ''}`.toLowerCase();
                   
                   const aIndex = aName.indexOf(q);
                   const bIndex = bName.indexOf(q);
                   
                   if (aIndex !== bIndex) {
                       return aIndex - bIndex;
                   }
                   
                   if (sortBy === 'alphabetical') return a.firstName.localeCompare(b.firstName);
                   return b.createdAt - a.createdAt;
               });
            } else {
               if (sortBy === 'alphabetical') res.sort((a,b) => a.firstName.localeCompare(b.firstName));
               else res.sort((a,b) => b.createdAt - a.createdAt);
            }
            return res;
          }, [students, debouncedQuery, selectedRegFilter, statusFilter, sortBy, yearFilter, view]);

          const displayed = useMemo(() => filtered.slice(0, visibleCount), [filtered, visibleCount]);
          const arabicLetters = ['أ', 'ا', 'ب', 'ت', 'ث', 'ج', 'ح', 'خ', 'د', 'ذ', 'ر', 'ز', 'س', 'ش', 'ص', 'ض', 'ط', 'ظ', 'ع', 'غ', 'ف', 'ق', 'ك', 'ل', 'م', 'ن', 'هـ', 'و', 'ي'];

          // Voice Search Function
          const startVoiceSearch = () => {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
              setAlertConfig({ message: 'متصفحك لا يدعم خاصية البحث الصوتي', type: 'error' });
              return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA';
            recognition.continuous = false;
            recognition.interimResults = false;

            setIsListening(true);

            recognition.onstart = () => {
              console.log('Voice recognition started');
            };

            recognition.onresult = (event) => {
              const transcript = event.results[0][0].transcript;
              setSearch(transcript);
              setIsListening(false);
            };

            recognition.onerror = (event) => {
              console.error('Speech recognition error', event.error);
              setIsListening(false);
              if (event.error === 'no-speech') {
                setAlertConfig({ message: 'لم يتم التقاط أي صوت، حاول مرة أخرى', type: 'error' });
              } else {
                setAlertConfig({ message: 'حدث خطأ في التعرف على الصوت', type: 'error' });
              }
            };

            recognition.onend = () => {
              setIsListening(false);

                            </div>

                            <button onClick={() => { setSelectedId(s.id); setPrintMode('single'); setTimeout(() => window.print(), 500); }} className={`w-full ${currentTheme.secondary} ${currentTheme.secondaryHover} text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all shadow-lg text-sm`} title="طباعة بطاقة الطالب الشخصية"><Printer size={18}/> طباعة البطاقة الشخصية</button>
                            <div className="flex gap-2">
                                <button onClick={() => { setView('edit'); setSimilarStudents([]); }} className="flex-1 bg-slate-100 py-2.5 rounded-xl font-bold hover:bg-slate-200 text-slate-700 transition-colors text-sm" title="تعديل بيانات الطالب">تعديل البيانات</button>
                                {view !== 'trash' && (
                                    <button onClick={() => setConfirmConfig({ title: "حذف الطالب", message: "هل تريد نقل هذا الطالب إلى سلة المحذوفات؟", onConfirm: async () => { await updateDoc(doc(db, "students", s.id), { isDeleted: true }); setView('list'); setConfirmConfig(null); setSelectedId(null); setAlertConfig({ message: 'تم نقل الطالب إلى سلة المحذوفات', type: 'success' }); await refreshStats(); } })} className="flex-1 bg-red-50 text-red-600 py-2.5 rounded-xl font-bold hover:bg-red-100 transition-colors text-sm" title="نقل الطالب إلى سلة المحذوفات">حذف</button>
                                )}
                            </div>
                         </div>
                      </Modal>
                    );
                })()}

                {showPrintModal && (
                    <Modal onClose={() => setShowPrintModal(false)}>
                       <div className="bg-white rounded-2xl p-5 text-center space-y-3 shadow-xl">
                          <h3 className="text-lg font-bold">خيارات الطباعة</h3>
                          <button onClick={() => { setPrintMode('list'); setPrintRegInput(''); setShowPrintModal(false); setTimeout(() => window.print(), 500); }} className={`w-full py-2.5 ${currentTheme.primary} ${currentTheme.hover} text-white rounded-xl font-bold transition-colors text-sm`} title="طباعة جميع السجلات">طباعة السجل الحالي بالكامل</button>
                          <div className="text-slate-400 text-[10px]">أو طباعة قيد محدد</div>
                          <select value={printRegInput} onChange={(e) => setPrintRegInput(e.target.value)} className={`w-full p-2.5 border rounded-xl text-center font-bold outline-none text-sm ${currentTheme.ring}`} title="اختر رقم القيد للطباعة">
                               <option value="">اختر رقم القيد...</option>
                               {Array.from(new Set(students.filter(s => !s.isDeleted).map(s => s.regNumber))).sort().map(r => <option key={r} value={r}>قيد رقم {r}</option>)}
                          </select>
                          <button onClick={() => { setPrintMode('list'); setSelectedRegFilter(printRegInput); setShowPrintModal(false); setTimeout(() => window.print(), 500); }} className={`w-full py-2.5 ${currentTheme.secondary} ${currentTheme.secondaryHover} text-white rounded-xl font-bold disabled:opacity-50 transition-colors text-sm`} disabled={!printRegInput} title="طباعة السجلات للقيد المحدد">طباعة القيد المحدد</button>
                       </div>
                    </Modal>
                )}

                {confirmConfig && <ConfirmModal title={confirmConfig.title} message={confirmConfig.message} onConfirm={confirmConfig.onConfirm} onCancel={() => setConfirmConfig(null)} isDestructive={confirmConfig.isDestructive} />}
                {alertConfig && <AlertModal message={alertConfig.message} type={alertConfig.type} onClose={() => setAlertConfig(null)} />}
                
                {importing && (
                  <Modal onClose={() => {}} zIndex="z-[80]">
                    <div className="bg-white rounded-2xl p-8 flex flex-col items-center gap-4 shadow-2xl">
                      <div className="relative flex items-center justify-center">
                          <div className="animate-spin text-blue-600"><Loader2 size={64} /></div>
                          <div className="absolute text-sm font-bold text-blue-800" dir="ltr">{importProgress}%</div>
                      </div>
                      <h3 className="text-xl font-bold text-slate-800">جاري استيراد البيانات...</h3>
                      <p className="text-slate-500">يرجى الانتظار قليلاً</p>
                      <div className="w-full bg-slate-100 rounded-full h-2 mt-2 overflow-hidden">
                          <div className="bg-blue-600 h-2 rounded-full transition-all duration-300" style={{ width: `${importProgress}%` }}></div>
                      </div>
                    </div>
                  </Modal>
                )}
              </div>
              
              {printMode === 'list' && <PrintView students={filtered} title={selectedRegFilter ? `كشف الطلاب - قيد رقم ${selectedRegFilter}` : "كشف القيد العام"} />}
              {printMode === 'single' && students.find(s=>s.id===selectedId) && <SingleStudentPrint student={students.find(s=>s.id===selectedId)} />}
            </>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
