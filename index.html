<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سجل قيود الطلاب</title>
    
    <!-- Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Cairo', sans-serif;
        background-color: #f8fafc;
        color: #1e293b;
        /* Prevent horizontal scroll on body */
        overflow-x: hidden;
      }
      /* Print Styles */
      @media print {
        @page { size: A4; margin: 0; }
        body { background-color: white; margin: 0; }
        .no-print { display: none !important; }
        .print-only { display: block !important; }
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .print-only { display: none; }
      
      /* --- Professional Scrollbar Styling --- */
      
      /* Webkit (Chrome, Safari, Edge) */
      ::-webkit-scrollbar {
        width: 12px;
      }
      
      ::-webkit-scrollbar-track {
        background-color: #f1f5f9;
        border-left: 1px solid #e2e8f0;
      }
      
      ::-webkit-scrollbar-thumb {
        background-color: #94a3b8;
        border-radius: 6px;
        border: 3px solid #f1f5f9;
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background-color: #64748b;
      }

      /* Firefox Support */
      * {
        scrollbar-width: thin;
        scrollbar-color: #94a3b8 #f1f5f9;
      }

      /* Animation Classes */
      @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
      .animate-fade-in { animation: fade-in 0.3s ease-out; }
      @keyframes slide-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .animate-slide-up { animation: slide-up 0.3s ease-out; }
    </style>

    <!-- React & Babel Support -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Import Map -->
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.263.1?deps=react@18.2.0",
    "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
    "xlsx": "https://cdn.sheetjs.com/xlsx-0.20.1/package/xlsx.mjs",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "firebase/": "https://esm.sh/firebase@^12.9.0/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module" data-presets="react,typescript">
        import React, { useState, useEffect, useMemo, useRef } from 'react';
        import ReactDOM from 'react-dom/client';
        import { 
          Users, LogOut, Settings, Search, Plus, Printer, 
          Trash2, FileSpreadsheet, Download, Upload, AlertTriangle, ArrowRight, Save, X, FileText, CheckCircle2, XCircle, AlertCircle, Filter, ArrowUp
        } from 'lucide-react';
        import { initializeApp } from "firebase/app";
        import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, deleteDoc, writeBatch } from "firebase/firestore";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "firebase/auth";
        import * as XLSX from 'xlsx';

        // ==========================================
        // CONFIG
        // ==========================================
        const firebaseConfig = {
          apiKey: "AIzaSyC3Hyi-tVMui0ZyPsezvoxxSFjCJQBme9Q",
          authDomain: "ss-app-87ac7.firebaseapp.com",
          projectId: "ss-app-87ac7",
          storageBucket: "ss-app-87ac7.firebasestorage.app",
          messagingSenderId: "7671656513",
          appId: "1:7671656513:web:21b51edb450bddd1aad6c0",
          measurementId: "G-LQPLFRBGKH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const studentsCollection = collection(db, "students");

        // ==========================================
        // UTILS
        // ==========================================
        const exportToExcel = (students) => {
          const statusMap = { 'active': 'مستمر', 'transferred': 'منقول', 'left': 'تارك' };
          const data = students.map(s => ({
            'الاسم الأول': s.firstName,
            'اللقب': s.lastName,
            'رقم القيد': s.regNumber,
            'رقم الصفحة': s.pageNumber,
            'الحالة': statusMap[s.status] || 'مستمر',
            'الملاحظات': s.notes || '',
            'تاريخ الإضافة': new Date(s.createdAt).toLocaleDateString('ar-EG')
          }));
          const worksheet = XLSX.utils.json_to_sheet(data);
          const workbook = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(workbook, worksheet, "الطلاب");
          XLSX.writeFile(workbook, "سجل_الطلاب.xlsx");
        };

        const generateTemplate = () => {
          const firstNames = ['محمد', 'أحمد', 'عبدالله', 'علي', 'عمر', 'خالد', 'سعد', 'سعيد', 'صالح', 'فهد', 'سلمان', 'عبدالرحمن', 'إبراهيم', 'يوسف', 'محمود', 'حسن', 'حسين', 'ماجد', 'نايف', 'سلطان'];
          const midNames = ['محمد', 'علي', 'صالح', 'عبدالله', 'حمد', 'سليمان', 'عبدالعزيز', 'سالم', 'ناصر', 'راشد', 'خلف', 'سعود', 'فواز', 'عادل', 'منصور', 'تركي'];
          const lastNames = ['الشمري', 'العتيبي', 'القحطاني', 'العنزي', 'الحربي', 'الزهراني', 'الغامدي', 'المطيري', 'الدوسري', 'السبيعي', 'المالكي', 'عسيري', 'الشهري', 'الرويلي', 'الخالدي'];

          const templateData = [];

          for (let i = 0; i < 1000; i++) {
            const n1 = firstNames[Math.floor(Math.random() * firstNames.length)];
            const n2 = midNames[Math.floor(Math.random() * midNames.length)];
            const n3 = midNames[Math.floor(Math.random() * midNames.length)];
            const n4 = midNames[Math.floor(Math.random() * midNames.length)];
            const ln = lastNames[Math.floor(Math.random() * lastNames.length)];
            
            // To ensure 1000 unique records:
            // Reg goes 1-10, repeating every 10 records
            const regNum = (i % 10) + 1;
            // Page increments every 10 records (Page 1 has 1-10, Page 2 has 1-10...)
            const pageNum = Math.floor(i / 10) + 1;
            
            // Status probability
            const rand = Math.random();
            let status = 'مستمر';
            if (rand > 0.95) status = 'تارك';
            else if (rand > 0.9) status = 'منقول';

            templateData.push({
              'الاسم الأول': `${n1} ${n2} ${n3} ${n4}`,
              'اللقب': ln,
              'رقم القيد': regNum.toString(),
              'رقم الصفحة': pageNum.toString(),
              'الحالة': status,
              'الملاحظات': ''
            });
          }
          
          const worksheet = XLSX.utils.json_to_sheet(templateData);
          const workbook = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(workbook, worksheet, "نموذج 1000 طالب");
          XLSX.writeFile(workbook, "نموذج_سجل_الطلاب_الكبير.xlsx");
        };

        const readExcel = (file) => {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
              try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheetName]);
                resolve(jsonData);
              } catch (err) { reject(err); }
            };
            reader.onerror = (error) => reject(error);
            reader.readAsArrayBuffer(file);
          });
        };

        // ==========================================
        // COMPONENTS
        // ==========================================
        
        // Modal Wrapper Component
        const Modal = ({ children, onClose }) => (
          <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in overflow-y-auto" onClick={onClose}>
            <div className="w-full max-w-xl relative" onClick={e => e.stopPropagation()}>
               {children}
            </div>
          </div>
        );

        // Elegant Single Student Print
        const SingleStudentPrint = ({ student }) => {
          const statusLabels = { 'active': 'مستمر', 'transferred': 'منقول', 'left': 'تارك' };
          return (
            <div className="hidden print:flex flex-col items-center justify-center w-full h-screen bg-white p-8">
              <div className="w-full max-w-[21cm] border-[3px] border-double border-slate-800 p-8 rounded-xl relative overflow-hidden">
                <div className="absolute top-0 right-0 w-24 h-24 bg-slate-100 -translate-y-1/2 translate-x-1/2 rounded-full opacity-50"></div>
                <div className="text-center border-b-2 border-slate-200 pb-6 mb-8 relative z-10">
                  <h1 className="text-3xl font-bold text-slate-900 mb-2">بطاقة معلومات الطالب</h1>
                  <p className="text-slate-500 font-medium">نظام سجلات الطلاب العام</p>
                </div>
                <div className="grid grid-cols-12 gap-6 relative z-10">
                  <div className="col-span-12 md:col-span-8 space-y-6">
                     <div className="flex flex-col">
                        <span className="text-sm font-bold text-slate-400 mb-1">الاسم الكامل</span>
                        <div className="text-2xl font-bold text-slate-900 border-b border-dashed border-slate-300 pb-1">
                           {student.firstName} {student.lastName}
                        </div>
                     </div>
                     <div className="grid grid-cols-2 gap-6">
                        <div className="flex flex-col">
                          <span className="text-sm font-bold text-slate-400 mb-1">حالة الطالب</span>
                          <div className="text-lg font-semibold text-slate-800">{statusLabels[student.status || 'active']}</div>
                        </div>
                        <div className="flex flex-col">
                          <span className="text-sm font-bold text-slate-400 mb-1">تاريخ التسجيل</span>
                          <div className="text-lg font-semibold text-slate-800">{new Date(student.createdAt).toLocaleDateString('ar-EG')}</div>
                        </div>
                     </div>
                  </div>
                  <div className="col-span-12 md:col-span-4 flex flex-col gap-4">
                     <div className="bg-slate-50 border border-slate-200 rounded-lg p-4 text-center">
                        <span className="text-xs font-bold text-slate-500 uppercase">رقم القيد</span>
                        <div className="text-4xl font-mono font-bold text-slate-900 mt-1">{student.regNumber}</div>
                     </div>
                     <div className="bg-slate-50 border border-slate-200 rounded-lg p-4 text-center">
                        <span className="text-xs font-bold text-slate-500 uppercase">رقم الصفحة</span>
                        <div className="text-4xl font-mono font-bold text-slate-900 mt-1">{student.pageNumber}</div>
                     </div>
                  </div>
                  <div className="col-span-12 mt-4">
                     <div className="border border-slate-200 rounded-lg p-6 min-h-[150px] bg-slate-50/50">
                        <span className="text-sm font-bold text-slate-400 block mb-2">الملاحظات</span>
                        <p className="text-slate-800 leading-relaxed whitespace-pre-wrap">{student.notes || "لا توجد ملاحظات مسجلة."}</p>
                     </div>
                  </div>
                </div>
                <div className="mt-12 pt-6 border-t border-slate-200 flex justify-between items-end">
                   <div className="text-xs text-slate-400">تم الاستخراج: {new Date().toLocaleDateString('ar-EG')}</div>
                   <div className="text-center">
                      <div className="w-32 border-b border-slate-300 mb-2"></div>
                      <span className="text-sm font-bold text-slate-500">توقيع المسؤول</span>
                   </div>
                </div>
              </div>
            </div>
          );
        };

        const Login = () => {
          const [email, setEmail] = useState('');
          const [password, setPassword] = useState('');
          const [error, setError] = useState('');
          const [loading, setLoading] = useState(false);

          const handleSubmit = async (e) => {
            e.preventDefault();
            setLoading(true);
            setError('');
            try { await signInWithEmailAndPassword(auth, email, password); } 
            catch (err) { setError('بيانات الدخول غير صحيحة'); } 
            finally { setLoading(false); }
          };

          return (
            <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4" dir="rtl">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 animate-fade-in">
                <div className="text-center mb-8">
                  <div className="w-16 h-16 bg-blue-600 rounded-2xl mx-auto mb-4 flex items-center justify-center shadow-lg">
                     <Users className="w-8 h-8 text-white" />
                  </div>
                  <h2 className="text-2xl font-bold text-slate-800">تسجيل الدخول</h2>
                </div>
                <form onSubmit={handleSubmit} className="space-y-4">
                  <div>
                    <label className="block text-sm font-semibold text-slate-700 mb-1">البريد الإلكتروني</label>
                    <input type="email" required className="w-full px-4 py-2 rounded-xl border border-slate-300 focus:border-blue-500 outline-none text-left" dir="ltr" value={email} onChange={(e) => setEmail(e.target.value)} />
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-slate-700 mb-1">كلمة المرور</label>
                    <input type="password" required className="w-full px-4 py-2 rounded-xl border border-slate-300 focus:border-blue-500 outline-none text-left" dir="ltr" value={password} onChange={(e) => setPassword(e.target.value)} />
                  </div>
                  {error && <div className="text-red-600 text-sm text-center">{error}</div>}
                  <button type="submit" disabled={loading} className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl transition-all">
                    {loading ? 'جاري التحقق...' : 'دخول'}
                  </button>
                </form>
              </div>
            </div>
          );
        };

        const StatCard = ({ title, value, icon, color }) => (
          <div className="bg-white p-3 rounded-xl border border-slate-100 shadow-sm flex flex-col items-center justify-center text-center gap-2 hover:shadow-md transition-shadow">
            <div className={`p-2 rounded-full ${color} text-white shadow-sm`}>{icon}</div>
            <div>
              <div className="text-xl font-bold text-slate-800 font-mono leading-none">{value}</div>
              <div className="text-[10px] text-slate-500 font-semibold mt-1">{title}</div>
            </div>
          </div>
        );

        const StatusBadge = ({ status }) => {
           if (status === 'transferred') return <span className="inline-flex items-center gap-1 bg-amber-100 text-amber-700 px-2 py-0.5 rounded text-xs font-bold border border-amber-200">منقول</span>;
           if (status === 'left') return <span className="inline-flex items-center gap-1 bg-rose-100 text-rose-700 px-2 py-0.5 rounded text-xs font-bold border border-rose-200">تارك</span>;
           return <span className="inline-flex items-center gap-1 bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded text-xs font-bold border border-emerald-200">مستمر</span>;
        };

        const PrintView = ({ students, title }) => {
          const sortedStudents = [...students].sort((a, b) => a.firstName.localeCompare(b.firstName));
          const ROWS_PER_COLUMN = 30;
          const COLUMNS_PER_PAGE = 2;
          const ITEMS_PER_PAGE = ROWS_PER_COLUMN * COLUMNS_PER_PAGE;
          
          const pages = [];
          for (let i = 0; i < sortedStudents.length; i += ITEMS_PER_PAGE) {
            pages.push(sortedStudents.slice(i, i + ITEMS_PER_PAGE));
          }
          
          const extractionDate = new Date().toLocaleDateString('ar-EG');

          return (
            <div className="print-only text-[9pt] dir-rtl">
              {pages.map((pageStudents, pageIndex) => (
                <div key={pageIndex} className="flex flex-col w-full h-[297mm] box-border p-[1cm] break-after-page relative">
                   <div className="w-full text-center border-b-2 border-black pb-2 mb-4">
                      <h1 className="text-xl font-bold">{title || "فهرس القيد العام"}</h1>
                   </div>
                   <div className="flex flex-row gap-[1cm] h-full">
                     {[0, 1].map((colIndex) => {
                       const colStart = colIndex * ROWS_PER_COLUMN;
                       const colStudents = pageStudents.slice(colStart, colStart + ROWS_PER_COLUMN);
                       return (
                         <div key={colIndex} className="flex-1 flex flex-col h-full border border-black/10">
                           {colStudents.length > 0 && (
                             <table className="w-full border-collapse border border-black table-fixed h-full">
                               <thead>
                                 <tr className="bg-gray-100 h-[30px]">
                                   <th className="border border-black p-1 text-center w-[30px] text-[8pt]">ت</th>
                                   <th className="border border-black p-1 text-right">الاسم الكامل</th>
                                   <th className="border border-black p-1 text-center w-[35px] font-bold text-[8pt]">ق</th>
                                   <th className="border border-black p-1 text-center w-[35px] font-bold text-[8pt]">ص</th>
                                 </tr>
                               </thead>
                               <tbody>
                                 {colStudents.map((s, idx) => {
                                   const globalIndex = (pageIndex * ITEMS_PER_PAGE) + colStart + idx + 1;
                                   return (
                                     <tr key={s.id} className="h-[28px]">
                                       <td className="border border-black px-1 text-center font-medium">{globalIndex}</td>
                                       <td className="border border-black px-2 align-middle whitespace-nowrap overflow-hidden leading-relaxed font-bold">
                                         {s.firstName} {s.lastName ? <span className="text-gray-700">/ {s.lastName}</span> : ''}
                                       </td>
                                       <td className="border border-black px-1 text-center font-bold font-mono text-[10pt] align-middle dir-ltr">{s.regNumber}</td>
                                       <td className="border border-black px-1 text-center font-bold font-mono text-[10pt] align-middle">{s.pageNumber}</td>
                                     </tr>
                                   );
                                 })}
                               </tbody>
                             </table>
                           )}
                         </div>
                       );
                     })}
                   </div>
                   
                   {/* Footer with Date and Page Number */}
                   <div className="absolute bottom-4 left-0 w-full px-[1cm] flex justify-between items-center text-xs text-gray-500">
                      <span>تم الاستخراج: {extractionDate}</span>
                      <span>صفحة {pageIndex+1} من {pages.length}</span>
                   </div>
                </div>
              ))}
            </div>
          );
        };

        // ==========================================
        // APP
        // ==========================================
        const App = () => {
          const [user, setUser] = useState(null);
          const [loading, setLoading] = useState(true);
          const [students, setStudents] = useState([]);
          const [view, setView] = useState('list'); 
          const [selectedId, setSelectedId] = useState(null);
          
          const [search, setSearch] = useState('');
          const [selectedRegFilter, setSelectedRegFilter] = useState(''); 
          const [statusFilter, setStatusFilter] = useState('ALL'); 
          const [letterFilter, setLetterFilter] = useState('ALL');
          const [sortBy, setSortBy] = useState('recent');
          
          // Print Mode State
          const [printMode, setPrintMode] = useState('list');

          // Infinite Scroll State
          const [visibleCount, setVisibleCount] = useState(50);
          const loadMoreRef = useRef(null);

          // Scroll To Top State
          const [showTopBtn, setShowTopBtn] = useState(false);
          const [showDeleteAllConfirm, setShowDeleteAllConfirm] = useState(false);
          
          // NEW: Single Delete Modal State
          const [studentToDelete, setStudentToDelete] = useState(null);

          const [importing, setImporting] = useState(false);
          const [showPrint, setShowPrint] = useState(false);
          const [printReg, setPrintReg] = useState('');

          // Form States
          const [nameWarning, setNameWarning] = useState('');
          const [formData, setFormData] = useState({ firstName: '', lastName: '', status: 'active' });

          const uniqueRegNumbers = useMemo(() => {
             const regs = new Set(students.map(s => s.regNumber));
             return Array.from(regs).sort((a, b) => Number(a) - Number(b));
          }, [students]);

          useEffect(() => {
            // 1. FAST LOAD: Load from LocalStorage first
            const cached = localStorage.getItem('students_cache');
            if (cached) {
               try {
                   const parsed = JSON.parse(cached);
                   if (Array.isArray(parsed)) {
                       setStudents(parsed);
                       setLoading(false); // Show UI immediately
                   }
               } catch(e) { console.error("Cache error", e); }
            }

            const unsub = onAuthStateChanged(auth, (u) => {
              setUser(u);
              if (u) loadData(); // Then fetch fresh data
              else setLoading(false);
            });
            return () => unsub();
          }, []);

          // Reset infinite scroll when filters change
          useEffect(() => {
            setVisibleCount(50);
            window.scrollTo(0, 0);
          }, [search, selectedRegFilter, statusFilter, sortBy, letterFilter]);

          // Scroll event listener
          useEffect(() => {
            const handleScroll = () => {
              if (window.scrollY > 400) {
                setShowTopBtn(true);
              } else {
                setShowTopBtn(false);
              }
            };
            window.addEventListener('scroll', handleScroll);
            return () => window.removeEventListener('scroll', handleScroll);
          }, []);

          const loadData = async () => {
            // Note: We don't set loading(true) here to avoid screen flickering if cache is present
            try {
              const snap = await getDocs(studentsCollection);
              const data = snap.docs.map(d => ({id: d.id, status: 'active', ...d.data()}));
              data.sort((a,b) => b.createdAt - a.createdAt);
              setStudents(data);
              // 2. SAVE TO CACHE
              localStorage.setItem('students_cache', JSON.stringify(data));
            } catch (e) { console.error("Load error"); }
            setLoading(false);
          };

          const checkDuplicate = (val) => {
             if (!val || val.length < 2) { setNameWarning(''); return; }
             const matches = students.filter(s => 
                s.firstName.trim().includes(val.trim()) && 
                s.id !== selectedId
             );
             if (matches.length > 0) {
               const info = matches.slice(0, 5).map(m => `• ${m.firstName} (قيد: ${m.regNumber} - صفحة: ${m.pageNumber})`).join('\n');
               setNameWarning(`تنبيه: يوجد ${matches.length} طلاب بأسماء مشابهة:\n${info}${matches.length > 5 ? '\n...والمزيد' : ''}`);
             } else {
               setNameWarning('');
             }
          };

          const filtered = useMemo(() => {
            let res = students;

            if (selectedRegFilter) {
               res = res.filter(s => s.regNumber === selectedRegFilter);
            }

            if (letterFilter !== 'ALL') {
               res = res.filter(s => s.firstName.startsWith(letterFilter));
            }
            
            if (statusFilter !== 'ALL') {
               res = res.filter(s => s.status === statusFilter);
            }

            if (search) {
               const q = search.toLowerCase();
               res = res.filter(s => 
                  s.firstName.toLowerCase().includes(q) || 
                  (s.lastName && s.lastName.toLowerCase().includes(q))
               );
            }
            
            if (sortBy === 'alpha') res.sort((a,b) => a.firstName.localeCompare(b.firstName));
            else res.sort((a,b) => b.createdAt - a.createdAt);
            
            return res;
          }, [students, search, selectedRegFilter, statusFilter, letterFilter, sortBy]);

          const displayedStudents = useMemo(() => {
            return filtered.slice(0, visibleCount);
          }, [filtered, visibleCount]);

          useEffect(() => {
            const observer = new IntersectionObserver(
              (entries) => {
                if (entries[0].isIntersecting) {
                  setVisibleCount((prev) => prev + 50);
                }
              },
              { threshold: 0.5, rootMargin: '100px' }
            );
            if (loadMoreRef.current) observer.observe(loadMoreRef.current);
            return () => observer.disconnect();
          }, [displayedStudents.length, filtered.length]);


          const handleSave = async (e) => {
            e.preventDefault();
            const form = new FormData(e.target);
            const data = {
              firstName: form.get('firstName'),
              lastName: form.get('lastName'),
              regNumber: form.get('regNumber'),
              pageNumber: form.get('pageNumber'),
              notes: form.get('notes'),
              status: form.get('status') || 'active',
              createdAt: Date.now()
            };

            if (students.some(s => s.id !== selectedId && s.regNumber === data.regNumber && s.pageNumber === data.pageNumber)) {
              alert("هذا القيد مسجل في هذه الصفحة مسبقاً");
              return;
            }

            try {
              let updatedList = [...students];
              if (selectedId) {
                await updateDoc(doc(db, "students", selectedId), data);
                updatedList = students.map(s => s.id === selectedId ? {...s, ...data} : s);
              } else {
                const ref = await addDoc(studentsCollection, data);
                updatedList = [{id: ref.id, ...data}, ...students];
              }
              setStudents(updatedList);
              localStorage.setItem('students_cache', JSON.stringify(updatedList)); // Update Cache
              setView('list');
              setSelectedId(null);
            } catch (err) { alert("فشل الحفظ"); }
          };

          // NEW: Replace window.confirm with Modal
          const handleDeleteClick = (id) => {
             setStudentToDelete(id);
          };

          const confirmDeleteStudent = async () => {
             if (!studentToDelete) return;
             try {
               await deleteDoc(doc(db, "students", studentToDelete));
               const updated = students.filter(s => s.id !== studentToDelete);
               setStudents(updated);
               localStorage.setItem('students_cache', JSON.stringify(updated)); // Update Cache
               if (view === 'detail') setView('list');
               setStudentToDelete(null);
             } catch (e) { alert("فشل الحذف"); }
          };
          
          const executeDeleteAll = async () => {
             setShowDeleteAllConfirm(false);
             setLoading(true);
             try {
               const allIds = students.map(s => s.id);
               const CHUNK_SIZE = 400; 
               
               for (let i = 0; i < allIds.length; i += CHUNK_SIZE) {
                  const batch = writeBatch(db);
                  const chunk = allIds.slice(i, i + CHUNK_SIZE);
                  chunk.forEach(id => batch.delete(doc(db, "students", id)));
                  await batch.commit();
               }
               
               setStudents([]);
               localStorage.removeItem('students_cache'); // Clear Cache
               alert("تم الحذف بنجاح");
               setView('list');
             } catch(e) {
                console.error(e);
                alert("حدث خطأ أثناء الحذف");
             } finally {
                setLoading(false);
             }
          };

          const handleImport = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            setImporting(true);
            try {
              const rows = await readExcel(file);
              let count = 0;
              const signatures = new Set(students.map(s => `${s.regNumber}-${s.pageNumber}`));
              const newItems = [];
              const BATCH_SIZE = 400;
              let currentBatch = writeBatch(db);
              let batchCount = 0;

              for (const row of rows) {
                 const fName = row['firstName'] || row['الاسم الأول'];
                 const reg = row['regNumber'] || row['رقم القيد'];
                 const page = row['pageNumber'] || row['رقم الصفحة'];
                 const st = row['status'] || row['الحالة'] || 'active';
                 let statusKey = 'active';
                 if (st === 'منقول' || st === 'transferred') statusKey = 'transferred';
                 if (st === 'تارك' || st === 'left') statusKey = 'left';

                 if (fName && reg) {
                   const sig = `${reg}-${page}`;
                   if (!signatures.has(sig)) {
                     const item = {
                       firstName: String(fName).trim(),
                       lastName: String(row['lastName'] || row['اللقب'] || '').trim(),
                       regNumber: String(reg).trim(),
                       pageNumber: String(page || '').trim(),
                       notes: String(row['notes'] || row['الملاحظات'] || ''),
                       status: statusKey,
                       createdAt: Date.now() + count
                     };
                     const ref = doc(studentsCollection);
                     currentBatch.set(ref, item);
                     newItems.push({id: ref.id, ...item});
                     signatures.add(sig);
                     count++;
                     batchCount++;
                     if (batchCount >= BATCH_SIZE) {
                       await currentBatch.commit();
                       currentBatch = writeBatch(db);
                       batchCount = 0;
                     }
                   }
                 }
              }
              if (batchCount > 0) await currentBatch.commit();

              if (count > 0) {
                const updatedList = [...newItems, ...students];
                setStudents(updatedList);
                localStorage.setItem('students_cache', JSON.stringify(updatedList)); // Update Cache
                alert(`تم استيراد ${count} سجل`);
              } else { alert("لم يتم العثور على سجلات جديدة"); }
            } catch (e) { console.error(e); alert("فشل الاستيراد"); }
            setImporting(false);
          };
          
          const handleNumericInput = (e) => {

                  {/* MODAL VIEWS */}
                  {(view === 'add' || view === 'edit') && (
                    <Modal onClose={() => setView('list')}>
                      <div className="bg-white rounded-2xl shadow-xl overflow-hidden animate-slide-up">

                            {view === 'add' ? <Plus className="text-blue-600" size={20}/> : <Settings className="text-blue-600" size={20}/>}

                        <form onSubmit={handleSave} className="p-6 space-y-5">

                           {nameWarning && (

                      </Modal>
                    ) : null;
                  })()}

                  {view === 'settings' && (
                    <Modal onClose={() => setView('list')}>
                      <div className="bg-white rounded-2xl shadow-xl overflow-hidden animate-slide-up">
                        <div className="p-6 border-b border-slate-100 flex justify-between items-center">
                            <h2 className="text-xl font-bold flex items-center gap-2"><Settings size={20}/> الإعدادات</h2>
                            <button onClick={() => setView('list')} className="p-1 rounded-full hover:bg-slate-200 text-slate-500"><X size={20}/></button>
                        </div>
                        <div className="p-6 space-y-6">
                          <div className="space-y-3">
                            <button onClick={() => exportToExcel(students)} className="w-full flex items-center justify-between p-3.5 bg-emerald-50 text-emerald-700 rounded-xl hover:bg-emerald-100 transition-colors">
                              <span className="flex items-center gap-2 font-bold text-sm"><Download size={18}/> تصدير البيانات (Excel)</span>
                            </button>
                            <button onClick={generateTemplate} className="w-full flex items-center justify-between p-3.5 bg-blue-50 text-blue-700 rounded-xl hover:bg-blue-100 transition-colors">
                              <span className="flex items-center gap-2 font-bold text-sm"><FileSpreadsheet size={18}/> تحميل نموذج فارغ (1000 طالب)</span>
                            </button>
                            <label className={`w-full flex items-center justify-between p-3.5 bg-slate-900 text-white rounded-xl hover:bg-slate-800 transition-colors cursor-pointer ${importing ? 'opacity-50' : ''}`}>
                               <span className="flex items-center gap-2 font-bold text-sm"><Upload size={18}/> {importing ? 'جاري الرفع...' : 'استيراد من Excel'}</span>
                               <input type="file" className="hidden" accept=".xlsx" onChange={handleImport} disabled={importing} />
                            </label>
                          </div>
                          <div className="pt-4 border-t border-red-100">
                            <button onClick={() => setShowDeleteAllConfirm(true)} className="w-full p-3.5 bg-red-50 text-red-600 rounded-xl font-bold hover:bg-red-100 flex items-center justify-center gap-2 text-sm border border-red-100">
                               <Trash2 size={18}/> حذف جميع البيانات
                            </button>
                          </div>
                        </div>
                      </div>
                    </Modal>
                  )}

                  {showPrint && (
                    <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in" onClick={() => setShowPrint(false)}>
                       <div className="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl cursor-default" onClick={(e) => e.stopPropagation()}>
                          <h3 className="text-lg font-bold text-center mb-6">خيارات الطباعة</h3>
                          <div className="space-y-3">
                             <button onClick={() => { setSelectedRegFilter(''); handleListPrint(); setShowPrint(false); }} className="w-full py-3 bg-slate-900 text-white rounded-xl font-bold hover:bg-slate-800 text-sm">طباعة السجل بالكامل</button>
                             <div className="text-center text-slate-400 text-xs">- أو -</div>
                             
                             {/* Reg Dropdown in Print Modal */}
                             <div className="relative">
                               <select 
                                   value={printReg}
                                   onChange={(e) => setPrintReg(e.target.value)}
                                   className="w-full p-3 border rounded-xl outline-none focus:border-blue-500 text-center text-sm appearance-none bg-white font-mono dir-ltr"
                               >
                                   <option value="">اختر رقم القيد...</option>
                                   {uniqueRegNumbers.map(r => (
                                       <option key={r} value={r}>قيد {r}</option>
                                   ))}
                               </select>
                               <ArrowUp size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none rotate-180" />
                             </div>

                             <button onClick={() => { handleListPrint(printReg); setShowPrint(false); }} className="w-full py-3 bg-blue-50 text-blue-600 rounded-xl font-bold hover:bg-blue-100 text-sm" disabled={!printReg}>طباعة القيد المحدد</button>
                             <button onClick={() => setShowPrint(false)} className="w-full py-2 text-slate-400 hover:text-slate-600 text-sm">إلغاء</button>
                          </div>
                       </div>
                    </div>
                  )}

                   {/* SCROLL TO TOP BUTTON */}
                   <button
                    onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
                    className={`fixed bottom-6 left-6 p-3 rounded-full shadow-lg text-white transition-all transform z-30 ${showTopBtn ? 'bg-slate-900 translate-y-0 opacity-100' : 'translate-y-10 opacity-0 pointer-events-none'}`}
                   >
                    <ArrowUp size={24} />
                   </button>
                
                  {/* Custom Professional Delete Confirmation Modal (Delete All) */}
                  {showDeleteAllConfirm && (
                    <Modal onClose={() => setShowDeleteAllConfirm(false)}>
                        <div className="bg-white rounded-2xl p-8 w-full max-w-md text-center shadow-2xl transform transition-all scale-100">
                            <div className="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6">
                                <Trash2 size={40} className="text-red-600" />
                            </div>
                            <h3 className="text-2xl font-bold text-slate-800 mb-2">حذف جميع البيانات؟</h3>
                            <p className="text-slate-500 mb-8 leading-relaxed">
                                هل أنت متأكد من رغبتك في حذف كافة سجلات الطلاب؟ <br/>
                                <span className="text-red-500 font-bold text-sm">هذا الإجراء نهائي ولا يمكن التراجع عنه.</span>
                            </p>
                            <div className="grid grid-cols-2 gap-4">
                                <button onClick={() => setShowDeleteAllConfirm(false)} className="py-3 px-6 rounded-xl font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors">
                                    إلغاء
                                </button>
                                <button onClick={executeDeleteAll} className="py-3 px-6 rounded-xl font-bold text-white bg-red-600 hover:bg-red-700 transition-colors shadow-lg shadow-red-600/30">
                                    نعم، حذف الكل
                                </button>
                            </div>
                        </div>
                    </Modal>
                  )}

                  {/* Custom Professional Delete Confirmation Modal (Delete Single Student) - REPLACES BROWSER CONFIRM */}
                  {studentToDelete && (
                    <Modal onClose={() => setStudentToDelete(null)}>
                        <div className="bg-white rounded-2xl p-6 max-w-sm w-full mx-auto text-center shadow-2xl animate-fade-in">
                        <div className="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <Trash2 className="text-red-600 w-8 h-8" />
                        </div>
                        <h3 className="text-xl font-bold text-slate-800 mb-2">حذف الطالب؟</h3>
                        <p className="text-slate-500 text-sm mb-6 leading-relaxed">
                            هل أنت متأكد من رغبتك في حذف هذا السجل نهائياً؟ <br/>
                            <span className="text-red-500 font-semibold">لا يمكن استرجاع البيانات بعد الحذف.</span>
                        </p>
                        <div className="flex gap-3">
                            <button 
                            onClick={() => setStudentToDelete(null)}
                            className="flex-1 py-2.5 bg-slate-100 text-slate-700 rounded-xl font-bold hover:bg-slate-200 transition-colors"
                            >
                            إلغاء
                            </button>
                            <button 
                            onClick={confirmDeleteStudent}
                            className="flex-1 py-2.5 bg-red-600 text-white rounded-xl font-bold hover:bg-red-700 transition-colors shadow-lg shadow-red-600/20"
                            >
                            نعم، حذف
                            </button>
                        </div>
                        </div>
                    </Modal>
                   )}
                </main>
              </div>
              
              {/* Conditional Print Views */}
              {printMode === 'list' && (
                 <PrintView students={studentsToPrint} title={printTitle} />
              )}
              {printMode === 'single' && singleStudentData && (
                 <SingleStudentPrint student={singleStudentData} />
              )}
            </>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
