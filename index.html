    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef, useCallback } from 'react';

        import { 
          Users, LogOut, Settings, Search, Plus, Printer,

        // ==========================================

        // ==========================================
        const firebaseConfig = {
          apiKey: "AIzaSyC3Hyi-tVMui0ZyPsezvoxxSFjCJQBme9Q",
          authDomain: "ss-app-87ac7.firebaseapp.com",
          projectId: "ss-app-87ac7",
          storageBucket: "ss-app-87ac7.firebasestorage.app",
          messagingSenderId: "7671656513",
          appId: "1:7671656513:web:21b51edb450bddd1aad6c0",
          measurementId: "G-LQPLFRBGKH"
        };

        const app = initializeApp(firebaseConfig);
        
        // Initialize Firestore with Persistent Local Cache
        const db = initializeFirestore(app, {
            localCache: persistentLocalCache()
        });

        const auth = getAuth(app);
        const studentsCollection = collection(db, "students");
        const usersCollection = collection(db, "users");
        const activityLogsCollection = collection(db, "activity_logs");

        // ==========================================
        // صلاحيات المستخدمين
        // ==========================================
        const USER_ROLES = {
          ADMIN: { 
            name: 'مدير النظام', 
            level: 3,
            permissions: {
              canDelete: true,
              canEdit: true,
              canAdd: true,
              canExport: true,
              canImport: true,
              canManageUsers: true,
              canViewLogs: true,
              canDeleteForever: true,
              canPrint: true,
              canBulkOperations: true
            }
          },
          EDITOR: { 
            name: 'محرر', 
            level: 2,
            permissions: {
              canDelete: false,
              canEdit: true,
              canAdd: true,
              canExport: true,
              canImport: true,
              canManageUsers: false,
              canViewLogs: false,
              canDeleteForever: false,
              canPrint: true,
              canBulkOperations: false
            }
          },
          VIEWER: { 
            name: 'مشاهد', 
            level: 1,
            permissions: {
              canDelete: false,
              canEdit: false,
              canAdd: false,
              canExport: false,
              canImport: false,
              canManageUsers: false,
              canViewLogs: false,
              canDeleteForever: false,
              canPrint: true,
              canBulkOperations: false
            }
          }
        };

        // ==========================================
        // UTILS
        // ==========================================
        const cleanName = (name) => {
            if (!name) return "";
            return name.replace(/\s+\d+$/, '').trim();
        };

        const formatDateForInput = (timestamp) => {
            if (!timestamp) return new Date().toISOString().split('T')[0];
            return new Date(timestamp).toISOString().split('T')[0];
        };

        const formatDateTime = (timestamp) => {
          if (!timestamp) return '';
          const date = new Date(timestamp);
          return date.toLocaleDateString('ar-EG') + ' ' + date.toLocaleTimeString('ar-EG');
        };

        // تسجيل النشاطات
        const logActivity = async (userId, userEmail, action, details, targetId = null) => {
          try {
            await addDoc(activityLogsCollection, {
              userId,
              userEmail,
              action,
              details,
              targetId,
              timestamp: Timestamp.now(),
              ip: 'client-side' // يمكن تحسينه لاحقاً
            });
          } catch (error) {
            console.error('Error logging activity:', error);
          }
        };

        const exportToExcel = (students, userRole) => {
          if (!userRole.permissions.canExport) {
            alert('ليس لديك صلاحية لتصدير البيانات');
            return;
          }
          
          const statusMap = { 'active': 'مستمر', 'transferred': 'منقول', 'left': 'تارك', 'graduated': 'متخرج' };
          const data = students.map(s => ({
            'الاسم الرباعي': cleanName(s.firstName),
            'العائلة': s.lastName || '',
            'رقم القيد': s.regNumber,
            'رقم الصفحة': s.pageNumber,
            'الحالة الدراسية': statusMap[s.status || 'active'] || 'مستمر',
            'ملاحظات': s.notes || '',
            'تاريخ التسجيل': new Date(s.createdAt).toLocaleDateString('ar-EG')
          }));
          const worksheet = XLSX.utils.json_to_sheet(data);
          const workbook = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(workbook, worksheet, "الطلاب");
          XLSX.writeFile(workbook, "سجل_القيود_العام.xlsx");
        };

        const generateTemplate = () => {
          const firstNames = ['محمد', 'أحمد', 'عبدالله', 'علي', 'عمر', 'خالد', 'سعد', 'سعيد', 'صالح', 'فهد', 'سلمان', 'يوسف', 'إبراهيم'];
          const secondNames = ['حسين', 'حسن', 'عبدالرحمن', 'محمود', 'مصطفى', 'جعفر', 'عباس', 'كاظم', 'رضا', 'مهدي'];
          const thirdNames = ['علي', 'محمد', 'جاسم', 'كريم', 'خلف', 'سالم', 'حمزة', 'فاضل'];
          const fourthNames = ['عبدالله', 'ناصر', 'منصور', 'خليفة', 'سلطان', 'يحيى', 'زكريا'];
          const titles = ['الشمري', 'العتيبي', 'القحطاني', 'العنزي', 'الحربي', 'الزهراني', 'المالكي', 'الدوسري', 'التميمي', 'الخالدي'];

          const templateData = [];
          
          for (let reg = 1; reg <= 10; reg++) {
            for (let i = 0; i < 200; i++) {
               const n1 = firstNames[Math.floor(Math.random() * firstNames.length)];
               const n2 = secondNames[Math.floor(Math.random() * secondNames.length)];
               const n3 = thirdNames[Math.floor(Math.random() * thirdNames.length)];
               const n4 = fourthNames[Math.floor(Math.random() * fourthNames.length)];
               const title = titles[Math.floor(Math.random() * titles.length)];
               
               const pageNum = Math.floor(i / 30) + 1;

               templateData.push({
                  'الاسم الرباعي': `${n1} ${n2} ${n3} ${n4}`, 
                  'العائلة': title,
                  'رقم القيد': reg.toString(),
                  'رقم الصفحة': pageNum.toString(),
                  'الحالة الدراسية': 'مستمر',
                  'ملاحظات': ''
               });
            }
          }

          const worksheet = XLSX.utils.json_to_sheet(templateData);
          const workbook = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(workbook, worksheet, "نموذج 2000 طالب");
          XLSX.writeFile(workbook, "نموذج_سجل_القيود_الكبير.xlsx");
        };

        const readExcel = (file) => {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
              try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheetName]);
                resolve(jsonData);
              } catch (err) { reject(err); }
            };
            reader.onerror = (error) => reject(error);
            reader.readAsArrayBuffer(file);
          });
        };
        
        // إنشاء رمز QR
        const generateQRCode = (student) => {
          const data = {
            id: student.id,
            name: cleanName(student.firstName) + ' ' + (student.lastName || ''),
            regNumber: student.regNumber,
            pageNumber: student.pageNumber
          };
          return `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(JSON.stringify(data))}`;
        };

        // طلب إذن الإشعارات
        const requestNotificationPermission = async () => {
          if (!('Notification' in window)) {
            console.log('هذا المتصفح لا يدعم الإشعارات');
            return;
          }
          
          if (Notification.permission !== 'granted' && Notification.permission !== 'denied') {
            await Notification.requestPermission();
          }
        };

        // عرض إشعار
        const showNotification = (title, message, icon = '📋') => {
          if (Notification.permission === 'granted') {
            new Notification(title, { 
              body: message,
              icon: icon
            });
          }
        };

        // ==========================================
        // UI COMPONENTS
        // ==========================================
        const SkeletonLoader = () => (
          <div className="animate-pulse space-y-4">
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
              {[...Array(4)].map((_, i) => (
                <div key={i} className="bg-white p-3 rounded-xl border border-slate-100 h-20"></div>

        const Modal = ({ children, onClose, zIndex = "z-50" }) => (

                    onClick={onClose}

                </button>

            </div>

        const AlertModal = ({ message, type, onClose }) => (
          <Modal onClose={onClose} zIndex="z-[60]">
            <div className="bg-white rounded-2xl p-5 text-center shadow-2xl animate-slide-up">
              <div className={`w-12 h-12 rounded-full mx-auto flex items-center justify-center mb-3 ${type === 'error' ? 'bg-red-100 text-red-500' : 'bg-green-100 text-green-500'}`}>
                {type === 'error' ? <AlertCircle size={24} /> : <CheckCircle2 size={24} />}

            <div className={`p-2 rounded-xl ${colorClass} text-white shadow-md`}>{icon}</div>
            <div>
              <div className="text-xl font-black text-slate-800 font-mono">{value}</div>
              <div className="text-[10px] text-slate-500 font-bold">{title}</div>
            </div>
          </div>
        );

        const RoleBadge = ({ role }) => {
          const roleInfo = USER_ROLES[role] || USER_ROLES.VIEWER;
          const roleClass = role === 'ADMIN' ? 'role-admin' : role === 'EDITOR' ? 'role-editor' : 'role-viewer';
          
          return (
            <span className={`role-badge ${roleClass} inline-flex items-center gap-1`}>
              <Shield size={10} />
              {roleInfo.name}

        };

        const Tooltip = ({ children, text }) => (
          <div className="tooltip">

            <span className="tooltip-text">{text}</span>

        const SingleStudentPrint = ({ student }) => {
          const statusLabels = { 'active': 'مستمر', 'transferred': 'منقول', 'left': 'تارك', 'graduated': 'متخرج' };
          const printDate = new Date().toLocaleDateString('ar-EG');
          return (
            <div className="hidden print:flex flex-col items-center justify-start w-full h-screen bg-white p-0 overflow-hidden">
              <div className="w-[190mm] h-[250mm] border-[6px] border-double border-slate-800 p-6 rounded-none relative overflow-hidden flex flex-col justify-between mx-auto mt-0 shadow-none">
                <div className="absolute top-2 right-2 w-16 h-16 border-t-4 border-r-4 border-slate-900"></div>
                <div className="absolute top-2 left-2 w-16 h-16 border-t-4 border-l-4 border-slate-900"></div>
                <div className="absolute bottom-2 right-2 w-16 h-16 border-b-4 border-r-4 border-slate-900"></div>

                <div className="text-center border-b-2 border-slate-900 pb-4 mb-4 relative z-10">
                  <div className="flex justify-between items-start mb-2 px-2">
                    <div className="text-sm font-bold leading-relaxed">جمهورية العراق<br/>وزارة التربية<br/>المديرية العامة للتربية</div>
                    <div className="w-20 h-20 border-2 border-slate-800 rounded-full flex items-center justify-center bg-slate-50 shadow-sm"><span className="text-3xl">🎓</span></div>
                    <div className="text-sm font-bold leading-relaxed text-left">التاريخ: {printDate}<br/>العدد: ............</div>
                  </div>
                  <h1 className="text-4xl font-black text-slate-900 mt-4 font-cairo tracking-wide">بطاقة الطالب الشخصية</h1>
                  <p className="text-lg font-bold text-slate-600 mt-2 bg-slate-100 inline-block px-6 py-1 rounded-full border border-slate-300">نسخة طبق الأصل من سجل القيد</p>
                </div>

                <div className="flex-1 flex flex-col gap-4 justify-start pt-2 px-4 relative z-10">
                   <div className="text-center space-y-3 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                      <span className="text-lg font-bold text-slate-500 block">الاسم الرباعي والعائلة</span>
                      <div className="text-3xl font-black text-slate-900 pb-1">{cleanName(student.firstName)} {student.lastName || ''}</div>
                   </div>

        const PrintView = ({ students, title }) => {
          const sortedStudents = useMemo(() => {
             return [...students].sort((a, b) => a.firstName.localeCompare(b.firstName)).map((s, i) => ({ ...s, printIndex: i + 1 }));
          }, [students]);

          const ROWS_PER_COLUMN_MAX = 31; 
          const COLUMNS_PER_PAGE = 2;
          const MAX_ITEMS_PER_PAGE = ROWS_PER_COLUMN_MAX * COLUMNS_PER_PAGE;
          const totalItems = sortedStudents.length;
          const totalPages = Math.ceil(totalItems / MAX_ITEMS_PER_PAGE);
          const printDate = new Date().toLocaleDateString('ar-EG');
          
          const pages = [];
          for (let i = 0; i < totalPages; i++) {
            pages.push(sortedStudents.slice(i * MAX_ITEMS_PER_PAGE, (i + 1) * MAX_ITEMS_PER_PAGE));
          }
          
          return (
            <div className="print-only text-[9.5pt] dir-rtl">
              {pages.map((pageStudents, pageIndex) => (
                <div key={pageIndex} className="print-page-container">
                   <div className="flex justify-between items-end border-b-2 border-black pb-2 mb-4 w-full h-[40px]">
                      <div className="text-[10px] font-medium text-gray-500 w-32 text-right">صفحة {pageIndex + 1} من {totalPages}</div>

                                 <th className="p-1 text-center w-[40px] font-bold text-[8.5pt]">قيد</th>
                                 <th className="p-1 text-center w-[40px] font-bold text-[8.5pt]">صفحة</th>
                               </tr>
                             </thead>
                             <tbody>
                               {Array.from({ length: ROWS_PER_COLUMN_MAX }).map((_, rowIndex) => {
                                 const s = colStudents[rowIndex];
                                 return (
                                   <tr key={rowIndex} className="h-[31px]">

              if (userDoc) {
                await updateDoc(doc(db, "users", userDoc.id), { role: newRole });
                
                await logActivity(currentUser.uid, currentUser.email, 'UPDATE_USER_ROLE', `تغيير صلاحية المستخدم ${userId} إلى ${newRole}`);

          const [search, setSearch] = useState('');
          const [debouncedQuery, setDebouncedQuery] = useState(''); 
          const [selectedRegFilter, setSelectedRegFilter] = useState(''); 
          const [statusFilter, setStatusFilter] = useState('ALL');
          const [sortBy, setSortBy] = useState('recent');
          const [yearFilter, setYearFilter] = useState('ALL');
          const [showPrintModal, setShowPrintModal] = useState(false);
          const [printRegInput, setPrintRegInput] = useState('');
          const [visibleCount, setVisibleCount] = useState(150);
          const loadMoreRef = useRef(null);
          const [importing, setImporting] = useState(false);
          const [importProgress, setImportProgress] = useState(0);
          const [printMode, setPrintMode] = useState('list');
          const [alertConfig, setAlertConfig] = useState(null);
          const [confirmConfig, setConfirmConfig] = useState(null);
          const [showScrollTop, setShowScrollTop] = useState(false);
          const [similarStudents, setSimilarStudents] = useState([]);
          const [colorTheme, setColorTheme] = useState(localStorage.getItem('appTheme') || 'slate');
          const [isDarkMode, setIsDarkMode] = useState(localStorage.getItem('darkMode') === 'true');
          const [showThemeModal, setShowThemeModal] = useState(false);
          const [showUserManagement, setShowUserManagement] = useState(false);
          const [showActivityLog, setShowActivityLog] = useState(false);
          const [showQRCode, setShowQRCode] = useState(false);
          const [selectedStudentForQR, setSelectedStudentForQR] = useState(null);

          const currentTheme = themeColors[colorTheme] || themeColors.slate;

          const [stats, setStats] = React.useState({ total: 0, active: 0, graduated: 0 });

          // طلب إذن الإشعارات عند تحميل التطبيق
          useEffect(() => {
            requestNotificationPermission();
          }, []);

          // إضافة اختصارات لوحة المفاتيح
          useEffect(() => {
            const handleKeyDown = (e) => {
              // Ctrl+F للبحث
              if (e.ctrlKey && e.key === 'f') {
                e.preventDefault();
                document.getElementById('searchInput')?.focus();
              }
              // Ctrl+N لإضافة طالب جديد
              if (e.ctrlKey && e.key === 'n') {
                e.preventDefault();
                if (userRole?.permissions.canAdd) {
                  setSelectedId(null);
                  setView('add');
                  setSimilarStudents([]);
                }
              }
              // Ctrl+P للطباعة
              if (e.ctrlKey && e.key === 'p') {
                e.preventDefault();
                setShowPrintModal(true);
              }
              // Esc لإغلاق النوافذ المنبثقة
              if (e.key === 'Escape') {
                // سيتم التعامل معه من قبل المودالات
              }
            };

            window.addEventListener('keydown', handleKeyDown);
            return () => window.removeEventListener('keydown', handleKeyDown);
          }, [userRole]);

          // تحميل صلاحية المستخدم
          useEffect(() => {
            const loadUserRole = async () => {
              if (user) {
                try {
                  const q = query(usersCollection, where('uid', '==', user.uid));
                  const querySnapshot = await getDocs(q);
                  
                  if (!querySnapshot.empty) {
                    const userData = querySnapshot.docs[0].data();
                    setUserRole(USER_ROLES[userData.role] || USER_ROLES.VIEWER);
                  } else {
                    // إذا لم يكن المستخدم مسجلاً في مجموعة users، نضيفه كمشاهد
                    await addDoc(usersCollection, {
                      uid: user.uid,
                      email: user.email,
                      role: 'VIEWER',
                      createdAt: Timestamp.now()
                    });
                    setUserRole(USER_ROLES.VIEWER);
                  }
                } catch (error) {
                  console.error('Error loading user role:', error);
                  setUserRole(USER_ROLES.VIEWER);
                }
              }
            };

            loadUserRole();
          }, [user]);

          const regsCount = useMemo(() => {
             return new Set(students.filter(s => !s.isDeleted).map(s => s.regNumber)).size;
          }, [students]);

          const regStats = useMemo(() => {
             const active = students.filter(s => !s.isDeleted);
             const statsMap = {};
             active.forEach(s => {
                 const reg = s.regNumber;
                 if (!statsMap[reg]) {
                     statsMap[reg] = { total: 0, active: 0, transferred: 0, left: 0, graduated: 0 };
                 }
                 statsMap[reg].total++;
                 const status = s.status || 'active';
                 if (statsMap[reg][status] !== undefined) {
                     statsMap[reg][status]++;
                 }
             });
             return Object.entries(statsMap).map(([reg, counts]) => ({ reg, ...counts })).sort((a, b) => Number(a.reg) - Number(b.reg));
          }, [students]);

          const statusStats = useMemo(() => {
            const active = students.filter(s => !s.isDeleted);
            const counts = { active: 0, transferred: 0, left: 0, graduated: 0 };
            active.forEach(s => {
                const st = s.status || 'active';
                if (counts[st] !== undefined) counts[st]++;
            });
            return [
                { label: 'مستمر', count: counts.active, color: 'bg-emerald-100 text-emerald-800' },
                { label: 'منقول', count: counts.transferred, color: 'bg-amber-100 text-amber-800' },
                { label: 'تارك', count: counts.left, color: 'bg-rose-100 text-rose-800' },
                { label: 'متخرج', count: counts.graduated, color: 'bg-blue-100 text-blue-800' }
            ];
          }, [students]);

          const years = useMemo(() => {
             const y = new Set(students.map(s => {
                const d = new Date(s.createdAt);
                return isNaN(d.getFullYear()) ? null : d.getFullYear();
             }).filter(y => y !== null));
             return Array.from(y).sort((a,b) => b - a);
          }, [students]);

          const refreshStats = async () => {
             try {
                 const baseConstraints = [where("isDeleted", "==", false)];
                 if (selectedRegFilter) baseConstraints.push(where("regNumber", "==", selectedRegFilter));
                 
                 const totalQ = query(studentsCollection, ...baseConstraints);
                 const totalSnap = await getCountFromServer(totalQ);
                 const total = totalSnap.data().count;

                 const activeQ = query(studentsCollection, ...baseConstraints, where("status", "==", "active"));
                 const activeSnap = await getCountFromServer(activeQ);
                 const active = activeSnap.data().count;

                 const graduatedQ = query(studentsCollection, ...baseConstraints, where("status", "==", "graduated"));
                 const graduatedSnap = await getCountFromServer(graduatedQ);
                 const graduated = graduatedSnap.data().count;

                 setStats({ total, active, graduated });
             } catch (error) {
                 console.error("Error fetching stats:", error);
             }
          };

          useEffect(() => {
             if (user) {
                 refreshStats();
             }
          }, [user, selectedRegFilter]);

          useEffect(() => {
            const unsub = onAuthStateChanged(auth, (u) => {
              setUser(u);
              if (!u) setLoading(false);
            });
            return () => unsub();
          }, []);

          useEffect(() => {
            if (!user) return;
            setLoading(true);
            const unsubscribe = onSnapshot(studentsCollection, (snapshot) => {
               const data = [];
               snapshot.forEach(d => {
                  const raw = d.data();
                  const createdAt = raw.createdAt?.toMillis ? raw.createdAt.toMillis() : (raw.createdAt || Date.now());
                  data.push({ id: d.id, ...raw, createdAt });
               });
               data.sort((a,b) => b.createdAt - a.createdAt);
               setStudents(data);
               setLoading(false);
            }, (error) => {
               console.error("Error fetching students:", error);
               setLoading(false);
            });
            return () => unsubscribe();
          }, [user]);

          useEffect(() => {
            const timer = setTimeout(() => setDebouncedQuery(search), 300);
            return () => clearTimeout(timer);
          }, [search]);

          useEffect(() => {
             const handleScroll = () => {
                setShowScrollTop(window.scrollY > 300);
             };
             window.addEventListener('scroll', handleScroll);
             return () => window.removeEventListener('scroll', handleScroll);
          }, []);

          useEffect(() => {
            localStorage.setItem('appTheme', colorTheme);
          }, [colorTheme]);

          useEffect(() => {
            localStorage.setItem('darkMode', isDarkMode);
            if (isDarkMode) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
          }, [isDarkMode]);

          useEffect(() => {
            const observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting) setVisibleCount((prev) => prev + 50);
            }, { threshold: 0.1 });
            if (loadMoreRef.current) observer.observe(loadMoreRef.current);
            return () => observer.disconnect();
          }, [students.length]);

          const handleImport = async (e) => {
            if (!userRole?.permissions.canImport) {
              setAlertConfig({ message: 'ليس لديك صلاحية لاستيراد البيانات', type: 'error' });
              return;
            }

            const file = e.target.files[0];
            if (!file) return;
            setImporting(true);
            setImportProgress(0);
            try {
              const rows = await readExcel(file);
              const totalRows = rows.length;
              let count = 0;
              let batch = writeBatch(db);
              let batchCount = 0;
              
              for (let i = 0; i < totalRows; i++) {
                 const row = rows[i];
                 const fName = row['الاسم الرباعي'] || row['الاسم الكامل'] || row['firstName'] || row['الاسم الأول'];
                 const reg = row['رقم القيد'] || row['regNumber'];
                 const page = row['رقم الصفحة'] || row['pageNumber'];
                 if (fName && reg) {
                    const ref = doc(studentsCollection);
                    batch.set(ref, {
                       firstName: String(fName).trim(),
                       lastName: row['العائلة'] || '',
                       regNumber: String(reg).trim(),
                       pageNumber: String(page || '').trim(),
                       status: 'active',
                       isDeleted: false,
                       createdAt: Date.now() + count
                    });
                    count++;
                    batchCount++;
                    
                    if (batchCount === 400) {
                        await batch.commit();
                        batch = writeBatch(db);
                        batchCount = 0;
                        setImportProgress(Math.round((i / totalRows) * 100));
                    }
                 }
              }
              
              if (batchCount > 0) {
                  await batch.commit();
              }
              
              setImportProgress(100);
              await refreshStats();
              
              // تسجيل النشاط
              await logActivity(user.uid, user.email, 'IMPORT', `استيراد ${count} سجل من Excel`);
              showNotification('اكتمل الاستيراد', `تم استيراد ${count} سجل بنجاح`);
              
              setAlertConfig({ message: `تم استيراد ${count} سجل بنجاح`, type: 'success' });
            } catch (e) { 
              setAlertConfig({ message: "فشل الاستيراد", type: 'error' }); 
            }
            setImporting(false);
            setTimeout(() => setImportProgress(0), 500);
          };

          const executeDeleteAll = async () => {
             if (!userRole?.permissions.canDeleteForever) {
               setAlertConfig({ message: 'ليس لديك صلاحية لحذف جميع البيانات', type: 'error' });
               return;
             }

             setConfirmConfig(null);
             setLoading(true);
             try {
               const snap = await getDocs(studentsCollection);
               const CHUNK_SIZE = 400;
               const allDocs = snap.docs;
               for (let i = 0; i < allDocs.length; i += CHUNK_SIZE) {
                  const batch = writeBatch(db);
                  const chunk = allDocs.slice(i, i + CHUNK_SIZE);
                  chunk.forEach((d) => batch.delete(d.ref));
                  await batch.commit();
               }
               await refreshStats();
               
               await logActivity(user.uid, user.email, 'DELETE_ALL', 'حذف جميع البيانات');
               
               setAlertConfig({ message: 'تم حذف جميع البيانات بنجاح', type: 'success' });
               setView('list');
             } catch (e) { 
               setAlertConfig({ message: "فشل حذف البيانات", type: 'error' }); 
             }
             finally { setLoading(false); }
          };

          const handleRestore = async (id) => {
            try {
                await updateDoc(doc(db, "students", id), { isDeleted: false });
                await refreshStats();
                
                await logActivity(user.uid, user.email, 'RESTORE_STUDENT', `استعادة طالب محذوف`, id);
                
                setAlertConfig({ message: 'تمت استعادة السجل بنجاح', type: 'success' });
            } catch(e) { console.error(e); }
          };

          const handleDeleteForever = (id) => {
            if (!userRole?.permissions.canDeleteForever) {
              setAlertConfig({ message: 'ليس لديك صلاحية للحذف النهائي', type: 'error' });
              return;
            }

            setConfirmConfig({
                title: "حذف نهائي",
                message: "هل أنت متأكد من حذف هذا السجل نهائياً؟ لا يمكن التراجع عن هذا الإجراء.",
                isDestructive: true,
                onConfirm: async () => {
                    await deleteDoc(doc(db, "students", id));
                    await refreshStats();
                    
                    await logActivity(user.uid, user.email, 'DELETE_FOREVER', `حذف نهائي لطالب`, id);
                    
                    setConfirmConfig(null);
                    setAlertConfig({ message: 'تم الحذف النهائي', type: 'success' });
                }
            });
          };

          const checkSimilarStudents = (val) => {
            const name = val.trim();
            if (name.length < 2) {
                setSimilarStudents([]);
                return;
            }
            const matches = students.filter(s => 
                !s.isDeleted && 
                s.id !== selectedId &&
                s.firstName.includes(name)
            );
            setSimilarStudents(matches);
          };

          const handleAddStudent = async (data) => {
            if (!userRole?.permissions.canAdd) {
              setAlertConfig({ message: 'ليس لديك صلاحية لإضافة طلاب', type: 'error' });
              return;
            }

            try {
              const docRef = await addDoc(studentsCollection, data);
              await logActivity(user.uid, user.email, 'ADD_STUDENT', `إضافة طالب جديد: ${data.firstName}`, docRef.id);
              showNotification('تمت الإضافة', `تم إضافة الطالب ${data.firstName} بنجاح`);
              return docRef;
            } catch (error) {
              throw error;
            }
          };

          const handleEditStudent = async (id, data) => {
            if (!userRole?.permissions.canEdit) {
              setAlertConfig({ message: 'ليس لديك صلاحية لتعديل البيانات', type: 'error' });
              return;
            }

            try {
              await updateDoc(doc(db, "students", id), data);
              await logActivity(user.uid, user.email, 'EDIT_STUDENT', `تعديل بيانات طالب: ${data.firstName}`, id);
              showNotification('تم التعديل', `تم تعديل بيانات الطالب بنجاح`);
            } catch (error) {
              throw error;
            }
          };

          const filtered = useMemo(() => {
            let res = students.filter(s => view === 'trash' ? s.isDeleted : !s.isDeleted);
            if (selectedRegFilter) res = res.filter(s => s.regNumber === selectedRegFilter);
            if (yearFilter !== 'ALL') res = res.filter(s => new Date(s.createdAt).getFullYear().toString() === yearFilter);
            if (statusFilter !== 'ALL') res = res.filter(s => (s.status || 'active') === statusFilter);
            if (debouncedQuery) {
               const q = debouncedQuery.toLowerCase();
               res = res.filter(s => {
                   const fullName = `${s.firstName} ${s.lastName || ''}`.toLowerCase();
                   return fullName.includes(q);
               });
               res.sort((a, b) => {
                   const aName = `${a.firstName} ${a.lastName || ''}`.toLowerCase();
                   const bName = `${b.firstName} ${b.lastName || ''}`.toLowerCase();
                   
                   const aIndex = aName.indexOf(q);
                   const bIndex = bName.indexOf(q);
                   
                   if (aIndex !== bIndex) {
                       return aIndex - bIndex;
                   }
                   
                   if (sortBy === 'alphabetical') return a.firstName.localeCompare(b.firstName);
                   return b.createdAt - a.createdAt;
               });
            } else {
               if (sortBy === 'alphabetical') res.sort((a,b) => a.firstName.localeCompare(b.firstName));
               else res.sort((a,b) => b.createdAt - a.createdAt);
            }
            return res;
          }, [students, debouncedQuery, selectedRegFilter, statusFilter, sortBy, yearFilter, view]);

          const displayed = useMemo(() => filtered.slice(0, visibleCount), [filtered, visibleCount]);

          if (!user) return <Login onLoginSuccess={(user) => setUser(user)} />;
        
          return (
            <>
              <div className="min-h-screen no-print pb-20">
                <header className="bg-white border-b sticky top-0 z-40 shadow-sm backdrop-blur-md bg-white/80">
                  <div className="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
                    <div className="flex items-center gap-2 font-bold text-base text-slate-800 cursor-pointer" onClick={() => setView('list')}>
                      <div className={`${currentTheme.primary} text-white p-1.5 rounded-lg shadow-lg transition-colors`}>
                        <GraduationCap size={18} />
                      </div>
                      <span>سجل القيد العام</span>
                      {userRole && (
                        <span className="mr-2">
                          <RoleBadge role={Object.keys(USER_ROLES).find(key => USER_ROLES[key] === userRole)} />
                        </span>
                      )}
                    </div>
                    <div className="flex items-center gap-1.5">
                      <Tooltip text="تغيير الألوان">
                        <button onClick={() => setShowThemeModal(true)} className="p-2 text-slate-500 hover:bg-slate-100 rounded-full transition-colors">
                          <Palette size={20} />
                        </button>
                      </Tooltip>
                      
                      {userRole?.permissions.canViewLogs && (
                        <Tooltip text="سجل النشاطات">
                          <button onClick={() => setShowActivityLog(true)} className="p-2 text-slate-500 hover:bg-slate-100 rounded-full transition-colors">
                            <History size={20} />
                          </button>
                        </Tooltip>
                      )}
                      
                      {userRole?.permissions.canManageUsers && (
                        <Tooltip text="إدارة المستخدمين">
                          <button onClick={() => setShowUserManagement(true)} className="p-2 text-slate-500 hover:bg-slate-100 rounded-full transition-colors">
                            <Users2 size={20} />
                          </button>
                        </Tooltip>
                      )}
                      
                      <Tooltip text="الإعدادات">
                        <button onClick={() => setView('settings')} className="p-2 text-slate-500 hover:bg-slate-100 rounded-full transition-colors">
                          <Settings size={20} />
                        </button>
                      </Tooltip>
                      
                      <Tooltip text="تسجيل الخروج">
                        <button onClick={() => setConfirmConfig({ title: "تسجيل خروج", message: "هل أنت متأكد من تسجيل الخروج؟", onConfirm: () => signOut(auth) })} className="p-2 text-red-500 hover:bg-red-50 rounded-full transition-colors">
                          <LogOut size={20} />
                        </button>
                      </Tooltip>
                    </div>
                  </div>
                </header>

                <main className="max-w-7xl mx-auto px-4 py-4">
                    {loading && students.length === 0 ? <SkeletonLoader /> : (
                        <div className="animate-fade-in space-y-4">
                          {view === 'trash' && (
                            <div className="flex items-center justify-between bg-red-50 p-3 rounded-xl border border-red-100 animate-slide-up">
                                <div className="flex items-center gap-2 text-red-700 font-bold text-sm">
                                    <Trash2 size={20} />
                                    <span>سلة المحذوفات</span>
                                </div>
                                <button onClick={() => setView('list')} className="flex items-center gap-2 bg-white text-slate-700 px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm hover:bg-slate-50 transition-colors">
                                  <ArrowLeft size={16}/> العودة إلى الرئيسية
                                </button>
                            </div>
                          )}

                          {view !== 'trash' && (
                            <div className="grid grid-cols-2 lg:grid-cols-3 gap-3">
                                <StatCard title="إجمالي الطلاب" value={students.filter(s => !s.isDeleted).length} icon={<Users size={18}/>} colorClass={currentTheme.secondary} />
                                <StatCard title="عدد القيود" value={regsCount} icon={<Layers size={18}/>} colorClass="bg-indigo-600" onClick={() => setView('stats')} />
                                <StatCard title="الحالات الأخرى" value={stats.total - stats.active - stats.graduated} icon={<Activity size={18}/>} colorClass="bg-amber-500" onClick={() => setView('statusStats')} />
                            </div>
                          )}

                          {/* Search Bar مع اختصار لوحة المفاتيح */}
                          <div className="bg-slate-50 p-1.5 rounded-xl border border-slate-200 transition-all mb-3">
                             <div className={`relative flex items-center bg-white rounded-lg border border-slate-200 px-3 py-1 focus-within:ring-2 ${currentTheme.ring} transition-all`}>
                                 <Search className="text-slate-400 ml-1" size={16} />
                                 <input 
                                   id="searchInput" 
                                   className="flex-1 bg-transparent outline-none text-slate-700 h-8 font-bold text-xs" 
                                   placeholder="ابحث باسم الطالب... (Ctrl+F)" 
                                   value={search} 
                                   onChange={(e) => setSearch(e.target.value)} 
                                 />
                                 {search && (
                                   <button onClick={() => setSearch('')} className="text-slate-400 hover:text-slate-600">
                                     <X size={14} />
                                   </button>
                                 )}
                             </div>
                          </div>

                          {/* Filters */}
                          <div className="grid grid-cols-2 md:grid-cols-4 gap-2 items-center mb-4">
                              <select value={selectedRegFilter} onChange={(e) => setSelectedRegFilter(e.target.value)} className="bg-white rounded-lg px-2 py-2 border border-slate-200 text-xs font-bold outline-none h-9">
                                  <option value="">جميع القيود</option>
                                  {Array.from(new Set(students.filter(s => !s.isDeleted).map(s => s.regNumber))).sort((a,b) => Number(a)-Number(b)).map(r => <option key={r} value={r}>قيد رقم {r}</option>)}
                              </select>
                              <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} className="bg-white rounded-lg px-2 py-2 border border-slate-200 text-xs font-bold outline-none h-9">
                                  <option value="ALL">جميع الحالات</option>
                                  <option value="active">مستمر</option>
                                  <option value="transferred">منقول</option>
                                  <option value="left">تارك</option>
                                  <option value="graduated">متخرج</option>
                              </select>
                              <select value={sortBy} onChange={e => setSortBy(e.target.value)} className="bg-white rounded-lg px-2 py-2 border border-slate-200 text-xs font-bold outline-none h-9">
                                  <option value="recent">الأحدث أولاً</option>
                                  <option value="alphabetical">ترتيب أبجدي</option>
                              </select>
                              <select value={yearFilter} onChange={e => setYearFilter(e.target.value)} className="bg-white rounded-lg px-2 py-2 border border-slate-200 text-xs font-bold outline-none h-9">
                                  <option value="ALL">جميع السنوات</option>
                                  {years.map(y => <option key={y} value={y}>{y}</option>)}
                              </select>
                          </div>

                          {/* Action Buttons مع صلاحيات */}
                          <div className="flex gap-3">
                                {userRole?.permissions.canAdd && (
                                  <Tooltip text="إضافة طالب جديد (Ctrl+N)">
                                    <button onClick={() => { setSelectedId(null); setView('add'); setSimilarStudents([]); }} className={`flex-1 ${currentTheme.primary} ${currentTheme.hover} text-white px-4 py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-2 shadow-lg transition-colors`}>
                                      <Plus size={16} /> إضافة طالب جديد
                                    </button>
                                  </Tooltip>
                                )}
                                
                                {userRole?.permissions.canPrint && (
                                  <Tooltip text="طباعة السجل (Ctrl+P)">
                                    <button onClick={() => setShowPrintModal(true)} className="flex-1 bg-white text-slate-700 border px-4 py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-2 hover:bg-slate-50 transition-colors">
                                      <Printer size={16} /> طباعة السجل
                                    </button>
                                  </Tooltip>
                                )}
                          </div>

                          {/* Desktop Table View */}
                          <div className="hidden md:block bg-white rounded-2xl border shadow-xl overflow-hidden mt-3">
                            <table className="w-full text-right border-collapse">

                {view === 'statusStats' && (
                    <Modal onClose={() => setView('list')}>
                        <div className="bg-white rounded-2xl shadow-xl p-5 space-y-4 max-h-[80vh] flex flex-col w-full">
                            <h2 className="text-lg font-bold flex items-center gap-2">
                                <PieChart size={20} className="text-amber-500" /> إحصائيات الوضع الأكاديمي
                            </h2>
                            <div className="overflow-y-auto flex-1 custom-scrollbar">
                                <table className="w-full text-right border-collapse">
                                    <thead className="bg-slate-50 sticky top-0 z-10">
                                        <tr>
                                            <th className="p-3 text-sm font-bold text-slate-500 border-b border-slate-200">الوضع الأكاديمي</th>
                                            <th className="p-3 text-sm font-bold text-slate-500 border-b border-slate-200">عدد الطلاب</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {statusStats.map((item) => (
                                            <tr key={item.label} className="hover:bg-slate-50 transition-colors">
                                                <td className="p-3 font-bold text-slate-700 text-sm">{item.label}</td>
                                                <td className="p-3 font-bold text-sm">
                                                    <span className={`px-2 py-1 rounded-lg ${item.color}`}>
                                                        {item.count} طالب
                                                    </span>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                             <button onClick={() => setView('list')} className="w-full py-3 bg-slate-100 font-bold rounded-xl text-slate-600 text-sm hover:bg-slate-200 transition-colors">إغلاق</button>
                        </div>
                    </Modal>
                )}

                {view === 'detail' && selectedId && (() => {
                    const s = students.find(x => x.id === selectedId);
                    if (!s) return null;
                    const statusLabels = { 'active': 'مستمر', 'transferred': 'منقول', 'left': 'تارك', 'graduated': 'متخرج' };
                    const statusColors = { 'active': 'bg-emerald-100 text-emerald-700', 'transferred': 'bg-amber-100 text-amber-700', 'left': 'bg-rose-100 text-rose-700', 'graduated': 'bg-blue-100 text-blue-700' };

                    return (
                      <Modal onClose={() => { setView('list'); setSimilarStudents([]); }}>
                         <div className="bg-white rounded-3xl shadow-2xl p-5 md:p-6 space-y-6 animate-slide-up relative overflow-hidden">
                             <div className="absolute top-0 right-0 w-24 h-24 bg-slate-50 rounded-full -mr-8 -mt-8"></div>
            
                            <div className="relative">
                                <h1 className="text-2xl font-extrabold text-slate-900 mb-1">{cleanName(s.firstName)}</h1>
                                <h2 className="text-lg font-bold text-slate-400">{s.lastName || ""}</h2>
                            </div>

                            <div className="grid grid-cols-2 gap-3">
                               <div className={`${currentTheme.primary} text-white p-4 rounded-xl shadow-lg flex flex-col items-center justify-center transform transition-transform hover:scale-[1.02]`}>
                                   <span className="text-slate-200 text-[10px] font-bold uppercase tracking-wider mb-1">رقم القيد</span>
                                   <span className="text-3xl font-mono font-black">{s.regNumber}</span>
                               </div>
                               <div className="bg-white border-2 border-slate-100 p-4 rounded-xl shadow-sm flex flex-col items-center justify-center transform transition-transform hover:scale-[1.02]">
                                   <span className="text-slate-400 text-[10px] font-bold uppercase tracking-wider mb-1">رقم الصفحة</span>
                                   <span className="text-3xl font-mono font-black text-slate-800">{s.pageNumber}</span>
                               </div>
                            </div>

                            <div className="bg-slate-50 rounded-xl p-4 border border-slate-100 space-y-3">
                                <div className="flex justify-between items-center border-b border-slate-200 pb-3">
                                    <div className="flex items-center gap-2">
                                        <div className="p-1.5 bg-white rounded-lg shadow-sm"><Calendar size={16} className="text-slate-500"/></div>
                                        <div>
                                            <div className="text-[10px] font-bold text-slate-400">تاريخ القيد</div>
                                            <div className="font-bold text-slate-800 text-sm">{new Date(s.createdAt).toLocaleDateString('ar-EG')}</div>
                                        </div>
                                    </div>
                                    <button
                                      onClick={() => {
                                        setSelectedStudentForQR(s);
                                        setShowQRCode(true);
                                      }}
                                      className="p-2 bg-white rounded-lg shadow-sm hover:bg-slate-50"
                                    >
                                      <QrCode size={18} className="text-slate-500" />
                                    </button>
                                </div>
                                <div className="flex justify-between items-center">
                                    <div className="flex items-center gap-2">
                                        <div className="p-1.5 bg-white rounded-lg shadow-sm"><Info size={16} className="text-slate-500"/></div>
                                        <div>
                                            <div className="text-[10px] font-bold text-slate-400">الوضع الأكاديمي</div>
                                            <div className={`inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-bold mt-0.5 ${statusColors[s.status] || statusColors['active']}`}>
                                                {statusLabels[s.status] || 'مستمر'}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                {s.notes && (
                                    <div className="pt-3 border-t border-slate-200">
                                        <div className="text-[10px] font-bold text-slate-400 mb-1">ملاحظات</div>
                                        <p className="text-slate-700 font-medium leading-relaxed text-sm">{s.notes}</p>
                                    </div>
                                )}
                            </div>

                            {userRole?.permissions.canPrint && (
                              <button onClick={() => { setSelectedId(s.id); setPrintMode('single'); setTimeout(() => window.print(), 500); }} className={`w-full ${currentTheme.secondary} ${currentTheme.secondaryHover} text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all shadow-lg text-sm`}>
                                <Printer size={18}/> طباعة البطاقة الشخصية
                              </button>
                            )}
                            
                            <div className="flex gap-2">
                                {userRole?.permissions.canEdit && (
                                  <button onClick={() => { setView('edit'); setSimilarStudents([]); }} className="flex-1 bg-slate-100 py-2.5 rounded-xl font-bold hover:bg-slate-200 text-slate-700 transition-colors text-sm">
                                    تعديل البيانات
                                  </button>
                                )}
                                
                                {view !== 'trash' && userRole?.permissions.canDelete && (
                                    <button onClick={() => setConfirmConfig({ title: "حذف الطالب", message: "هل تريد نقل هذا الطالب إلى سلة المحذوفات؟", onConfirm: async () => { await updateDoc(doc(db, "students", s.id), { isDeleted: true }); setView('list'); setConfirmConfig(null); setSelectedId(null); setAlertConfig({ message: 'تم نقل الطالب إلى سلة المحذوفات', type: 'success' }); await refreshStats(); } })} className="flex-1 bg-red-50 text-red-600 py-2.5 rounded-xl font-bold hover:bg-red-100 transition-colors text-sm">
                                      حذف
                                    </button>
                                )}
                            </div>
                         </div>
                      </Modal>
                    );
                })()}

                {showPrintModal && (
                    <Modal onClose={() => setShowPrintModal(false)}>
                       <div className="bg-white rounded-2xl p-5 text-center space-y-3 shadow-xl">
                          <h3 className="text-lg font-bold">خيارات الطباعة</h3>
                          <button onClick={() => { setPrintMode('list'); setPrintRegInput(''); setShowPrintModal(false); setTimeout(() => window.print(), 500); }} className={`w-full py-2.5 ${currentTheme.primary} ${currentTheme.hover} text-white rounded-xl font-bold transition-colors text-sm`}>
                            طباعة السجل الحالي بالكامل
                          </button>
                          <div className="text-slate-400 text-[10px]">أو طباعة قيد محدد</div>
                          <select value={printRegInput} onChange={(e) => setPrintRegInput(e.target.value)} className={`w-full p-2.5 border rounded-xl text-center font-bold outline-none text-sm ${currentTheme.ring}`}>
                               <option value="">اختر رقم القيد...</option>
                               {Array.from(new Set(students.filter(s => !s.isDeleted).map(s => s.regNumber))).sort().map(r => <option key={r} value={r}>قيد رقم {r}</option>)}
                          </select>
                          <button onClick={() => { setPrintMode('list'); setSelectedRegFilter(printRegInput); setShowPrintModal(false); setTimeout(() => window.print(), 500); }} className={`w-full py-2.5 ${currentTheme.secondary} ${currentTheme.secondaryHover} text-white rounded-xl font-bold disabled:opacity-50 transition-colors text-sm`} disabled={!printRegInput}>
                            طباعة القيد المحدد
                          </button>
                       </div>
                    </Modal>
                )}

                {showUserManagement && (
                  <UserManagement 
                    currentUser={user} 
                    currentUserRole={userRole} 
                    onClose={() => setShowUserManagement(false)} 
                  />
                )}

                {showActivityLog && (
                  <ActivityLog 
                    currentUser={user} 
                    currentUserRole={userRole} 
                    onClose={() => setShowActivityLog(false)} 
                  />
                )}

                {confirmConfig && <ConfirmModal title={confirmConfig.title} message={confirmConfig.message} onConfirm={confirmConfig.onConfirm} onCancel={() => setConfirmConfig(null)} isDestructive={confirmConfig.isDestructive} />}
                {alertConfig && <AlertModal message={alertConfig.message} type={alertConfig.type} onClose={() => setAlertConfig(null)} />}
                
                {importing && (
                  <Modal onClose={() => {}} zIndex="z-[80]">
                    <div className="bg-white rounded-2xl p-8 flex flex-col items-center gap-4 shadow-2xl">
                      <div className="relative flex items-center justify-center">
                          <div className="animate-spin text-blue-600"><Loader2 size={64} /></div>
                          <div className="absolute text-sm font-bold text-blue-800" dir="ltr">{importProgress}%</div>
                      </div>
                      <h3 className="text-xl font-bold text-slate-800">جاري استيراد البيانات...</h3>
                      <p className="text-slate-500">يرجى الانتظار قليلاً</p>
                      <div className="w-full bg-slate-100 rounded-full h-2 mt-2 overflow-hidden">
                          <div className="bg-blue-600 h-2 rounded-full transition-all duration-300" style={{ width: `${importProgress}%` }}></div>
                      </div>
                    </div>
                  </Modal>
                )}
              </div>
              
              {printMode === 'list' && <PrintView students={filtered} title={selectedRegFilter ? `كشف الطلاب - قيد رقم ${selectedRegFilter}` : "كشف القيد العام"} />}
              {printMode === 'single' && students.find(s=>s.id===selectedId) && <SingleStudentPrint student={students.find(s=>s.id===selectedId)} />}
            </>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
    </html>
