<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سجل قيود الطلاب</title>
    
    <!-- Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              cairo: ['Cairo', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Cairo', sans-serif;
        background-color: #f8fafc;
        color: #1e293b;
        overflow-x: hidden;
      }
      /* Print Styles */
      @media print {
        @page { size: A4; margin: 0; }
        body { background-color: white; margin: 0; }
        .no-print { display: none !important; }
        .print-only { display: block !important; }
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .print-only { display: none; }
      
      /* Scrollbars */
      ::-webkit-scrollbar { width: 12px; }
      ::-webkit-scrollbar-track { background-color: #f1f5f9; border-left: 1px solid #e2e8f0; }
      ::-webkit-scrollbar-thumb { background-color: #94a3b8; border-radius: 6px; border: 3px solid #f1f5f9; }
      ::-webkit-scrollbar-thumb:hover { background-color: #64748b; }

      /* Animations */
      @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
      .animate-fade-in { animation: fade-in 0.3s ease-out; }
      @keyframes slide-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .animate-slide-up { animation: slide-up 0.3s ease-out; }
    </style>

    <!-- React & Babel Support -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Import Map -->
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.263.1?deps=react@18.2.0",
    "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
    "xlsx": "https://cdn.sheetjs.com/xlsx-0.20.1/package/xlsx.mjs",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "firebase/": "https://esm.sh/firebase@^12.9.0/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef } from 'react';
        import ReactDOM from 'react-dom/client';
        import { 
          Users, LogOut, Settings, Search, Plus, Printer, 
          Trash2, FileSpreadsheet, Download, Upload, AlertTriangle, ArrowRight, Save, X, FileText, CheckCircle2, XCircle, AlertCircle, ArrowUp, Filter, UserCheck
        } from 'lucide-react';
        import { initializeApp } from "firebase/app";
        import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, deleteDoc, writeBatch } from "firebase/firestore";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "firebase/auth";
        import * as XLSX from 'xlsx';

        // ==========================================
        // FIREBASE CONFIG
        // ==========================================
        const firebaseConfig = {
          apiKey: "AIzaSyC3Hyi-tVMui0ZyPsezvoxxSFjCJQBme9Q",
          authDomain: "ss-app-87ac7.firebaseapp.com",
          projectId: "ss-app-87ac7",
          storageBucket: "ss-app-87ac7.firebasestorage.app",
          messagingSenderId: "7671656513",
          appId: "1:7671656513:web:21b51edb450bddd1aad6c0",
          measurementId: "G-LQPLFRBGKH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const studentsCollection = collection(db, "students");

        // ==========================================
        // UI COMPONENTS
        // ==========================================
        const Modal = ({ children, onClose }) => (
          <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in overflow-y-auto" onClick={onClose}>
            <div className="w-full max-w-xl relative" onClick={e => e.stopPropagation()}>
               {children}
            </div>
          </div>
        );

        const StatCard = ({ title, value, icon, colorClass }) => (
          <div className="bg-white p-3 rounded-xl border border-slate-100 shadow-sm flex flex-col items-center justify-center text-center gap-2 hover:shadow-md transition-shadow">
            <div className={`p-2 rounded-full ${colorClass} text-white shadow-sm`}>{icon}</div>
            <div>
              <div className="text-xl font-bold text-slate-800 font-mono leading-none">{value}</div>
              <div className="text-[10px] text-slate-500 font-semibold mt-1">{title}</div>
            </div>
          </div>
        );

        const StatusBadge = ({ status }) => {
           if (status === 'transferred') return <span className="inline-flex items-center gap-1 bg-amber-100 text-amber-700 px-2 py-0.5 rounded text-xs font-bold border border-amber-200">منقول</span>;
           if (status === 'left') return <span className="inline-flex items-center gap-1 bg-rose-100 text-rose-700 px-2 py-0.5 rounded text-xs font-bold border border-rose-200">تارك</span>;
           return <span className="inline-flex items-center gap-1 bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded text-xs font-bold border border-emerald-200">مستمر</span>;
        };

        // ==========================================
        // MAIN APP
        // ==========================================
        const App = () => {
          const [user, setUser] = useState(null);
          const [loading, setLoading] = useState(true);
          const [students, setStudents] = useState([]);
          const [view, setView] = useState('list');
          const [selectedId, setSelectedId] = useState(null);
          
          const [search, setSearch] = useState('');
          const [debouncedQuery, setDebouncedQuery] = useState(''); 
          const [selectedRegFilter, setSelectedRegFilter] = useState(''); 
          const [statusFilter, setStatusFilter] = useState('ALL');
          const [sortBy, setSortBy] = useState('recent');
          const [letterFilter, setLetterFilter] = useState('ALL');
          
          const [showPrintModal, setShowPrintModal] = useState(false);
          const [visibleCount, setVisibleCount] = useState(50);
          const loadMoreRef = useRef(null);
          const [showTopBtn, setShowTopBtn] = useState(false);
          const [importing, setImporting] = useState(false);
          const [nameWarning, setNameWarning] = useState('');

          const uniqueRegNumbers = useMemo(() => {
             const regs = new Set(students.map(s => s.regNumber));
             return Array.from(regs).sort((a, b) => Number(a) - Number(b));
          }, [students]);

          const stats = useMemo(() => ({
            total: students.length,
            active: students.filter(s => (s.status || 'active') === 'active').length,
            regs: uniqueRegNumbers.length,
            others: students.filter(s => (s.status || 'active') !== 'active').length
          }), [students, uniqueRegNumbers]);

          useEffect(() => {
            const cached = localStorage.getItem('students_cache');
            if (cached) {
               try {
                   const parsed = JSON.parse(cached);
                   if (Array.isArray(parsed) && parsed.length > 0) {
                       setStudents(parsed);
                       setLoading(false);
                   }
               } catch(e) { console.error(e); }
            }

            const unsub = onAuthStateChanged(auth, (u) => {
              setUser(u);
              if (u) fetchStudents();
              else setLoading(false);
            });
            return () => unsub();
          }, []);

          useEffect(() => {
            const timer = setTimeout(() => setDebouncedQuery(search), 300);
            return () => clearTimeout(timer);
          }, [search]);

          useEffect(() => {
            setVisibleCount(50);
            window.scrollTo(0, 0);
          }, [debouncedQuery, selectedRegFilter, statusFilter, sortBy, letterFilter]);

          const fetchStudents = async () => {
            try {
              const snap = await getDocs(studentsCollection);
              const data = [];
              snap.forEach(d => data.push({id: d.id, status: 'active', ...d.data()}));
              data.sort((a,b) => b.createdAt - a.createdAt);
              setStudents(data);
              localStorage.setItem('students_cache', JSON.stringify(data));
            } catch (e) { console.error(e); }
            finally { setLoading(false); }
          };

          const filtered = useMemo(() => {
            let res = students;
            // Filter by Reg first
            if (selectedRegFilter) res = res.filter(s => s.regNumber === selectedRegFilter);
            if (letterFilter !== 'ALL') res = res.filter(s => s.firstName.startsWith(letterFilter));
            if (statusFilter !== 'ALL') res = res.filter(s => (s.status || 'active') === statusFilter);
            // Search WITHIN the current filter context
            if (debouncedQuery) {
               const q = debouncedQuery.toLowerCase();
               res = res.filter(s => s.firstName.toLowerCase().includes(q) || (s.lastName && s.lastName.toLowerCase().includes(q)));
            }
            if (sortBy === 'alphabetical') res.sort((a,b) => a.firstName.localeCompare(b.firstName));
            else res.sort((a,b) => b.createdAt - a.createdAt);
            return res;
          }, [students, debouncedQuery, selectedRegFilter, statusFilter, sortBy, letterFilter]);

          const displayed = useMemo(() => filtered.slice(0, visibleCount), [filtered, visibleCount]);
          const arabicLetters = ['أ', 'ا', 'ب', 'ت', 'ث', 'ج', 'ح', 'خ', 'د', 'ذ', 'ر', 'ز', 'س', 'ش', 'ص', 'ض', 'ط', 'ظ', 'ع', 'غ', 'ف', 'ق', 'ك', 'ل', 'م', 'ن', 'هـ', 'و', 'ي'];

          if (loading && students.length === 0) return <div className="h-screen flex items-center justify-center font-bold text-slate-400">جاري تحميل السجلات...</div>;
          if (!user) return (
            <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 animate-fade-in text-center">
                    <Users className="w-16 h-16 bg-blue-600 text-white p-3 rounded-2xl mx-auto mb-6 shadow-lg" />
                    <h2 className="text-2xl font-bold text-slate-800 mb-6">تسجيل الدخول للنظام</h2>
                    <form onSubmit={async (e) => { e.preventDefault(); try { await signInWithEmailAndPassword(auth, e.target.email.value, e.target.password.value); } catch(err) { alert("بيانات غير صحيحة"); } }} className="space-y-4">
                        <input name="email" type="email" placeholder="البريد الإلكتروني" required className="w-full px-4 py-3 rounded-xl border focus:border-blue-500 outline-none text-right" />
                        <input name="password" type="password" placeholder="كلمة المرور" required className="w-full px-4 py-3 rounded-xl border focus:border-blue-500 outline-none text-right" />
                        <button className="w-full bg-slate-900 text-white py-4 rounded-xl font-bold text-lg hover:bg-slate-800 transition-all">دخول</button>
                    </form>
                </div>
            </div>
          );

          return (
            <div className="min-h-screen no-print pb-20">
                <header className="bg-white border-b sticky top-0 z-40 shadow-sm backdrop-blur-md bg-white/80">
                  <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                    <div className="flex items-center gap-2 font-bold text-lg text-slate-800" onClick={() => setView('list')}>
                      <div className="bg-slate-900 text-white p-1.5 rounded-lg"><Users size={18} /></div>
                      <span>سجل القيود</span>
                    </div>
                    <div className="flex items-center gap-2">
                      <button onClick={() => setView('settings')} className="p-2 text-slate-500 hover:bg-slate-100 rounded-full transition-colors"><Settings size={22} /></button>
                      <button onClick={() => signOut(auth)} className="p-2 text-red-500 hover:bg-red-50 rounded-full transition-colors"><LogOut size={22} /></button>
                    </div>
                  </div>
                </header>

                <main className="max-w-7xl mx-auto px-4 py-6">
                    <div className="animate-fade-in space-y-6">
                      {/* لوحة الإحصائيات المطورة */}
                      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                        <StatCard title="إجمالي الطلاب" value={stats.total} icon={<Users size={18}/>} colorClass="bg-blue-600" />
                        <StatCard title="المستمرون" value={stats.active} icon={<UserCheck size={18}/>} colorClass="bg-emerald-600" />
                        <StatCard title="القيود" value={stats.regs} icon={<FileSpreadsheet size={18}/>} colorClass="bg-indigo-600" />
                        <StatCard title="تارك/منقول" value={stats.others} icon={<AlertTriangle size={18}/>} colorClass="bg-amber-500" />
                      </div>

                      <div className="flex flex-col md:flex-row gap-4">
                        <div className="flex-1 bg-white p-2 rounded-2xl border shadow-sm flex flex-col sm:flex-row items-center gap-2">
                           <div className="flex items-center w-full sm:w-auto flex-1 gap-2 px-2">
                               <Search className="text-slate-400" size={20} />
                               <input className="flex-1 outline-none text-sm text-slate-700 bg-transparent h-10" placeholder="بحث بالاسم داخل القيد المختار..." value={search} onChange={(e) => setSearch(e.target.value)} />
                               {search && <button onClick={() => setSearch('')} className="p-1 text-slate-400 hover:text-red-500"><X size={18}/></button>}
                           </div>
                           <div className="flex items-center gap-2 w-full sm:w-auto border-t sm:border-t-0 sm:border-r border-slate-100 pt-2 sm:pt-0 sm:pr-3 mt-2 sm:mt-0">
                               <div className="flex items-center gap-1">
                                   <Filter size={16} className="text-slate-400" />
                                   <select value={selectedRegFilter} onChange={(e) => setSelectedRegFilter(e.target.value)} className="bg-transparent text-sm text-slate-700 font-bold outline-none p-1 cursor-pointer hover:text-blue-600">
                                       <option value="">جميع القيود</option>
                                       {uniqueRegNumbers.map(r => <option key={r} value={r}>قيد {r}</option>)}
                                   </select>
                               </div>
                               <div className="h-5 w-px bg-slate-200"></div>
                               <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} className="bg-transparent text-xs text-slate-600 outline-none p-1 font-bold cursor-pointer">
                                 <option value="ALL">كل الحالات</option>
                                 <option value="active">مستمر</option>
                                 <option value="transferred">منقول</option>
                                 <option value="left">تارك</option>
                               </select>
                           </div>
                        </div>
                        <div className="flex gap-2">
                          <button onClick={() => { setSelectedId(null); setView('add'); }} className="bg-slate-900 text-white px-6 py-3 rounded-2xl text-sm font-bold flex items-center gap-2 shadow-lg shadow-slate-900/10 hover:bg-slate-800 transition-all"><Plus size={18} /> إضافة جديد</button>
                          <button onClick={() => setShowPrintModal(true)} className="bg-white text-slate-700 border px-6 py-3 rounded-2xl text-sm font-bold flex items-center gap-2 hover:bg-slate-50 transition-colors"><Printer size={18} /> طباعة</button>
                        </div>
                      </div>

                      {/* جدول الطلاب - التنسيق الجديد */}
                      <div className="bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden">
                        <div className="overflow-x-auto">
                          <table className="w-full text-right border-collapse">
                            <thead className="bg-slate-50/80 border-b border-slate-200 text-slate-500 text-xs font-bold uppercase tracking-wider">
                              <tr>
                                <th className="p-4 w-16 text-center">#</th>
                                <th className="p-4">اسم الطالب</th>
                                <th className="p-4 w-32 text-center">رقم القيد</th>
                                <th className="p-4 w-28 text-center">الصفحة</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-50 text-sm">
                              {displayed.map((s, idx) => (
                                <tr key={s.id} onClick={() => { setSelectedId(s.id); setView('detail'); }} className="hover:bg-blue-50/40 cursor-pointer transition-all group">
                                  <td className="p-4 text-center text-slate-400 font-mono font-medium">{idx + 1}</td>
                                  <td className="p-4">
                                     <div className="flex items-start gap-3">
                                        {/* دائرة الحالة - محاذاة ذكية للجوال */}
                                        <div className={`w-3 h-3 rounded-full flex-shrink-0 mt-1.5 shadow-sm ${s.status === 'left' ? 'bg-rose-500' : s.status === 'transferred' ? 'bg-amber-500' : 'bg-emerald-500'}`}></div>
                                        <div className="flex flex-col">
                                           <span className="font-bold text-slate-800 text-base leading-tight group-hover:text-blue-700 transition-colors">{s.firstName}</span>
                                           <span className="text-slate-400 text-xs mt-0.5">{s.lastName}</span>
                                        </div>
                                     </div>
                                  </td>
                                  <td className="p-4 text-center">
                                    <span className="bg-[#5314cd] text-white px-4 py-2 rounded-xl text-lg font-bold font-mono shadow-md inline-block min-w-[70px] dir-ltr">
                                      {s.regNumber}
                                    </span>
                                  </td>
                                  <td className="p-4 text-center">
                                    <span className="bg-[#FFA500] text-white px-4 py-2 rounded-xl text-lg font-bold font-mono shadow-md inline-block min-w-[70px]">
                                      {s.pageNumber}
                                    </span>
                                  </td>
                                </tr>
                              ))}
                              {displayed.length === 0 && <tr><td colSpan={4} className="p-16 text-center text-slate-400 font-medium">لا توجد نتائج مطابقة لعملية البحث في هذا القيد</td></tr>}
                            </tbody>
                          </table>
                          {displayed.length > 0 && displayed.length < filtered.length && (
                            <div ref={loadMoreRef} className="p-10 text-center w-full">
                               <div className="inline-block w-8 h-8 border-4 border-slate-200 border-t-slate-800 rounded-full animate-spin"></div>
                            </div>
                          )}
                        </div>
                      </div>
                    </div>
                </main>

                {/* Modals with enhanced UI */}
                {(view === 'add' || view === 'edit') && (
                    <Modal onClose={() => setView('list')}>
                      <div className="bg-white rounded-3xl shadow-2xl overflow-hidden animate-slide-up border border-slate-100">
                        <div className="p-6 border-b flex justify-between items-center bg-slate-50/50">
                          <h2 className="text-xl font-extrabold text-slate-800">{view === 'add' ? 'إضافة سجل طالب' : 'تعديل بيانات الطالب'}</h2>
                          <button onClick={() => setView('list')} className="p-2 bg-white rounded-full hover:bg-slate-100 text-slate-400 transition-all"><X size={20}/></button>
                        </div>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const form = new FormData(e.target);
                            const data = {
                                firstName: form.get('firstName'),
                                lastName: form.get('lastName'),
                                regNumber: form.get('regNumber'),
                                pageNumber: form.get('pageNumber'),
                                notes: form.get('notes'),
                                status: form.get('status') || 'active'
                            };
                            try {
                                if (view === 'edit') await updateDoc(doc(db, "students", selectedId), data);
                                else await addDoc(studentsCollection, { ...data, createdAt: Date.now() });
                                fetchStudents();
                                setView('list');
                            } catch(err) { alert("حدث خطأ أثناء الحفظ"); }
                        }} className="p-8 space-y-6">
                           <div className="grid grid-cols-2 gap-4">
                             <div className="col-span-2">
                               <label className="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-widest">الاسم الكامل</label>
                               <input name="firstName" required defaultValue={view === 'edit' ? students.find(s=>s.id===selectedId)?.firstName : ''} className="w-full p-4 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-blue-500 outline-none text-base font-bold shadow-inner" placeholder="اسم الطالب الرباعي" />
                             </div>
                             <div className="col-span-2">
                               <label className="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-widest">اللقب / العشيرة</label>
                               <input name="lastName" defaultValue={view === 'edit' ? students.find(s=>s.id===selectedId)?.lastName : ''} className="w-full p-4 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-blue-500 outline-none text-base font-bold shadow-inner" placeholder="اللقب إن وجد" />
                             </div>
                           </div>
                           <div className="grid grid-cols-2 gap-4">
                             <div>
                                <label className="text-xs font-bold text-slate-400 mb-2 block uppercase tracking-widest">رقم القيد</label>
                                <input name="regNumber" required className="w-full p-4 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-blue-500 outline-none font-mono text-center text-xl font-bold shadow-inner" defaultValue={view === 'edit' ? students.find(s=>s.id===selectedId)?.regNumber : ''} />
                             </div>
                             <div>
                                <label className="text-xs font-bold text-slate-400 mb-2 block uppercase tracking-widest">رقم الصفحة</label>
                                <input name="pageNumber" required className="w-full p-4 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-blue-500 outline-none font-mono text-center text-xl font-bold shadow-inner" defaultValue={view === 'edit' ? students.find(s=>s.id===selectedId)?.pageNumber : ''} />
                             </div>
                           </div>
                           <div>
                              <label className="block text-xs font-bold text-slate-400 mb-3 uppercase tracking-widest">حالة الطالب الحالية</label>
                              <div className="grid grid-cols-3 gap-3">
                                <label className="cursor-pointer group">
                                    <input type="radio" name="status" value="active" className="peer hidden" defaultChecked={view==='add' || students.find(s=>s.id===selectedId)?.status === 'active'} />
                                    <div className="py-3 px-2 rounded-2xl border-2 border-slate-100 text-center font-bold text-sm text-slate-500 peer-checked:bg-emerald-500 peer-checked:text-white peer-checked:border-emerald-500 transition-all shadow-sm">مستمر</div>
                                </label>
                                <label className="cursor-pointer group">
                                    <input type="radio" name="status" value="transferred" className="peer hidden" defaultChecked={students.find(s=>s.id===selectedId)?.status === 'transferred'} />
                                    <div className="py-3 px-2 rounded-2xl border-2 border-slate-100 text-center font-bold text-sm text-slate-500 peer-checked:bg-amber-500 peer-checked:text-white peer-checked:border-amber-500 transition-all shadow-sm">منقول</div>
                                </label>
                                <label className="cursor-pointer group">
                                    <input type="radio" name="status" value="left" className="peer hidden" defaultChecked={students.find(s=>s.id===selectedId)?.status === 'left'} />
                                    <div className="py-3 px-2 rounded-2xl border-2 border-slate-100 text-center font-bold text-sm text-slate-500 peer-checked:bg-rose-500 peer-checked:text-white peer-checked:border-rose-500 transition-all shadow-sm">تارك</div>
                                </label>
                              </div>
                           </div>
                           <button className="w-full bg-slate-900 text-white py-5 rounded-2xl font-black text-lg hover:bg-slate-800 transition-all shadow-xl shadow-slate-900/30 mt-4 uppercase tracking-wider">حفظ البيانات</button>
                        </form>
                      </div>
                    </Modal>
                )}
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
