<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سجل القيد العام</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
    
    <!-- Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              cairo: ['Cairo', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Cairo', sans-serif;
        background-color: #f8fafc;
        color: #1e293b;
      }
      @media print {
        .no-print { display: none !important; }
        .print-only { display: block !important; }
      }
      .print-only { display: none; }
    </style>

    <!-- React and Firebase Scripts -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- XLSX -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Firebase Configuration
        const firebaseConfig = {
          apiKey: "AIzaSyC3Hyi-tVMui0ZyPsezvoxxSFjCJQBme9Q",
          authDomain: "ss-app-87ac7.firebaseapp.com",
          projectId: "ss-app-87ac7",
          storageBucket: "ss-app-87ac7.firebasestorage.app",
          messagingSenderId: "7671656513",
          appId: "1:7671656513:web:21b51edb450bddd1aad6c0",
          measurementId: "G-LQPLFRBGKH"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(app);
        const auth = firebase.auth(app);
        
        // Enable offline persistence
        db.enablePersistence()
          .catch((err) => {
            if (err.code == 'failed-precondition') {
              console.log('Persistence failed');
            } else if (err.code == 'unimplemented') {
              console.log('Persistence not available');
            }
          });

        // Collections
        const studentsCollection = db.collection("students");

        // Helper Functions
        const cleanName = (name) => {
            if (!name) return "";
            return name.replace(/\s+\d+$/, '').trim();
        };

        const formatDate = (timestamp) => {
            if (!timestamp) return '';
            if (timestamp.toDate) {
                return timestamp.toDate().toLocaleDateString('ar-EG');
            }
            return new Date(timestamp).toLocaleDateString('ar-EG');
        };

        // Main App Component
        function App() {
          const [user, setUser] = React.useState(null);
          const [loading, setLoading] = React.useState(true);
          const [students, setStudents] = React.useState([]);
          const [view, setView] = React.useState('list');
          const [selectedId, setSelectedId] = React.useState(null);
          const [search, setSearch] = React.useState('');
          const [selectedRegFilter, setSelectedRegFilter] = React.useState('');
          const [statusFilter, setStatusFilter] = React.useState('ALL');
          const [sortBy, setSortBy] = React.useState('recent');
          const [alertConfig, setAlertConfig] = React.useState(null);
          const [confirmConfig, setConfirmConfig] = React.useState(null);
          const [importing, setImporting] = React.useState(false);
          const [importProgress, setImportProgress] = React.useState(0);
          const [showPrintModal, setShowPrintModal] = React.useState(false);
          const [printRegInput, setPrintRegInput] = React.useState('');
          const [printMode, setPrintMode] = React.useState('list');
          const [isDarkMode, setIsDarkMode] = React.useState(localStorage.getItem('darkMode') === 'true');

          // Dark mode effect
          React.useEffect(() => {
            localStorage.setItem('darkMode', isDarkMode);
            if (isDarkMode) {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }
          }, [isDarkMode]);

          // Auth state observer
          React.useEffect(() => {
            const unsubscribe = auth.onAuthStateChanged((user) => {
              setUser(user);
              setLoading(false);
            });
            return () => unsubscribe();
          }, []);

          // Load students
          React.useEffect(() => {
            if (!user) return;

            const unsubscribe = studentsCollection.onSnapshot((snapshot) => {
              const data = [];
              snapshot.forEach(doc => {
                const docData = doc.data();
                data.push({ 
                  id: doc.id, 
                  ...docData,
                  createdAt: docData.createdAt?.toDate ? docData.createdAt.toDate().getTime() : docData.createdAt 
                });
              });
              setStudents(data);
            }, (error) => {
              console.error("Error loading students:", error);
            });

            return () => unsubscribe();
          }, [user]);

          // Filter students
          const filteredStudents = React.useMemo(() => {
            let filtered = students.filter(s => view === 'trash' ? s.isDeleted : !s.isDeleted);
            
            if (selectedRegFilter) {
              filtered = filtered.filter(s => s.regNumber === selectedRegFilter);
            }
            
            if (statusFilter !== 'ALL') {
              filtered = filtered.filter(s => (s.status || 'active') === statusFilter);
            }
            
            if (search) {
              const query = search.toLowerCase();
              filtered = filtered.filter(s => 
                (s.firstName?.toLowerCase().includes(query) || 
                 s.lastName?.toLowerCase().includes(query))
              );
            }
            
            if (sortBy === 'alphabetical') {
              filtered.sort((a, b) => (a.firstName || '').localeCompare(b.firstName || ''));
            } else {
              filtered.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            }
            
            return filtered;
          }, [students, search, selectedRegFilter, statusFilter, sortBy, view]);

          // Stats
          const stats = React.useMemo(() => {
            const active = students.filter(s => !s.isDeleted);
            return {
              total: active.length,
              active: active.filter(s => s.status === 'active').length,
              transferred: active.filter(s => s.status === 'transferred').length,
              left: active.filter(s => s.status === 'left').length,
              graduated: active.filter(s => s.status === 'graduated').length
            };
          }, [students]);

          const regsCount = React.useMemo(() => {
            return new Set(students.filter(s => !s.isDeleted).map(s => s.regNumber)).size;
          }, [students]);

          // Export to Excel
          const exportToExcel = () => {
            const statusMap = { 
              'active': 'مستمر', 
              'transferred': 'منقول', 
              'left': 'تارك', 
              'graduated': 'متخرج' 
            };
            
            const data = students.filter(s => !s.isDeleted).map(s => ({
              'الاسم الرباعي': cleanName(s.firstName),
              'العائلة': s.lastName || '',
              'رقم القيد': s.regNumber,
              'رقم الصفحة': s.pageNumber,
              'الحالة الدراسية': statusMap[s.status || 'active'] || 'مستمر',
              'ملاحظات': s.notes || '',
              'تاريخ التسجيل': formatDate(s.createdAt)
            }));
            
            const worksheet = XLSX.utils.json_to_sheet(data);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "الطلاب");
            XLSX.writeFile(workbook, "سجل_القيود_العام.xlsx");
          };

          // Import from Excel
          const handleImport = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            setImporting(true);
            setImportProgress(0);
            
            const reader = new FileReader();
            reader.onload = async (e) => {
              try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(firstSheet);
                
                let count = 0;
                const batch = db.batch();
                
                rows.forEach((row, index) => {
                  const fName = row['الاسم الرباعي'] || row['الاسم الكامل'] || row['firstName'];
                  const reg = row['رقم القيد'] || row['regNumber'];
                  const page = row['رقم الصفحة'] || row['pageNumber'];
                  
                  if (fName && reg) {
                    const docRef = studentsCollection.doc();
                    batch.set(docRef, {
                      firstName: String(fName).trim(),
                      lastName: row['العائلة'] || '',
                      regNumber: String(reg).trim(),
                      pageNumber: String(page || '').trim(),
                      status: 'active',
                      isDeleted: false,
                      notes: row['ملاحظات'] || '',
                      createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    count++;
                  }
                  setImportProgress(Math.round((index / rows.length) * 100));
                });
                
                await batch.commit();
                setAlertConfig({ 
                  message: `تم استيراد ${count} سجل بنجاح`, 
                  type: 'success' 
                });
                
              } catch (err) {
                console.error(err);
                setAlertConfig({ 
                  message: "فشل الاستيراد", 
                  type: 'error' 
                });
              } finally {
                setImporting(false);
              }
            };
            
            reader.readAsArrayBuffer(file);
          };

          // Delete all data
          const deleteAllData = async () => {
            setConfirmConfig(null);
            try {
              const snapshot = await studentsCollection.get();
              const batch = db.batch();
              snapshot.docs.forEach((doc) => {
                batch.delete(doc.ref);
              });
              await batch.commit();
              setAlertConfig({ 
                message: 'تم حذف جميع البيانات', 
                type: 'success' 
              });
            } catch (err) {
              setAlertConfig({ 
                message: 'فشل حذف البيانات', 
                type: 'error' 
              });
            }
          };

          // Add new student
          const addStudent = async (data) => {
            try {
              await studentsCollection.add({
                ...data,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                isDeleted: false
              });
              setAlertConfig({ 
                message: 'تم إضافة الطالب بنجاح', 
                type: 'success' 
              });
            } catch (err) {
              setAlertConfig({ 
                message: 'فشل إضافة الطالب', 
                type: 'error' 
              });
            }
          };

          // Update student
          const updateStudent = async (id, data) => {
            try {
              await studentsCollection.doc(id).update(data);
              setAlertConfig({ 
                message: 'تم تحديث البيانات بنجاح', 
                type: 'success' 
              });
            } catch (err) {
              setAlertConfig({ 
                message: 'فشل تحديث البيانات', 
                type: 'error' 
              });
            }
          };

          // Soft delete
          const softDeleteStudent = async (id) => {
            try {
              await studentsCollection.doc(id).update({ isDeleted: true });
              setAlertConfig({ 
                message: 'تم نقل الطالب إلى سلة المحذوفات', 
                type: 'success' 
              });
            } catch (err) {
              setAlertConfig({ 
                message: 'فشل حذف الطالب', 
                type: 'error' 
              });
            }
          };

          // Restore student
          const restoreStudent = async (id) => {
            try {
              await studentsCollection.doc(id).update({ isDeleted: false });
              setAlertConfig({ 
                message: 'تم استعادة الطالب', 
                type: 'success' 
              });
            } catch (err) {
              setAlertConfig({ 
                message: 'فشل استعادة الطالب', 
                type: 'error' 
              });
            }
          };

          // Permanently delete
          const permanentlyDeleteStudent = async (id) => {
            try {
              await studentsCollection.doc(id).delete();
              setAlertConfig({ 
                message: 'تم حذف الطالب نهائياً', 
                type: 'success' 
              });
            } catch (err) {
              setAlertConfig({ 
                message: 'فشل حذف الطالب', 
                type: 'error' 
              });
            }
          };

          if (loading) {
            return (
              <div className="min-h-screen flex items-center justify-center">
                <div className="text-center">
                  <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
                  <p className="text-slate-600">جاري تحميل النظام...</p>
                </div>
              </div>
            );
          }

          if (!user) {
            return <Login />;
          }

          // Alert Modal
          const AlertModal = ({ message, type, onClose }) => (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-6 max-w-sm w-full">
                <div className={`w-16 h-16 rounded-full mx-auto flex items-center justify-center mb-4 ${
                  type === 'error' ? 'bg-red-100' : 'bg-green-100'
                }`}>
                  {type === 'error' ? (
                    <span className="text-red-500 text-2xl">❌</span>
                  ) : (
                    <span className="text-green-500 text-2xl">✅</span>
                  )}
                </div>
                <p className="text-center font-bold mb-6">{message}</p>
                <button
                  onClick={onClose}
                  className="w-full py-2 bg-slate-900 text-white rounded-xl font-bold"
                >
                  حسناً
                </button>
              </div>
            </div>
          );

          // Confirm Modal
          const ConfirmModal = ({ title, message, onConfirm, onCancel, isDestructive }) => (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-6 max-w-sm w-full">
                <h3 className="text-xl font-bold text-center mb-2">{title}</h3>
                <p className="text-center text-slate-500 mb-6">{message}</p>
                <div className="flex gap-3">
                  <button
                    onClick={onCancel}
                    className="flex-1 py-2 bg-slate-100 rounded-xl font-bold"
                  >
                    إلغاء
                  </button>
                  <button
                    onClick={onConfirm}
                    className={`flex-1 py-2 text-white rounded-xl font-bold ${
                      isDestructive ? 'bg-red-500' : 'bg-blue-600'
                    }`}
                  >
                    تأكيد
                  </button>
                </div>
              </div>
            </div>
          );

          // Print Modal
          const PrintModal = () => (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-6 max-w-sm w-full">
                <h3 className="text-xl font-bold text-center mb-4">خيارات الطباعة</h3>
                
                <button
                  onClick={() => {
                    setPrintMode('list');
                    setPrintRegInput('');
                    setShowPrintModal(false);
                    setTimeout(() => window.print(), 500);
                  }}
                  className="w-full py-3 bg-blue-600 text-white rounded-xl font-bold mb-3"
                >
                  طباعة السجل الحالي
                </button>
                
                <p className="text-center text-slate-400 text-sm mb-2">أو</p>
                
                <select
                  value={printRegInput}
                  onChange={(e) => setPrintRegInput(e.target.value)}
                  className="w-full p-3 border rounded-xl mb-3"
                >
                  <option value="">اختر رقم القيد...</option>
                  {[...new Set(students.filter(s => !s.isDeleted).map(s => s.regNumber))].sort().map(r => (
                    <option key={r} value={r}>قيد رقم {r}</option>
                  ))}
                </select>
                
                <button
                  onClick={() => {
                    setPrintMode('list');
                    setSelectedRegFilter(printRegInput);
                    setShowPrintModal(false);
                    setTimeout(() => window.print(), 500);
                  }}
                  disabled={!printRegInput}
                  className={`w-full py-3 bg-emerald-600 text-white rounded-xl font-bold mb-3 ${
                    !printRegInput ? 'opacity-50 cursor-not-allowed' : ''
                  }`}
                >
                  طباعة القيد المحدد
                </button>
                
                <button
                  onClick={() => setShowPrintModal(false)}
                  className="w-full py-2 bg-slate-100 rounded-xl font-bold"
                >
                  إلغاء
                </button>
              </div>
            </div>
          );

          return (
            <div className={`min-h-screen ${isDarkMode ? 'dark' : ''}`}>
              <div className="bg-white dark:bg-slate-900 min-h-screen">
                {/* Header */}
                <header className="bg-white dark:bg-slate-800 border-b dark:border-slate-700 sticky top-0 z-10 shadow-sm">
                  <div className="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
                    <div className="flex items-center gap-2 font-bold text-slate-800 dark:text-white">
                      <span className="text-blue-600 text-xl">📋</span>
                      <span>سجل القيد العام</span>
                    </div>
                    
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => setIsDarkMode(!isDarkMode)}
                        className="p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg"
                      >
                        {isDarkMode ? '☀️' : '🌙'}
                      </button>
                      
                      <button
                        onClick={() => setView('settings')}
                        className="p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg"
                      >
                        ⚙️
                      </button>
                      
                      <button
                        onClick={() => {
                          if (confirm('هل أنت متأكد من تسجيل الخروج؟')) {
                            auth.signOut();
                          }
                        }}
                        className="p-2 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg"
                      >
                        🚪
                      </button>
                    </div>
                  </div>
                </header>

                {/* Main Content */}
                <main className="max-w-7xl mx-auto px-4 py-4">
                  {/* Stats Cards */}
                  <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-4">
                    <div className="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border dark:border-slate-700">
                      <div className="text-2xl font-bold text-slate-800 dark:text-white">{stats.total}</div>
                      <div className="text-xs text-slate-500 dark:text-slate-400">إجمالي الطلاب</div>
                    </div>
                    
                    <div className="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border dark:border-slate-700">
                      <div className="text-2xl font-bold text-emerald-600">{stats.active}</div>
                      <div className="text-xs text-slate-500 dark:text-slate-400">مستمر</div>
                    </div>
                    
                    <div className="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border dark:border-slate-700">
                      <div className="text-2xl font-bold text-amber-600">{stats.transferred}</div>
                      <div className="text-xs text-slate-500 dark:text-slate-400">منقول</div>
                    </div>
                    
                    <div className="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border dark:border-slate-700">
                      <div className="text-2xl font-bold text-rose-600">{stats.left}</div>
                      <div className="text-xs text-slate-500 dark:text-slate-400">تارك</div>
                    </div>
                    
                    <div className="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border dark:border-slate-700">
                      <div className="text-2xl font-bold text-blue-600">{stats.graduated}</div>
                      <div className="text-xs text-slate-500 dark:text-slate-400">متخرج</div>
                    </div>
                  </div>

                  {/* Search and Filters */}
                  <div className="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border dark:border-slate-700 mb-4">
                    <div className="relative mb-3">
                      <input
                        type="text"
                        placeholder="🔍 بحث عن طالب..."
                        value={search}
                        onChange={(e) => setSearch(e.target.value)}
                        className="w-full p-3 pr-10 border dark:border-slate-600 rounded-xl dark:bg-slate-700 dark:text-white"
                      />
                      {search && (
                        <button
                          onClick={() => setSearch('')}
                          className="absolute left-3 top-3 text-slate-400 hover:text-slate-600"
                        >
                          ✕
                        </button>
                      )}
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-2">
                      <select
                        value={selectedRegFilter}
                        onChange={(e) => setSelectedRegFilter(e.target.value)}
                        className="p-2 border dark:border-slate-600 rounded-lg dark:bg-slate-700 dark:text-white"
                      >
                        <option value="">جميع القيود</option>
                        {[...new Set(students.filter(s => !s.isDeleted).map(s => s.regNumber))].sort().map(r => (
                          <option key={r} value={r}>قيد {r}</option>
                        ))}
                      </select>
                      
                      <select
                        value={statusFilter}
                        onChange={(e) => setStatusFilter(e.target.value)}
                        className="p-2 border dark:border-slate-600 rounded-lg dark:bg-slate-700 dark:text-white"
                      >
                        <option value="ALL">جميع الحالات</option>
                        <option value="active">مستمر</option>
                        <option value="transferred">منقول</option>
                        <option value="left">تارك</option>
                        <option value="graduated">متخرج</option>
                      </select>
                      
                      <select
                        value={sortBy}
                        onChange={(e) => setSortBy(e.target.value)}
                        className="p-2 border dark:border-slate-600 rounded-lg dark:bg-slate-700 dark:text-white"
                      >
                        <option value="recent">الأحدث أولاً</option>
                        <option value="alphabetical">ترتيب أبجدي</option>
                      </select>
                      
                      <button
                        onClick={() => setView(view === 'trash' ? 'list' : 'trash')}
                        className={`p-2 rounded-lg font-bold text-sm ${
                          view === 'trash' 
                            ? 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400' 
                            : 'bg-slate-100 text-slate-700 dark:bg-slate-700 dark:text-slate-300'
                        }`}
                      >
                        {view === 'trash' ? '🗑️ سلة المحذوفات' : '🗑️ المحذوفات'}
                      </button>
                    </div>
                  </div>

                  {/* Action Buttons */}
                  <div className="flex gap-3 mb-4">
                    <button
                      onClick={() => {
                        setSelectedId(null);
                        setView('add');
                      }}
                      className="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2"
                    >
                      <span>➕</span> إضافة طالب جديد
                    </button>
                    
                    <button
                      onClick={() => setShowPrintModal(true)}
                      className="flex-1 bg-white dark:bg-slate-800 border dark:border-slate-700 py-3 rounded-xl font-bold flex items-center justify-center gap-2"
                    >
                      <span>🖨️</span> طباعة
                    </button>
                  </div>

                  {/* Students Table */}
                  <div className="bg-white dark:bg-slate-800 rounded-xl shadow-sm border dark:border-slate-700 overflow-hidden">
                    <div className="overflow-x-auto">
                      <table className="w-full">
                        <thead className="bg-slate-50 dark:bg-slate-700">
                          <tr>
                            <th className="p-3 text-right text-sm font-bold text-slate-500 dark:text-slate-300">#</th>
                            <th className="p-3 text-right text-sm font-bold text-slate-500 dark:text-slate-300">الاسم</th>
                            <th className="p-3 text-center text-sm font-bold text-slate-500 dark:text-slate-300">رقم القيد</th>
                            <th className="p-3 text-center text-sm font-bold text-slate-500 dark:text-slate-300">الصفحة</th>
                            <th className="p-3 text-center text-sm font-bold text-slate-500 dark:text-slate-300">الحالة</th>
                            <th className="p-3 text-center text-sm font-bold text-slate-500 dark:text-slate-300">الإجراءات</th>
                          </tr>
                        </thead>
                        <tbody>
                          {filteredStudents.map((student, index) => (
                            <tr key={student.id} className="border-t dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50">
                              <td className="p-3 text-slate-500">{index + 1}</td>
                              <td className="p-3">
                                <div className="font-bold dark:text-white">
                                  {cleanName(student.firstName)} {student.lastName || ''}
                                </div>
                                {student.notes && (
                                  <div className="text-xs text-slate-400 mt-1">{student.notes}</div>
                                )}
                              </td>
                              <td className="p-3 text-center">
                                <span className="bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 px-2 py-1 rounded text-sm font-mono">
                                  {student.regNumber}
                                </span>
                              </td>
                              <td className="p-3 text-center">
                                <span className="bg-amber-100 dark:bg-amber-900/30 text-amber-700 dark:text-amber-400 px-2 py-1 rounded text-sm font-mono">
                                  {student.pageNumber}
                                </span>
                              </td>
                              <td className="p-3 text-center">
                                <span className={`px-2 py-1 rounded-full text-xs font-bold ${
                                  student.status === 'active' ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400' :
                                  student.status === 'transferred' ? 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400' :
                                  student.status === 'left' ? 'bg-rose-100 text-rose-700 dark:bg-rose-900/30 dark:text-rose-400' :
                                  'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400'
                                }`}>
                                  {student.status === 'active' ? 'مستمر' :
                                   student.status === 'transferred' ? 'منقول' :
                                   student.status === 'left' ? 'تارك' : 'متخرج'}
                                </span>
                              </td>
                              <td className="p-3">
                                <div className="flex items-center justify-center gap-2">
                                  <button
                                    onClick={() => {
                                      setSelectedId(student.id);
                                      setView('edit');
                                    }}
                                    className="p-1 text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900/20 rounded"
                                    title="تعديل"
                                  >
                                    ✏️
                                  </button>
                                  
                                  {view === 'trash' ? (
                                    <>
                                      <button
                                        onClick={() => restoreStudent(student.id)}
                                        className="p-1 text-emerald-600 hover:bg-emerald-50 dark:hover:bg-emerald-900/20 rounded"
                                        title="استعادة"
                                      >
                                        ↩️
                                      </button>
                                      <button
                                        onClick={() => {
                                          if (confirm('هل أنت متأكد من الحذف النهائي؟')) {
                                            permanentlyDeleteStudent(student.id);
                                          }
                                        }}
                                        className="p-1 text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 rounded"
                                        title="حذف نهائي"
                                      >
                                        🗑️
                                      </button>
                                    </>
                                  ) : (
                                    <button
                                      onClick={() => {
                                        if (confirm('هل تريد نقل هذا الطالب إلى سلة المحذوفات؟')) {
                                          softDeleteStudent(student.id);
                                        }
                                      }}
                                      className="p-1 text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 rounded"
                                      title="حذف"
                                    >
                                      🗑️
                                    </button>
                                  )}
                                </div>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                    
                    {filteredStudents.length === 0 && (
                      <div className="p-12 text-center">
                        <div className="text-6xl mb-4">📭</div>
                        <p className="text-slate-400 font-bold">لا توجد بيانات</p>
                      </div>
                    )}
                  </div>
                </main>

                {/* Settings Modal */}
                {view === 'settings' && (
                  <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                    <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 max-w-md w-full">
                      <h3 className="text-xl font-bold mb-4 dark:text-white">الإعدادات</h3>
                      
                      <button
                        onClick={exportToExcel}
                        className="w-full py-3 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400 rounded-xl font-bold mb-2 flex items-center justify-center gap-2"
                      >
                        <span>📥</span> تصدير إلى Excel
                      </button>
                      
                      <label className="w-full py-3 bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 rounded-xl font-bold mb-2 flex items-center justify-center gap-2 cursor-pointer">
                        <span>📤</span> استيراد من Excel
                        <input
                          type="file"
                          accept=".xlsx"
                          onChange={handleImport}
                          className="hidden"
                        />
                      </label>
                      
                      <button
                        onClick={() => {
                          if (confirm('هل أنت متأكد من حذف جميع البيانات؟')) {
                            deleteAllData();
                            setView('list');
                          }
                        }}
                        className="w-full py-3 bg-red-50 dark:bg-red-900/30 text-red-700 dark:text-red-400 rounded-xl font-bold mb-4 flex items-center justify-center gap-2"
                      >
                        <span>⚠️</span> حذف جميع البيانات
                      </button>
                      
                      <button
                        onClick={() => setView('list')}
                        className="w-full py-2 bg-slate-100 dark:bg-slate-700 rounded-xl font-bold dark:text-white"
                      >
                        إغلاق
                      </button>
                    </div>
                  </div>
                )}

                {/* Add/Edit Modal */}
                {(view === 'add' || view === 'edit') && (
                  <AddEditModal
                    student={view === 'edit' ? students.find(s => s.id === selectedId) : null}
                    onSave={async (data) => {
                      if (view === 'add') {
                        await addStudent(data);
                      } else {
                        await updateStudent(selectedId, data);
                      }
                      setView('list');
                    }}
                    onClose={() => setView('list')}
                  />
                )}

                {/* Print Modal */}
                {showPrintModal && <PrintModal />}

                {/* Alerts */}
                {alertConfig && (
                  <AlertModal
                    message={alertConfig.message}
                    type={alertConfig.type}
                    onClose={() => setAlertConfig(null)}
                  />
                )}

                {/* Import Progress */}
                {importing && (
                  <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-[60]">
                    <div className="bg-white dark:bg-slate-800 rounded-2xl p-8 text-center">
                      <div className="animate-spin rounded-full h-16 w-16 border-4 border-blue-600 border-t-transparent mx-auto mb-4"></div>
                      <p className="text-lg font-bold mb-2 dark:text-white">جاري الاستيراد...</p>
                      <p className="text-slate-400 mb-4">{importProgress}%</p>
                      <div className="w-full bg-slate-200 rounded-full h-2">
                        <div
                          className="bg-blue-600 h-2 rounded-full transition-all duration-300"
                          style={{ width: `${importProgress}%` }}
                        ></div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        }

        // Add/Edit Modal Component
        function AddEditModal({ student, onSave, onClose }) {
          const [formData, setFormData] = React.useState({
            firstName: student?.firstName || '',
            lastName: student?.lastName || '',
            regNumber: student?.regNumber || '',
            pageNumber: student?.pageNumber || '',
            status: student?.status || 'active',
            notes: student?.notes || ''
          });

          const handleSubmit = (e) => {
            e.preventDefault();
            onSave(formData);
          };

          return (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 max-w-md w-full max-h-[90vh] overflow-y-auto">
                <h3 className="text-xl font-bold mb-4 dark:text-white">
                  {student ? 'تعديل بيانات الطالب' : 'إضافة طالب جديد'}
                </h3>
                
                <form onSubmit={handleSubmit} className="space-y-4">
                  <input
                    type="text"
                    placeholder="الاسم الرباعي *"
                    required
                    value={formData.firstName}
                    onChange={(e) => setFormData({...formData, firstName: e.target.value})}
                    className="w-full p-3 border dark:border-slate-600 rounded-xl dark:bg-slate-700 dark:text-white"
                  />
                  
                  <input
                    type="text"
                    placeholder="العائلة"
                    value={formData.lastName}
                    onChange={(e) => setFormData({...formData, lastName: e.target.value})}
                    className="w-full p-3 border dark:border-slate-600 rounded-xl dark:bg-slate-700 dark:text-white"
                  />
                  
                  <div className="grid grid-cols-2 gap-3">
                    <input
                      type="text"
                      placeholder="رقم القيد *"
                      required
                      value={formData.regNumber}
                      onChange={(e) => setFormData({...formData, regNumber: e.target.value})}
                      className="w-full p-3 border dark:border-slate-600 rounded-xl dark:bg-slate-700 dark:text-white"
                    />
                    
                    <input
                      type="text"
                      placeholder="رقم الصفحة *"
                      required
                      value={formData.pageNumber}
                      onChange={(e) => setFormData({...formData, pageNumber: e.target.value})}
                      className="w-full p-3 border dark:border-slate-600 rounded-xl dark:bg-slate-700 dark:text-white"
                    />
                  </div>
                  
                  <div>
                    <label className="block text-sm font-bold text-slate-500 mb-2">الحالة الدراسية</label>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                      {[
                        { value: 'active', label: 'مستمر', color: 'emerald' },
                        { value: 'transferred', label: 'منقول', color: 'amber' },
                        { value: 'left', label: 'تارك', color: 'rose' },
                        { value: 'graduated', label: 'متخرج', color: 'blue' }
                      ].map(option => (
                        <label key={option.value} className="cursor-pointer">
                          <input
                            type="radio"
                            name="status"
                            value={option.value}
                            checked={formData.status === option.value}
                            onChange={(e) => setFormData({...formData, status: e.target.value})}
                            className="peer hidden"
                          />
                          <div className={`py-2 px-1 border-2 rounded-xl text-center text-sm font-bold transition-all
                            peer-checked:bg-${option.color}-500 peer-checked:text-white peer-checked:border-${option.color}-500
                            border-slate-200 dark:border-slate-600 text-slate-500 dark:text-slate-400
                          `}>
                            {option.label}
                          </div>
                        </label>
                      ))}
                    </div>
                  </div>
                  
                  <textarea
                    placeholder="ملاحظات"
                    value={formData.notes}
                    onChange={(e) => setFormData({...formData, notes: e.target.value})}
                    className="w-full p-3 border dark:border-slate-600 rounded-xl dark:bg-slate-700 dark:text-white"
                    rows="3"
                  ></textarea>
                  
                  <div className="flex gap-3">
                    <button
                      type="submit"
                      className="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold"
                    >
                      حفظ
                    </button>
                    <button
                      type="button"
                      onClick={onClose}
                      className="flex-1 bg-slate-100 dark:bg-slate-700 py-3 rounded-xl font-bold dark:text-white"
                    >
                      إلغاء
                    </button>
                  </div>
                </form>
              </div>
            </div>
          );
        }

        // Login Component
        function Login() {
          const [email, setEmail] = React.useState('');
          const [password, setPassword] = React.useState('');
          const [error, setError] = React.useState('');
          const [loading, setLoading] = React.useState(false);

          const handleSubmit = async (e) => {
            e.preventDefault();
            setLoading(true);
            setError('');
            
            try {
              await auth.signInWithEmailAndPassword(email, password);
            } catch (err) {
              setError('البريد الإلكتروني أو كلمة المرور غير صحيحة');
            } finally {
              setLoading(false);
            }
          };

          return (
            <div className="min-h-screen bg-gradient-to-br from-blue-600 to-purple-600 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
                <div className="text-center mb-8">
                  <div className="w-20 h-20 bg-blue-600 rounded-2xl mx-auto mb-4 flex items-center justify-center transform -rotate-6">
                    <span className="text-white text-3xl">📋</span>
                  </div>
                  <h2 className="text-2xl font-bold text-slate-800">سجل القيد العام</h2>
                  <p className="text-slate-500 text-sm mt-1">نظام إدارة شؤون الطلاب</p>
                </div>
                
                <form onSubmit={handleSubmit} className="space-y-4">
                  <div>
                    <label className="block text-sm font-bold text-slate-500 mb-1">البريد الإلكتروني</label>
                    <input
                      type="email"
                      required
                      value={email}
                      onChange={(e) => setEmail(e.target.value)}
                      className="w-full p-3 border border-slate-200 rounded-xl outline-none focus:border-blue-500 transition-colors"
                      dir="ltr"
                    />
                  </div>
                  
                  <div>
                    <label className="block text-sm font-bold text-slate-500 mb-1">كلمة المرور</label>
                    <input
                      type="password"
                      required
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      className="w-full p-3 border border-slate-200 rounded-xl outline-none focus:border-blue-500 transition-colors"
                      dir="ltr"
                    />
                  </div>
                  
                  {error && (
                    <p className="text-red-500 text-sm text-center bg-red-50 p-2 rounded-lg">
                      {error}
                    </p>
                  )}
                  
                  <button
                    type="submit"
                    disabled={loading}
                    className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                  >
                    {loading ? 'جاري التحقق...' : 'دخول'}
                  </button>
                </form>
                
                <div className="mt-6 text-center text-sm text-slate-400">
                  <p>نظام موحد لإدارة سجلات الطلاب</p>
                </div>
              </div>
            </div>
          );
        }

        // Render app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
