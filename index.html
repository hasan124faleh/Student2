<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سجل قيود الطلاب</title>
    
    <!-- Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              cairo: ['Cairo', 'sans-serif'],
            },
            screens: {
              'xs': '480px',
            },
            colors: {
              danger: '#ef4444',
              success: '#10b981',
              warning: '#f59e0b',
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Cairo', sans-serif;
        background-color: #f8fafc;
        color: #1e293b;
        overflow-x: hidden;
      }
      /* Print Styles */
      @media print {
        @page { size: A4; margin: 0; }
        body { background-color: white; margin: 0; }
        .no-print { display: none !important; }
        .print-only { display: block !important; }
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .print-only { display: none; }
      
      /* Scrollbars */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background-color: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }

      /* Animations */
      @keyframes fade-in { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
      .animate-fade-in { animation: fade-in 0.2s ease-out; }
      @keyframes slide-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
      .animate-slide-up { animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
      
      .glass-effect {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
      }
    </style>

    <!-- React & Babel Support -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Import Map -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1?deps=react@18.2.0",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
        "xlsx": "https://cdn.sheetjs.com/xlsx-0.20.1/package/xlsx.mjs"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef } from 'react';
        import ReactDOM from 'react-dom/client';
        import { 
          Users, LogOut, Settings, Search, Plus, Printer, 
          Trash2, FileSpreadsheet, Download, Upload, AlertTriangle, ArrowRight, Save, X, FileText, CheckCircle2, XCircle, AlertCircle, ArrowUp, Filter, UserCheck, SortAsc, Type, ChevronDown, ListFilter, RotateCcw, Info
        } from 'lucide-react';
        import { initializeApp } from "firebase/app";
        import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, deleteDoc, writeBatch } from "firebase/firestore";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "firebase/auth";
        import * as XLSX from 'xlsx';

        // ==========================================
        // FIREBASE CONFIG
        // ==========================================
        const firebaseConfig = {
          apiKey: "AIzaSyC3Hyi-tVMui0ZyPsezvoxxSFjCJQBme9Q",
          authDomain: "ss-app-87ac7.firebaseapp.com",
          projectId: "ss-app-87ac7",
          storageBucket: "ss-app-87ac7.firebasestorage.app",
          messagingSenderId: "7671656513",
          appId: "1:7671656513:web:21b51edb450bddd1aad6c0",
          measurementId: "G-LQPLFRBGKH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const studentsCollection = collection(db, "students");

        // ==========================================
        // UTILS
        // ==========================================
        // Helper to remove numbers from end of string for display
        const cleanName = (name) => {
            if (!name) return "";
            return name.replace(/\s+\d+$/, '');
        };

        const exportToExcel = (students) => {
          const statusMap = { 'active': 'مستمر', 'transferred': 'منقول', 'left': 'تارك' };
          const data = students.map(s => ({
            'الاسم الأول': cleanName(s.firstName),
            'اللقب': s.lastName,
            'رقم القيد': s.regNumber,
            'رقم الصفحة': s.pageNumber,
            'الحالة': statusMap[s.status || 'active'] || 'مستمر',
            'الملاحظات': s.notes || '',
            'تاريخ الإضافة': new Date(s.createdAt).toLocaleDateString('ar-EG')
          }));
          const worksheet = XLSX.utils.json_to_sheet(data);
          const workbook = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(workbook, worksheet, "الطلاب");
          XLSX.writeFile(workbook, "سجل_الطلاب.xlsx");
        };

        const generateTemplate = () => {
          const firstNames = ['محمد', 'أحمد', 'عبدالله', 'علي', 'عمر', 'خالد', 'سعد', 'سعيد', 'صالح', 'فهد', 'سلمان'];
          const lastNames = ['الشمري', 'العتيبي', 'القحطاني', 'العنزي', 'الحربي', 'الزهراني'];
          const templateData = [];
          for (let i = 0; i < 1000; i++) {
            const n1 = firstNames[Math.floor(Math.random() * firstNames.length)];
            const ln = lastNames[Math.floor(Math.random() * lastNames.length)];
            const regNum = (i % 10) + 1;
            const pageNum = Math.floor(i / 10) + 1;
            templateData.push({
              'الاسم الأول': n1, // Removed ${i} to prevent numbers in names
              'اللقب': ln,
              'رقم القيد': regNum.toString(),
              'رقم الصفحة': pageNum.toString(),
              'الحالة': 'مستمر',
              'الملاحظات': ''
            });
          }
          const worksheet = XLSX.utils.json_to_sheet(templateData);
          const workbook = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(workbook, worksheet, "نموذج 1000 طالب");
          XLSX.writeFile(workbook, "نموذج_سجل_الطلاب.xlsx");
        };

        const readExcel = (file) => {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
              try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheetName]);
                resolve(jsonData);
              } catch (err) { reject(err); }
            };
            reader.onerror = (error) => reject(error);
            reader.readAsArrayBuffer(file);
          });
        };

        // ==========================================
        // UI COMPONENTS
        // ==========================================
        const Modal = ({ children, onClose }) => (
          <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in overflow-y-auto" onClick={onClose}>
            <div className="w-full max-w-lg relative transform transition-all scale-100" onClick={e => e.stopPropagation()}>
               {children}
            </div>
          </div>
        );

        // Custom Alert Component
        const AlertModal = ({ message, type, onClose }) => {
            const isError = type === 'error';
            return (
                <Modal onClose={onClose}>
                    <div className="bg-white rounded-2xl p-6 text-center shadow-2xl animate-slide-up border border-slate-100">
                        <div className={`w-16 h-16 rounded-full mx-auto flex items-center justify-center mb-4 ${isError ? 'bg-red-100 text-red-500' : 'bg-green-100 text-green-500'}`}>
                            {isError ? <AlertCircle size={32} /> : <CheckCircle2 size={32} />}
                        </div>
                        <h3 className="text-xl font-bold text-slate-800 mb-2">{isError ? 'تنبيه' : 'نجاح'}</h3>
                        <p className="text-slate-500 mb-6 font-medium whitespace-pre-line">{message}</p>
                        <button onClick={onClose} className={`w-full py-3 rounded-xl font-bold text-white shadow-lg transition-transform active:scale-95 ${isError ? 'bg-red-500 hover:bg-red-600 shadow-red-500/20' : 'bg-slate-900 hover:bg-slate-800 shadow-slate-900/20'}`}>
                            حسناً
                        </button>
                    </div>
                </Modal>
            );
        };

        // Custom Confirm Component
        const ConfirmModal = ({ title, message, onConfirm, onCancel, confirmText = "نعم", cancelText = "إلغاء", isDestructive = false }) => {
            return (
                <Modal onClose={onCancel}>
                    <div className="bg-white rounded-2xl p-6 text-center shadow-2xl animate-slide-up border border-slate-100">
                        <div className={`w-16 h-16 rounded-full mx-auto flex items-center justify-center mb-4 ${isDestructive ? 'bg-red-100 text-red-500' : 'bg-blue-100 text-blue-500'}`}>
                            {isDestructive ? <Trash2 size={32} /> : <Info size={32} />}
                        </div>
                        <h3 className="text-xl font-bold text-slate-800 mb-2">{title}</h3>
                        <p className="text-slate-500 mb-8 font-medium">{message}</p>
                        <div className="flex gap-3">
                            <button onClick={onCancel} className="flex-1 py-3 bg-slate-100 text-slate-600 rounded-xl font-bold hover:bg-slate-200 transition-colors">
                                {cancelText}
                            </button>
                            <button onClick={onConfirm} className={`flex-1 py-3 text-white rounded-xl font-bold shadow-lg transition-transform active:scale-95 ${isDestructive ? 'bg-red-500 hover:bg-red-600 shadow-red-500/20' : 'bg-blue-600 hover:bg-blue-700 shadow-blue-500/20'}`}>
                                {confirmText}
                            </button>
                        </div>
                    </div>
                </Modal>
            );
        };

        const StatCard = ({ title, value, icon, colorClass }) => (
          <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex flex-col items-center justify-center text-center gap-2 hover:shadow-md transition-all duration-300 transform hover:-translate-y-1">
            <div className={`p-3 rounded-2xl ${colorClass} text-white shadow-lg shadow-black/5 ring-4 ring-white`}>{icon}</div>
            <div>
              <div className="text-2xl font-black text-slate-800 font-mono leading-none tracking-tight">{value}</div>
              <div className="text-xs text-slate-500 font-bold mt-1">{title}</div>
            </div>
          </div>
        );

        const StatusBadge = ({ status }) => {
           if (status === 'transferred') return <span className="inline-flex items-center gap-1.5 bg-amber-50 text-amber-600 px-2.5 py-1 rounded-lg text-xs font-bold border border-amber-100"><ArrowRight size={12}/> منقول</span>;
           if (status === 'left') return <span className="inline-flex items-center gap-1.5 bg-rose-50 text-rose-600 px-2.5 py-1 rounded-lg text-xs font-bold border border-rose-100"><XCircle size={12}/> تارك</span>;
           return <span className="inline-flex items-center gap-1.5 bg-emerald-50 text-emerald-600 px-2.5 py-1 rounded-lg text-xs font-bold border border-emerald-100"><CheckCircle2 size={12}/> مستمر</span>;
        };

        const SingleStudentPrint = ({ student }) => {
          const statusLabels = { 'active': 'مستمر', 'transferred': 'منقول', 'left': 'تارك' };
          return (
            <div className="hidden print:flex flex-col items-center justify-center w-full h-screen bg-white p-8">
              <div className="w-full max-w-[21cm] border-[3px] border-double border-slate-800 p-8 rounded-xl relative overflow-hidden">
                <div className="absolute top-0 right-0 w-24 h-24 bg-slate-100 -translate-y-1/2 translate-x-1/2 rounded-full opacity-50"></div>
                <div className="text-center border-b-2 border-slate-200 pb-6 mb-8 relative z-10">
                  <h1 className="text-3xl font-bold text-slate-900 mb-2">بطاقة معلومات الطالب</h1>
                  <p className="text-slate-500 font-medium">نظام سجلات الطلاب العام</p>
                </div>
                <div className="grid grid-cols-12 gap-6 relative z-10">
                  <div className="col-span-12 md:col-span-8 space-y-6">
                     <div className="flex flex-col">
                        <span className="text-sm font-bold text-slate-400 mb-1">الاسم الكامل</span>
                        <div className="text-2xl font-bold text-slate-900 border-b border-dashed border-slate-300 pb-1">
                           {cleanName(student.firstName)} {student.lastName ? ` / ${student.lastName}` : ''}
                        </div>
                     </div>
                     <div className="grid grid-cols-2 gap-6">
                        <div className="flex flex-col">
                          <span className="text-sm font-bold text-slate-400 mb-1">حالة الطالب</span>
                          <div className="text-lg font-semibold text-slate-800">{statusLabels[student.status || 'active']}</div>
                        </div>
                        <div className="flex flex-col">
                          <span className="text-sm font-bold text-slate-400 mb-1">تاريخ التسجيل</span>
                          <div className="text-lg font-semibold text-slate-800">{new Date(student.createdAt).toLocaleDateString('ar-EG')}</div>
                        </div>
                     </div>
                  </div>
                  <div className="col-span-12 md:col-span-4 flex flex-col gap-4">
                     <div className="bg-slate-50 border border-slate-200 rounded-lg p-4 text-center">
                        <span className="text-xs font-bold text-slate-500 uppercase">رقم القيد</span>
                        <div className="text-4xl font-mono font-bold text-slate-900 mt-1">{student.regNumber}</div>
                     </div>
                     <div className="bg-slate-50 border border-slate-200 rounded-lg p-4 text-center">
                        <span className="text-xs font-bold text-slate-500 uppercase">رقم الصفحة</span>
                        <div className="text-4xl font-mono font-bold text-slate-900 mt-1">{student.pageNumber}</div>
                     </div>
                  </div>
                </div>
              </div>
            </div>
          );
        };

        const PrintView = ({ students, title }) => {
          const sortedStudents = [...students].sort((a, b) => a.firstName.localeCompare(b.firstName));
          const ROWS_PER_COLUMN = 30;
          const COLUMNS_PER_PAGE = 2;
          const ITEMS_PER_PAGE = ROWS_PER_COLUMN * COLUMNS_PER_PAGE;
          
          const pages = [];
          for (let i = 0; i < sortedStudents.length; i += ITEMS_PER_PAGE) {
            pages.push(sortedStudents.slice(i, i + ITEMS_PER_PAGE));
          }
          
          return (
            <div className="print-only text-[9pt] dir-rtl">
              {pages.map((pageStudents, pageIndex) => (
                <div key={pageIndex} className="flex flex-col w-full h-[297mm] box-border p-[1cm] break-after-page relative">
                   <div className="w-full text-center border-b-2 border-black pb-2 mb-4">
                      <h1 className="text-xl font-bold">{title || "فهرس القيد العام"}</h1>
                   </div>
                   <div className="flex flex-row gap-[1cm] h-full">
                     {[0, 1].map((colIndex) => {
                       const colStart = colIndex * ROWS_PER_COLUMN;
                       const colStudents = pageStudents.slice(colStart, colStart + ROWS_PER_COLUMN);
                       return (
                         <div key={colIndex} className="flex-1 flex flex-col h-full border border-black/10">
                           {colStudents.length > 0 && (
                             <table className="w-full border-collapse border border-black table-fixed h-full">
                               <thead>
                                 <tr className="bg-gray-100 h-[30px]">
                                   <th className="border border-black p-1 text-center w-[30px] text-[8pt]">ت</th>
                                   <th className="border border-black p-1 text-right">الاسم الكامل</th>
                                   <th className="border border-black p-1 text-center w-[35px] font-bold text-[8pt]">ق</th>
                                   <th className="border border-black p-1 text-center w-[35px] font-bold text-[8pt]">ص</th>
                                 </tr>
                               </thead>
                               <tbody>
                                 {colStudents.map((s, idx) => {
                                   const globalIndex = (pageIndex * ITEMS_PER_PAGE) + colStart + idx + 1;
                                   return (
                                     <tr key={s.id} className="h-[28px]">
                                       <td className="border border-black px-1 text-center font-medium">{globalIndex}</td>
                                       <td className="border border-black px-2 align-middle whitespace-nowrap overflow-hidden leading-relaxed font-bold">
                                         {cleanName(s.firstName)} {s.lastName ? ` / ${s.lastName}` : ''}
                                       </td>
                                       <td className="border border-black px-1 text-center font-bold font-mono text-[10pt] align-middle dir-ltr">{s.regNumber}</td>
                                       <td className="border border-black px-1 text-center font-bold font-mono text-[10pt] align-middle">{s.pageNumber}</td>
                                     </tr>
                                   );
                                 })}
                               </tbody>
                             </table>
                           )}
                         </div>
                       );
                     })}
                   </div>
                </div>
              ))}
            </div>
          );
        };

        const Login = () => {
          const [email, setEmail] = useState('');
          const [password, setPassword] = useState('');
          const [error, setError] = useState('');
          const [loading, setLoading] = useState(false);

          const handleSubmit = async (e) => {
            e.preventDefault();
            setLoading(true);
            setError('');
            try { await signInWithEmailAndPassword(auth, email, password); } 
            catch (err) { setError('بيانات الدخول غير صحيحة'); } 
            finally { setLoading(false); }
          };

          return (
            <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4" dir="rtl">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 animate-fade-in">
                <div className="text-center mb-8">
                  <div className="w-16 h-16 bg-blue-600 rounded-2xl mx-auto mb-4 flex items-center justify-center shadow-lg">
                     <Users className="w-8 h-8 text-white" />
                  </div>
                  <h2 className="text-2xl font-bold text-slate-800">تسجيل الدخول</h2>
                </div>
                <form onSubmit={handleSubmit} className="space-y-4">
                  <div>
                    <label className="block text-sm font-semibold text-slate-700 mb-1">البريد الإلكتروني</label>
                    <input type="email" required className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-blue-500 outline-none text-left bg-slate-50" dir="ltr" value={email} onChange={(e) => setEmail(e.target.value)} />
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-slate-700 mb-1">كلمة المرور</label>
                    <input type="password" required className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-blue-500 outline-none text-left bg-slate-50" dir="ltr" value={password} onChange={(e) => setPassword(e.target.value)} />
                  </div>
                  {error && <div className="text-red-600 text-sm text-center">{error}</div>}
                  <button type="submit" disabled={loading} className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-slate-900/20">
                    {loading ? 'جاري التحقق...' : 'دخول'}
                  </button>
                </form>
              </div>
            </div>
          );
        };

        // ==========================================
        // MAIN APP
        // ==========================================
        const App = () => {
          const [user, setUser] = useState(null);
          const [loading, setLoading] = useState(true);
          const [students, setStudents] = useState([]);
          const [view, setView] = useState('list'); // list, trash, settings, add, edit, detail
          const [selectedId, setSelectedId] = useState(null);
          
          const [search, setSearch] = useState('');
          const [debouncedQuery, setDebouncedQuery] = useState(''); 
          const [selectedRegFilter, setSelectedRegFilter] = useState(''); 
          const [statusFilter, setStatusFilter] = useState('ALL');
          const [sortBy, setSortBy] = useState('recent');
          const [letterFilter, setLetterFilter] = useState('ALL');
          
          const [showPrintModal, setShowPrintModal] = useState(false);
          const [printRegInput, setPrintRegInput] = useState('');
          const [visibleCount, setVisibleCount] = useState(50);
          const loadMoreRef = useRef(null);
          const [importing, setImporting] = useState(false);
          const [nameWarning, setNameWarning] = useState('');
          const [printMode, setPrintMode] = useState('list');

          // Alert & Confirm States
          const [alertConfig, setAlertConfig] = useState(null);
          const [confirmConfig, setConfirmConfig] = useState(null);

          const showAlert = (message, type = 'success') => {
             setAlertConfig({ message, type });
          };

          const showConfirm = (title, message, onConfirm, isDestructive = false) => {
             setConfirmConfig({ title, message, onConfirm, isDestructive });
          };

          const uniqueRegNumbers = useMemo(() => {
             const regs = new Set(students.filter(s => !s.isDeleted).map(s => s.regNumber));
             return Array.from(regs).sort((a, b) => Number(a) - Number(b));
          }, [students]);

          const stats = useMemo(() => {
            const activeStudents = students.filter(s => !s.isDeleted);
            return {
                total: activeStudents.length,
                active: activeStudents.filter(s => (s.status || 'active') === 'active').length,
                regs: uniqueRegNumbers.length,
                others: activeStudents.filter(s => (s.status || 'active') !== 'active').length,
                deleted: students.filter(s => s.isDeleted).length
            };
          }, [students, uniqueRegNumbers]);

          useEffect(() => {
            const cached = localStorage.getItem('students_cache');
            if (cached) {
               try {
                   const parsed = JSON.parse(cached);
                   if (Array.isArray(parsed) && parsed.length > 0) {
                       setStudents(parsed);
                       setLoading(false);
                   }
               } catch(e) { console.error(e); }
            }

            const unsub = onAuthStateChanged(auth, (u) => {
              setUser(u);
              if (u) fetchStudents();
              else setLoading(false);
            });
            return () => unsub();
          }, []);

          useEffect(() => {
            const timer = setTimeout(() => setDebouncedQuery(search), 300);
            return () => clearTimeout(timer);
          }, [search]);

          useEffect(() => {
            setVisibleCount(50);
            window.scrollTo(0, 0);
          }, [debouncedQuery, selectedRegFilter, statusFilter, sortBy, letterFilter, view]);

          // Infinite Scroll Observer
          useEffect(() => {
            const observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting) {
                    setVisibleCount((prev) => prev + 50);
                }
            }, { threshold: 0.1 });
            
            if (loadMoreRef.current) {
                observer.observe(loadMoreRef.current);
            }
            return () => observer.disconnect();
          }, [students.length, filtered?.length]);

          const fetchStudents = async () => {
            try {
              const snap = await getDocs(studentsCollection);
              const data = [];
              snap.forEach(d => {
                 const raw = d.data();
                 data.push({
                    id: d.id, 
                    status: raw.status || 'active', 
                    firstName: String(raw.firstName || ''),
                    lastName: String(raw.lastName || ''),
                    regNumber: String(raw.regNumber || ''),
                    pageNumber: String(raw.pageNumber || ''),
                    notes: String(raw.notes || ''),
                    createdAt: typeof raw.createdAt === 'number' ? raw.createdAt : (raw.createdAt?.toMillis ? raw.createdAt.toMillis() : Date.now()),
                    isDeleted: raw.isDeleted || false
                 });
              });
              data.sort((a,b) => b.createdAt - a.createdAt);
              setStudents(data);
              localStorage.setItem('students_cache', JSON.stringify(data));
            } catch (e) { console.error(e); }
            finally { setLoading(false); }
          };

          const handleImport = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            setImporting(true);
            try {
              const rows = await readExcel(file);
              const batch = writeBatch(db);
              let count = 0;
              rows.forEach(row => {
                 const fName = row['firstName'] || row['الاسم الأول'];
                 const reg = row['regNumber'] || row['رقم القيد'];
                 const page = row['pageNumber'] || row['رقم الصفحة'];
                 const st = row['status'] || row['الحالة'] || 'active';
                 let statusKey = 'active';
                 if (st === 'منقول' || st === 'transferred') statusKey = 'transferred';
                 if (st === 'تارك' || st === 'left') statusKey = 'left';

                 if (fName && reg) {
                    const newItem = {
                       firstName: String(fName).trim(),
                       lastName: String(row['lastName'] || row['اللقب'] || '').trim(),
                       regNumber: String(reg).trim(),
                       pageNumber: String(page || '').trim(),
                       notes: String(row['notes'] || row['الملاحظات'] || ''),
                       status: statusKey,
                       isDeleted: false,
                       createdAt: Date.now() + count
                    };
                    const ref = doc(studentsCollection);
                    batch.set(ref, newItem);
                    count++;
                 }
              });
              await batch.commit();
              fetchStudents();
              showAlert(`تم استيراد ${count} سجل بنجاح`, 'success');
            } catch (e) { showAlert("فشل الاستيراد، تأكد من صحة الملف", 'error'); }
            setImporting(false);
          };

          const handleSoftDelete = async (id) => {
             try {
               await updateDoc(doc(db, "students", id), { isDeleted: true });
               setStudents(prev => prev.map(s => s.id === id ? { ...s, isDeleted: true } : s));
               if (view === 'detail') setView('list');
               showAlert("تم نقل الطالب إلى سلة المهملات", 'success');
             } catch (e) { showAlert("خطأ في الحذف", 'error'); }
          };

          const handleRestore = async (id) => {
             try {
               await updateDoc(doc(db, "students", id), { isDeleted: false });
               setStudents(prev => prev.map(s => s.id === id ? { ...s, isDeleted: false } : s));
               showAlert("تم استعادة سجل الطالب", 'success');
             } catch (e) { showAlert("خطأ في الاستعادة", 'error'); }
          };

          const handlePermanentDelete = async (id) => {
             showConfirm(
                "حذف نهائي", 
                "هل أنت متأكد من حذف هذا السجل نهائياً؟ لا يمكن التراجع عن هذا الإجراء.",
                async () => {
                   setConfirmConfig(null);
                   try {
                     await deleteDoc(doc(db, "students", id));
                     setStudents(prev => prev.filter(s => s.id !== id));
                     showAlert("تم الحذف نهائياً", 'success');
                   } catch(e) { showAlert("خطأ في الحذف النهائي", 'error'); }
                },
                true
             );
          };

          const executeDeleteAll = async () => {
             setConfirmConfig(null);
             setLoading(true);
             try {
               const allIds = students.map(s => s.id);
               // Process in chunks
               const CHUNK_SIZE = 400; 
               for (let i = 0; i < allIds.length; i += CHUNK_SIZE) {
                  const batch = writeBatch(db);
                  const chunk = allIds.slice(i, i + CHUNK_SIZE);
                  chunk.forEach(id => batch.delete(doc(db, "students", id)));
                  await batch.commit();
               }
               setStudents([]);
               localStorage.removeItem('students_cache');
               showAlert("تم تصفية قاعدة البيانات بنجاح", 'success');
               setView('list');
             } catch (e) { showAlert("حدث خطأ أثناء الحذف", 'error'); } 
             finally { setLoading(false); }
          };

          const filtered = useMemo(() => {
            let res = students;
            
            // View Filter (Trash vs List)
            if (view === 'trash') {
                res = res.filter(s => s.isDeleted);
            } else {
                res = res.filter(s => !s.isDeleted);
            }

            // Normal Filters
            if (selectedRegFilter) res = res.filter(s => s.regNumber === selectedRegFilter);
            if (letterFilter !== 'ALL') res = res.filter(s => s.firstName.startsWith(letterFilter));
            if (statusFilter !== 'ALL') res = res.filter(s => (s.status || 'active') === statusFilter);
            
            // Search
            if (debouncedQuery) {
               const q = debouncedQuery.toLowerCase();
               res = res.filter(s => s.firstName.toLowerCase().includes(q) || (s.lastName && s.lastName.toLowerCase().includes(q)));
            }
            
            // Sort Logic
            if (sortBy === 'alphabetical') {
               res.sort((a,b) => a.firstName.localeCompare(b.firstName));
            } else {
               res.sort((a,b) => b.createdAt - a.createdAt);
            }
            return res;
          }, [students, debouncedQuery, selectedRegFilter, statusFilter, sortBy, letterFilter, view]);

          const displayed = useMemo(() => filtered.slice(0, visibleCount), [filtered, visibleCount]);
          const arabicLetters = ['أ', 'ا', 'ب', 'ت', 'ث', 'ج', 'ح', 'خ', 'د', 'ذ', 'ر', 'ز', 'س', 'ش', 'ص', 'ض', 'ط', 'ظ', 'ع', 'غ', 'ف', 'ق', 'ك', 'ل', 'م', 'ن', 'هـ', 'و', 'ي'];

          const handlePrint = (reg) => {
             if (reg) setSelectedRegFilter(reg);
             setPrintMode('list');
             setShowPrintModal(false);
             setTimeout(() => window.print(), 500);
          };

          const handleSinglePrint = (s) => {
             setSelectedId(s.id); 
             setPrintMode('single');
             setTimeout(() => window.print(), 500);
          };
          
          const checkDuplicate = (val) => {
            if (!val || val.length < 3) {
              setNameWarning('');
              return;
            }
            const matches = students.filter(s => 
              s.firstName.includes(val) && s.id !== selectedId && !s.isDeleted
            );
            if (matches.length > 0) {
              const details = matches.slice(0, 3).map(m => `• ${cleanName(m.firstName)} (قيد: ${m.regNumber} - صفحة: ${m.pageNumber})`).join('\n');
              setNameWarning(`انتبه! الاسم قد يكون مكرراً:\n${details}`);
            } else {
              setNameWarning('');
            }
          };

          const handleNumericInput = (e) => {
             e.currentTarget.value = e.currentTarget.value.replace(/[^0-9]/g, '');

          if (loading && students.length === 0) return <div className="h-screen flex items-center justify-center font-bold text-slate-400">جاري تحميل السجلات...</div>;
          if (!user) return <Login />;

          return (
            <>
              <div className="min-h-screen no-print pb-20">
                <header className="bg-white border-b sticky top-0 z-40 shadow-sm backdrop-blur-md bg-white/80">
                  <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                    <div className="flex items-center gap-2 font-bold text-lg text-slate-800 cursor-pointer hover:opacity-80 transition-opacity" onClick={() => setView('list')}>
                      <div className="bg-slate-900 text-white p-2 rounded-xl shadow-lg shadow-slate-900/10"><Users size={20} /></div>
                      <span className="hidden xs:inline">سجل القيود</span>
                    </div>
                    <div className="flex items-center gap-2">
                       {/* Trash Button */}
                       <button onClick={() => setView('trash')} className={`relative p-2.5 rounded-full transition-colors ${view === 'trash' ? 'bg-red-50 text-red-600' : 'text-slate-500 hover:bg-slate-100'}`}>
                          <Trash2 size={22} />
                          {stats.deleted > 0 && <span className="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white"></span>}
                       </button>

                      <button onClick={() => setView('settings')} className="p-2.5 text-slate-500 hover:bg-slate-100 rounded-full transition-colors"><Settings size={22} /></button>
                      <button onClick={() => showConfirm("تسجيل خروج", "هل أنت متأكد من تسجيل الخروج؟", () => signOut(auth))} className="p-2.5 text-red-500 hover:bg-red-50 rounded-full transition-colors"><LogOut size={22} /></button>
                    </div>
                  </div>
                </header>

                <main className="max-w-7xl mx-auto px-4 py-6">
                    {view === 'trash' && (
                        <div className="mb-6 flex items-center justify-between bg-red-50 p-4 rounded-2xl border border-red-100 animate-fade-in">
                            <div className="flex items-center gap-3 text-red-700 font-bold">
                                <Trash2 size={24} />
                                <h2 className="text-xl">سلة المهملات</h2>
                            </div>
                            <button onClick={() => setView('list')} className="bg-white text-slate-700 px-4 py-2 rounded-xl text-sm font-bold shadow-sm hover:bg-slate-50">عودة للسجلات</button>
                        </div>
                    )}

                    <div className="animate-fade-in space-y-6">
                      {view !== 'trash' && (
                        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                            <StatCard title="إجمالي الطلاب" value={stats.total} icon={<Users size={20}/>} colorClass="bg-blue-600" />
                            <StatCard title="المستمرون" value={stats.active} icon={<UserCheck size={20}/>} colorClass="bg-emerald-600" />
                            <StatCard title="القيود" value={stats.regs} icon={<FileSpreadsheet size={20}/>} colorClass="bg-indigo-600" />
                            <StatCard title="تارك/منقول" value={stats.others} icon={<AlertTriangle size={20}/>} colorClass="bg-amber-500" />
                        </div>
                      )}

                      {/* Search Bar Layout */}
                      <div className="bg-white p-2 rounded-2xl border shadow-sm flex flex-col lg:flex-row gap-4">
                        <div className="flex-1 flex flex-col gap-2">

                            <div className="relative flex items-center bg-slate-50 rounded-xl border border-slate-100 focus-within:ring-2 focus-within:ring-blue-500 focus-within:border-transparent transition-all px-3 py-2">

                                <input className="flex-1 bg-transparent outline-none text-slate-700 h-8 font-bold text-sm" placeholder={view === 'trash' ? "بحث في المحذوفات..." : "ابحث باسم الطالب..."} value={search} onChange={(e) => setSearch(e.target.value)} />
                                {search && <button onClick={() => setSearch('')} className="p-1 bg-slate-200 rounded-full text-slate-500 hover:text-red-500 hover:bg-red-100 transition-colors"><X size={14}/></button>}
                            </div>

                            {/* Filters Row */}
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-2 items-center">
                                {/* Reg Filter */}
                                <div className="bg-slate-50 rounded-xl px-2 py-1.5 border border-slate-100 flex items-center gap-2">
                                    <Filter size={14} className="text-slate-400" />
                                    <select value={selectedRegFilter} onChange={(e) => setSelectedRegFilter(e.target.value)} className="bg-transparent w-full text-xs font-bold text-slate-700 outline-none cursor-pointer">
                                        <option value="">جميع القيود</option>
                                        {uniqueRegNumbers.map(r => <option key={r} value={r}>قيد {r}</option>)}
                                    </select>
                                </div>
                                {/* Status Filter */}
                                <div className="bg-slate-50 rounded-xl px-2 py-1.5 border border-slate-100 flex items-center gap-2">
                                    <ListFilter size={14} className="text-slate-400" />
                                    <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} className="bg-transparent w-full text-xs font-bold text-slate-700 outline-none cursor-pointer">
                                        <option value="ALL">كل الحالات</option>
                                        <option value="active">مستمر</option>
                                        <option value="transferred">منقول</option>
                                        <option value="left">تارك</option>
                                    </select>
                                </div>
                                {/* Sort Filter */}
                                <div className="bg-slate-50 rounded-xl px-2 py-1.5 border border-slate-100 flex items-center gap-2">
                                    <SortAsc size={14} className="text-slate-400" />
                                    <select value={sortBy} onChange={e => setSortBy(e.target.value)} className="bg-transparent w-full text-xs font-bold text-slate-700 outline-none cursor-pointer">
                                        <option value="recent">الأحدث</option>
                                        <option value="alphabetical">أبجدي</option>
                                    </select>
                                </div>
                                {/* Letter Filter */}
                                <div className="bg-slate-50 rounded-xl px-2 py-1.5 border border-slate-100 flex items-center gap-2">
                                    <Type size={14} className="text-slate-400" />
                                    <select value={letterFilter} onChange={e => setLetterFilter(e.target.value)} className="bg-transparent w-full text-xs font-bold text-slate-700 outline-none cursor-pointer">
                                        <option value="ALL">كل الحروف</option>
                                        {arabicLetters.map(l => <option key={l} value={l}>{l}</option>)}
                                    </select>
                                </div>
                            </div>
                        </div>

                        {/* Action Buttons */}
                        {view !== 'trash' && (
                            <div className="flex gap-2 w-full lg:w-auto border-t lg:border-t-0 pt-2 lg:pt-0">
                               <button onClick={() => { setSelectedId(null); setView('add'); setNameWarning(''); }} className="flex-1 lg:flex-none bg-slate-900 text-white px-5 py-2 rounded-xl text-sm font-bold flex items-center justify-center gap-2 shadow-lg shadow-slate-900/10 hover:bg-slate-800 transition-all transform hover:-translate-y-0.5"><Plus size={18} /> <span className="hidden xs:inline">إضافة</span></button>
                               <button onClick={() => setShowPrintModal(true)} className="flex-1 lg:flex-none bg-white text-slate-700 border border-slate-200 px-5 py-2 rounded-xl text-sm font-bold flex items-center justify-center gap-2 hover:bg-slate-50 transition-colors"><Printer size={18} /> <span className="hidden xs:inline">طباعة</span></button>
                            </div>
                        )}
                      </div>

                      {/* جدول الطلاب (Desktop View) */}
                      <div className="hidden md:block bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden">
                        <div className="overflow-x-auto">
                          <table className="w-full text-right border-collapse">
                            <thead className="bg-slate-50/80 border-b border-slate-200 text-slate-500 text-xs font-bold uppercase tracking-wider">
                              <tr>
                                <th className="p-4 w-16 text-center">#</th>
                                <th className="p-4">اسم الطالب</th>
                                <th className="p-4 w-32 text-center">رقم القيد</th>
                                <th className="p-4 w-28 text-center">الصفحة</th>
                                {view === 'trash' && <th className="p-4 w-32 text-center">إجراءات</th>}
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-50 text-sm">
                              {displayed.map((s, idx) => (
                                <tr key={s.id} onClick={() => { if(view!=='trash') { setSelectedId(s.id); setView('detail'); }}} className={`hover:bg-blue-50/40 cursor-pointer transition-all group ${view === 'trash' ? 'bg-red-50/10' : ''}`}>
                                  <td className="p-4 text-center text-slate-400 font-mono font-medium">{idx + 1}</td>
                                  <td className="p-4">
                                     <div className="flex items-center gap-3">
                                        <div className={`w-2.5 h-2.5 rounded-full flex-shrink-0 shadow-sm ${s.status === 'left' ? 'bg-rose-500' : s.status === 'transferred' ? 'bg-amber-500' : 'bg-emerald-500'}`}></div>
                                        <div className="flex flex-col">
                                            <span className="font-bold text-slate-800 text-base group-hover:text-blue-700 transition-colors">{cleanName(s.firstName)} {s.lastName ? ` / ${s.lastName}` : ''}</span>
                                        </div>
                                     </div>
                                  </td>
                                  <td className="p-4 text-center">
                                    <span className="bg-[#5314cd] text-white px-3 py-1.5 rounded-lg text-base font-bold font-mono shadow-md inline-block min-w-[60px] dir-ltr">
                                      {s.regNumber}
                                    </span>
                                  </td>
                                  <td className="p-4 text-center">
                                    <span className="bg-[#FFA500] text-white px-3 py-1.5 rounded-lg text-base font-bold font-mono shadow-md inline-block min-w-[60px]">
                                      {s.pageNumber}
                                    </span>
                                  </td>
                                  {view === 'trash' && (
                                      <td className="p-4 text-center">
                                        <div className="flex items-center justify-center gap-2">
                                            <button onClick={(e) => { e.stopPropagation(); handleRestore(s.id); }} className="p-2 bg-emerald-100 text-emerald-600 rounded-full hover:bg-emerald-200" title="استعادة"><RotateCcw size={16}/></button>
                                            <button onClick={(e) => { e.stopPropagation(); handlePermanentDelete(s.id); }} className="p-2 bg-red-100 text-red-600 rounded-full hover:bg-red-200" title="حذف نهائي"><Trash2 size={16}/></button>
                                        </div>
                                      </td>
                                  )}
                                </tr>
                              ))}
                              {displayed.length === 0 && <tr><td colSpan={view === 'trash' ? 5 : 4} className="p-16 text-center text-slate-400 font-medium">لا توجد سجلات</td></tr>}
                            </tbody>
                          </table>
                        </div>
                      </div>

                      {/* قائمة الطلاب (Mobile Cards View) */}
                      <div className="md:hidden space-y-3">
                         {displayed.map((s, idx) => (
                             <div key={s.id} onClick={() => { if(view!=='trash') { setSelectedId(s.id); setView('detail'); }}} className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 relative overflow-hidden active:scale-[0.98] transition-transform">
                                <div className={`absolute top-0 bottom-0 left-0 w-1.5 ${s.status === 'left' ? 'bg-rose-500' : s.status === 'transferred' ? 'bg-amber-500' : 'bg-emerald-500'}`}></div>
                                <div className="flex justify-between items-start pl-3">
                                    <div className="flex flex-col gap-1">
                                        <h3 className="font-bold text-slate-800 text-lg leading-tight">{cleanName(s.firstName)} {s.lastName ? ` / ${s.lastName}` : ''}</h3>
                                        <StatusBadge status={s.status} />
                                    </div>
                                    <span className="bg-slate-100 text-slate-400 text-[10px] font-mono font-bold px-2 py-1 rounded-md">#{idx + 1}</span>
                                </div>
                                <div className="mt-4 flex items-center justify-between border-t border-dashed border-slate-100 pt-3">
                                    <div className="flex gap-2">
                                        <div className="bg-[#5314cd] text-white px-3 py-1 rounded-lg text-sm font-bold font-mono shadow-sm flex items-center gap-1">
                                            <span className="text-[10px] opacity-70 font-sans">قيد</span>
                                            {s.regNumber}
                                        </div>
                                        <div className="bg-[#FFA500] text-white px-3 py-1 rounded-lg text-sm font-bold font-mono shadow-sm flex items-center gap-1">
                                            <span className="text-[10px] opacity-70 font-sans">ص</span>
                                            {s.pageNumber}
                                        </div>
                                    </div>
                                    {view === 'trash' && (
                                        <div className="flex gap-2">
                                            <button onClick={(e) => { e.stopPropagation(); handleRestore(s.id); }} className="p-2 bg-emerald-100 text-emerald-600 rounded-lg"><RotateCcw size={18}/></button>
                                            <button onClick={(e) => { e.stopPropagation(); handlePermanentDelete(s.id); }} className="p-2 bg-red-100 text-red-600 rounded-lg"><Trash2 size={18}/></button>
                                        </div>
                                    )}
                                </div>
                             </div>
                         ))}
                         {displayed.length === 0 && <div className="p-10 text-center text-slate-400 font-medium bg-white rounded-2xl border border-dashed">لا توجد سجلات</div>}
                      </div>
                      
                      {/* Loading Indicator */}
                      {displayed.length > 0 && displayed.length < filtered.length && (
                        <div ref={loadMoreRef} className="p-8 text-center w-full">
                           <div className="inline-block w-8 h-8 border-4 border-slate-200 border-t-slate-800 rounded-full animate-spin"></div>
                        </div>
                      )}

                    </div>
                </main>

                {/* Modals */}
                {/* Alert Modal */}
                {alertConfig && <AlertModal message={alertConfig.message} type={alertConfig.type} onClose={() => setAlertConfig(null)} />}
                
                {/* Confirm Modal */}
                {confirmConfig && <ConfirmModal title={confirmConfig.title} message={confirmConfig.message} onConfirm={confirmConfig.onConfirm} onCancel={() => setConfirmConfig(null)} isDestructive={confirmConfig.isDestructive} />}


                {(view === 'add' || view === 'edit') && (
                    <Modal onClose={() => setView('list')}>
                      <div className="bg-white rounded-3xl shadow-2xl overflow-hidden animate-slide-up border border-slate-100">
                        <div className="p-6 border-b flex justify-between items-center bg-slate-50/50">
                          <h2 className="text-xl font-extrabold text-slate-800">{view === 'add' ? 'إضافة سجل طالب' : 'تعديل بيانات الطالب'}</h2>
                          <button onClick={() => setView('list')} className="p-2 bg-white rounded-full hover:bg-slate-100 text-slate-400 transition-all"><X size={20}/></button>
                        </div>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const form = new FormData(e.target);
                            
                            const reg = String(form.get('regNumber')).trim();
                            const page = String(form.get('pageNumber')).trim();
                            
                            // Check for Duplicate Reg AND Page
                            const isDuplicateRegPage = students.some(s => 
                                s.regNumber === reg && 
                                s.pageNumber === page &&
                                s.id !== (view === 'edit' ? selectedId : null) &&
                                !s.isDeleted
                            );

                            if (isDuplicateRegPage) {
                                showAlert(`خطأ: يوجد طالب آخر مسجل بنفس رقم القيد (${reg}) ورقم الصفحة (${page}) معاً.`, 'error');
                                return;
                            }

                            const data = {
                                firstName: form.get('firstName'),
                                lastName: form.get('lastName'),
                                regNumber: reg,
                                pageNumber: page,
                                notes: form.get('notes'),
                                status: form.get('status') || 'active'
                            };
                            try {
                                if (view === 'edit') await updateDoc(doc(db, "students", selectedId), data);
                                else await addDoc(studentsCollection, { ...data, createdAt: Date.now(), isDeleted: false });
                                fetchStudents();
                                setView('list');
                                showAlert('تم حفظ البيانات بنجاح', 'success');

                                 placeholder="اسم الطالب الرباعي"

                                    {nameWarning}

                             <div className="col-span-2">
                               <label className="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-widest">اللقب</label>
                               <input name="lastName" defaultValue={view === 'edit' ? students.find(s=>s.id===selectedId)?.lastName : ''} className="w-full p-4 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-blue-500 outline-none text-base font-bold shadow-inner" placeholder="اللقب إن وجد (اختياري)" />
                             </div>
                           </div>
                           <div className="grid grid-cols-2 gap-4">
                             <div>
                                <label className="text-xs font-bold text-slate-400 mb-2 block uppercase tracking-widest">رقم القيد <span className="text-red-500">*</span></label>
                                <input name="regNumber" required onInput={handleNumericInput} className="w-full p-4 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-blue-500 outline-none font-mono text-center text-xl font-bold shadow-inner" defaultValue={view === 'edit' ? students.find(s=>s.id===selectedId)?.regNumber : ''} />
                             </div>
                             <div>
                                <label className="text-xs font-bold text-slate-400 mb-2 block uppercase tracking-widest">رقم الصفحة <span className="text-red-500">*</span></label>
                                <input name="pageNumber" required onInput={handleNumericInput} className="w-full p-4 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-blue-500 outline-none font-mono text-center text-xl font-bold shadow-inner" defaultValue={view === 'edit' ? students.find(s=>s.id===selectedId)?.pageNumber : ''} />
                             </div>
                           </div>
                           <div>
                              <label className="block text-xs font-bold text-slate-400 mb-3 uppercase tracking-widest">حالة الطالب الحالية</label>
                              <div className="grid grid-cols-3 gap-3">
                                <label className="cursor-pointer group">
                                    <input type="radio" name="status" value="active" className="peer hidden" defaultChecked={view==='add' || students.find(s=>s.id===selectedId)?.status === 'active'} />
                                    <div className="py-3 px-2 rounded-2xl border-2 border-slate-100 text-center font-bold text-sm text-slate-500 peer-checked:bg-emerald-500 peer-checked:text-white peer-checked:border-emerald-500 transition-all shadow-sm">مستمر</div>
                                </label>
                                <label className="cursor-pointer group">
                                    <input type="radio" name="status" value="transferred" className="peer hidden" defaultChecked={students.find(s=>s.id===selectedId)?.status === 'transferred'} />
                                    <div className="py-3 px-2 rounded-2xl border-2 border-slate-100 text-center font-bold text-sm text-slate-500 peer-checked:bg-amber-500 peer-checked:text-white peer-checked:border-amber-500 transition-all shadow-sm">منقول</div>
                                </label>
                                <label className="cursor-pointer group">
                                    <input type="radio" name="status" value="left" className="peer hidden" defaultChecked={students.find(s=>s.id===selectedId)?.status === 'left'} />
                                    <div className="py-3 px-2 rounded-2xl border-2 border-slate-100 text-center font-bold text-sm text-slate-500 peer-checked:bg-rose-500 peer-checked:text-white peer-checked:border-rose-500 transition-all shadow-sm">تارك</div>
                                </label>
                              </div>
                           </div>
                           <button className="w-full bg-slate-900 text-white py-5 rounded-2xl font-black text-lg hover:bg-slate-800 transition-all shadow-xl shadow-slate-900/30 mt-4 uppercase tracking-wider">حفظ البيانات</button>
                        </form>
                      </div>
                    </Modal>
                )}

                {/* Settings Modal */}
                {view === 'settings' && (
                    <Modal onClose={() => setView('list')}>
                      <div className="bg-white rounded-2xl shadow-xl p-6 space-y-4">
                        <div className="flex justify-between items-center border-b pb-4">
                            <h2 className="text-xl font-bold flex items-center gap-2"><Settings size={20}/> الإعدادات</h2>
                            <button onClick={() => setView('list')}><X size={20} className="text-slate-400"/></button>
                        </div>
                        <div className="space-y-3 pt-2">
                           <button onClick={() => exportToExcel(students.filter(s=>!s.isDeleted))} className="w-full py-4 bg-emerald-50 text-emerald-700 rounded-xl font-bold border border-emerald-100 flex items-center justify-between px-4 hover:bg-emerald-100 transition-colors">
                              <span className="flex items-center gap-2"><Download size={20}/> تصدير البيانات (Excel)</span>
                              <ArrowRight size={16} className="opacity-50"/>
                           </button>
                           
                           <button onClick={generateTemplate} className="w-full py-4 bg-blue-50 text-blue-700 rounded-xl font-bold border border-blue-100 flex items-center justify-between px-4 hover:bg-blue-100 transition-colors">
                              <span className="flex items-center gap-2"><FileSpreadsheet size={20}/> تحميل نموذج فارغ (1000 طالب)</span>
                              <ArrowRight size={16} className="opacity-50"/>
                           </button>

                           <label className="w-full py-4 bg-slate-900 text-white rounded-xl font-bold flex items-center justify-between px-4 cursor-pointer hover:bg-slate-800 transition-colors shadow-lg shadow-slate-900/10">
                              <span className="flex items-center gap-2">
                                  <Upload size={20}/> {importing ? 'جاري الاستيراد...' : 'استيراد من Excel'}
                              </span>
                              <input type="file" className="hidden" accept=".xlsx" onChange={handleImport} disabled={importing} />
                           </label>
                           
                           <div className="pt-4 border-t mt-4">
                             <button onClick={() => showConfirm("حذف جميع البيانات", "هل أنت متأكد تماماً من حذف جميع السجلات؟ هذا الإجراء سيقوم بمسح قاعدة البيانات بالكامل ولا يمكن التراجع عنه.", executeDeleteAll, true)} className="w-full py-4 bg-red-50 text-red-600 rounded-xl font-bold border border-red-100 flex items-center justify-center gap-2 hover:bg-red-100">
                                 <Trash2 size={20}/> حذف جميع البيانات (فورمات)
                             </button>
                           </div>
                        </div>
                      </div>
                    </Modal>
                )}

                {/* Detail View / Delete Single Modal */}
                {view === 'detail' && selectedId && (() => {
                    const s = students.find(x => x.id === selectedId);
                    if (!s) return null;
                    return (
                      <Modal onClose={() => setView('list')}>
                         <div className="bg-white rounded-2xl shadow-xl overflow-hidden animate-slide-up">
                           <div className="p-6 border-b flex justify-between items-start bg-slate-50/30">
                             <div>
                               <div className="flex items-center gap-2 mb-2">
                                  <h1 className="text-2xl font-bold text-slate-800">{cleanName(s.firstName)} {s.lastName ? ` / ${s.lastName}` : ''}</h1>
                                  <StatusBadge status={s.status} />
                               </div>
                               <div className="text-slate-400 text-xs">رقم القيد: {s.regNumber} | صفحة: {s.pageNumber}</div>
                             </div>
                             <button onClick={() => setView('list')} className="p-2 hover:bg-slate-200 rounded-full"><X size={20}/></button>
                           </div>
                           <div className="p-6 flex flex-col gap-3">
                               {s.notes && <div className="bg-slate-50 p-4 rounded-xl text-sm text-slate-600 mb-2 border">{s.notes}</div>}
                               <button onClick={() => handleSinglePrint(s)} className="w-full bg-slate-800 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2"><Printer size={18}/> طباعة بطاقة الطالب</button>
                               <div className="grid grid-cols-2 gap-2">
                                  <button onClick={() => setView('edit')} className="bg-slate-100 text-slate-700 py-2.5 rounded-xl font-bold hover:bg-slate-200">تعديل</button>
                                  <button onClick={() => showConfirm("حذف الطالب", "هل تريد نقل هذا الطالب إلى سلة المهملات؟", () => handleSoftDelete(s.id), true)} className="bg-red-50 text-red-600 py-2.5 rounded-xl font-bold hover:bg-red-100">حذف</button>
                               </div>
                           </div>
                         </div>
                      </Modal>
                    );
                })()}

                {showPrintModal && (
                    <Modal onClose={() => setShowPrintModal(false)}>
                       <div className="bg-white rounded-2xl p-6 text-center space-y-4 shadow-2xl">
                          <h3 className="text-lg font-bold">خيارات الطباعة</h3>
                          <button onClick={() => { setPrintMode('list'); handlePrint(); }} className="w-full py-3 bg-slate-900 text-white rounded-xl font-bold">طباعة السجل بالكامل</button>
                          <div className="text-slate-400 text-xs">أو اطبع قيداً محدداً</div>
                          <select value={printRegInput} onChange={(e) => setPrintRegInput(e.target.value)} className="w-full p-3 border rounded-xl text-center">
                               <option value="">اختر رقم القيد...</option>
                               {uniqueRegNumbers.map(r => <option key={r} value={r}>قيد {r}</option>)}
                          </select>
                          <button onClick={() => { setPrintMode('list'); handlePrint(printRegInput); }} className="w-full py-3 bg-blue-50 text-blue-600 rounded-xl font-bold disabled:opacity-50" disabled={!printRegInput}>طباعة القيد المحدد</button>
                       </div>
                    </Modal>
                )}
              </div>
              
              {/* Print Views */}
              {printMode === 'list' && <PrintView students={filtered} title={selectedRegFilter ? `قيد رقم ${selectedRegFilter}` : "فهرس القيد العام"} />}
              {printMode === 'single' && students.find(s=>s.id===selectedId) && <SingleStudentPrint student={students.find(s=>s.id===selectedId)} />}
            </>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
