<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل القيد العام</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK (الإصدارات المتوافقة) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- React -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { font-family: system-ui, sans-serif; }
        .rtl { direction: rtl; }
    </style>
</head>
<body class="bg-gray-100 rtl">
    <div id="root"></div>

    <script type="text/babel">
        // تهيئة Firebase مباشرة
        const firebaseConfig = {
            apiKey: "AIzaSyC3Hyi-tVMui0ZyPsezvoxxSFjCJQBme9Q",
            authDomain: "ss-app-87ac7.firebaseapp.com",
            projectId: "ss-app-87ac7",
            storageBucket: "ss-app-87ac7.firebasestorage.app",
            messagingSenderId: "7671656513",
            appId: "1:7671656513:web:21b51edb450bddd1aad6c0"
        };

        // تهيئة Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // مكون تسجيل الدخول
        function Login({ onLogin }) {
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [error, setError] = React.useState('');
            const [loading, setLoading] = React.useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');
                
                try {
                    await auth.signInWithEmailAndPassword(email, password);
                } catch (err) {
                    setError('البريد الإلكتروني أو كلمة المرور غير صحيحة');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 to-purple-600 p-4">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
                        <div className="text-center mb-8">
                            <div className="w-20 h-20 bg-blue-600 rounded-2xl mx-auto mb-4 flex items-center justify-center text-white text-3xl">
                                📋
                            </div>
                            <h2 className="text-2xl font-bold">سجل القيد العام</h2>
                            <p className="text-gray-500 text-sm mt-1">نظام إدارة شؤون الطلاب</p>
                        </div>
                        
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <input
                                    type="email"
                                    placeholder="البريد الإلكتروني"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    className="w-full p-3 border rounded-xl outline-none focus:border-blue-500"
                                    dir="ltr"
                                    required
                                />
                            </div>
                            
                            <div>
                                <input
                                    type="password"
                                    placeholder="كلمة المرور"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    className="w-full p-3 border rounded-xl outline-none focus:border-blue-500"
                                    dir="ltr"
                                    required
                                />
                            </div>
                            
                            {error && (
                                <p className="text-red-500 text-sm text-center bg-red-50 p-2 rounded-lg">
                                    {error}
                                </p>
                            )}
                            
                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-colors disabled:opacity-50"
                            >
                                {loading ? 'جاري التحقق...' : 'دخول'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // مكون القائمة الرئيسية
        function StudentList() {
            const [students, setStudents] = React.useState([]);
            const [loading, setLoading] = React.useState(true);

            React.useEffect(() => {
                const unsubscribe = db.collection('students').onSnapshot((snapshot) => {
                    const data = [];
                    snapshot.forEach(doc => {
                        data.push({ id: doc.id, ...doc.data() });
                    });
                    setStudents(data);
                    setLoading(false);
                }, (error) => {
                    console.error('Error:', error);
                    setLoading(false);
                });

                return () => unsubscribe();
            }, []);

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <p>جاري التحميل...</p>
                    </div>
                );
            }

            return (
                <div className="max-w-6xl mx-auto p-4">
                    <div className="bg-white rounded-xl shadow-lg p-6">
                        <h1 className="text-2xl font-bold mb-6">سجل الطلاب</h1>
                        
                        <div className="overflow-x-auto">
                            <table className="w-full">
                                <thead className="bg-gray-50">
                                    <tr>
                                        <th className="p-3 text-right">#</th>
                                        <th className="p-3 text-right">الاسم</th>
                                        <th className="p-3 text-center">رقم القيد</th>
                                        <th className="p-3 text-center">الصفحة</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {students.map((student, index) => (
                                        <tr key={student.id} className="border-t hover:bg-gray-50">
                                            <td className="p-3">{index + 1}</td>
                                            <td className="p-3 font-bold">
                                                {student.firstName} {student.lastName || ''}
                                            </td>
                                            <td className="p-3 text-center">{student.regNumber}</td>
                                            <td className="p-3 text-center">{student.pageNumber}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                            
                            {students.length === 0 && (
                                <p className="text-center text-gray-400 py-8">لا يوجد طلاب</p>
                            )}
                        </div>
                        
                        <button
                            onClick={() => auth.signOut()}
                            className="mt-4 px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600"
                        >
                            تسجيل خروج
                        </button>
                    </div>
                </div>
            );
        }

        // المكون الرئيسي
        function App() {
            const [user, setUser] = React.useState(null);
            const [loading, setLoading] = React.useState(true);

            React.useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((user) => {
                    setUser(user);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <p>جاري التحميل...</p>
                    </div>
                );
            }

            return user ? <StudentList /> : <Login />;
        }

        // تشغيل التطبيق
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
