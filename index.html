<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سجل قيود الطلاب</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
    
    <!-- Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              cairo: ['Cairo', 'sans-serif'],

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Cairo', sans-serif;
        background-color: #f8fafc;
        color: #1e293b;
        overflow-x: hidden;
      }
      /* Print Styles */
      @media print {
        @page { 
            size: A4; 
            margin: 0 !important; 
        } 
        
        html, body { 
            margin: 0 !important; 
            padding: 0 !important;
            background-color: white; 
            overflow: visible !important;
            height: auto !important;
            width: 210mm;
        }
        
        .no-print { display: none !important; }
        .print-only { display: block !important; }
        
        .print-page-container {
            width: 210mm;
            height: 297mm;
            padding: 10mm 15mm;
            box-sizing: border-box;
            page-break-after: always;

            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: stretch;
            position: relative;
            background-color: white;
            overflow: hidden;

        .print-page-container:last-child {
            page-break-after: auto;

        }

        table { 
            width: 100%; 
            border-collapse: collapse;
            table-layout: fixed;
        }
        
        th, td {
            word-wrap: break-word;
            border: 1px solid black !important;
            padding: 2px 4px;
        }

        tr {
            page-break-inside: avoid;
            break-inside: avoid;
        }

        h1, .flex {
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
      }
      .print-only { display: none; }
      
      /* Scrollbars */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background-color: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }

      @keyframes fade-in { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
      .animate-fade-in { animation: fade-in 0.2s ease-out; }
      @keyframes slide-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
      .animate-slide-up { animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>

    <!-- React & Babel Support -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Import Map -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1?deps=react@18.2.0",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
        "xlsx": "https://cdn.sheetjs.com/xlsx-0.20.1/package/xlsx.mjs"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef } from 'react';
        import ReactDOM from 'react-dom/client';
        import { 
          Users, LogOut, Settings, Search, Plus, Printer, 
          Trash2, FileSpreadsheet, Download, Upload, AlertTriangle, ArrowRight, Save, X, FileText, CheckCircle2, XCircle, AlertCircle, ArrowUp, Filter, UserCheck, SortAsc, Type, ChevronDown, ListFilter, RotateCcw, Info, Calendar, Clock, ArrowLeft
        } from 'lucide-react';
        import { initializeApp } from "firebase/app";
        import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, deleteDoc, writeBatch } from "firebase/firestore";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "firebase/auth";
        import * as XLSX from 'xlsx';

        // ==========================================
        // FIREBASE CONFIG
        // ==========================================
        const firebaseConfig = {
          apiKey: "AIzaSyC3Hyi-tVMui0ZyPsezvoxxSFjCJQBme9Q",
          authDomain: "ss-app-87ac7.firebaseapp.com",
          projectId: "ss-app-87ac7",
          storageBucket: "ss-app-87ac7.firebasestorage.app",
          messagingSenderId: "7671656513",
          appId: "1:7671656513:web:21b51edb450bddd1aad6c0",
          measurementId: "G-LQPLFRBGKH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const studentsCollection = collection(db, "students");

        // ==========================================
        // UTILS
        // ==========================================
        const cleanName = (name) => {
            if (!name) return "";
            return name.replace(/\s+\d+$/, '').trim();
        };

        const formatDateForInput = (timestamp) => {
            if (!timestamp) return new Date().toISOString().split('T')[0];
            return new Date(timestamp).toISOString().split('T')[0];
        };

        const exportToExcel = (students) => {
          const statusMap = { 'active': 'مستمر', 'transferred': 'منقول', 'left': 'تارك' };
          const data = students.map(s => ({
            'الاسم الأول': cleanName(s.firstName),
            'اللقب': s.lastName,
            'رقم القيد': s.regNumber,
            'رقم الصفحة': s.pageNumber,
            'الحالة': statusMap[s.status || 'active'] || 'مستمر',
            'الملاحظات': s.notes || '',
            'تاريخ الإضافة': new Date(s.createdAt).toLocaleDateString('ar-EG')
          }));
          const worksheet = XLSX.utils.json_to_sheet(data);
          const workbook = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(workbook, worksheet, "الطلاب");
          XLSX.writeFile(workbook, "سجل_الطلاب.xlsx");
        };

        const generate1000Template = () => {
          const firstNames = ['محمد', 'أحمد', 'عبدالله', 'علي', 'عمر', 'خالد', 'سعد', 'سعيد', 'صالح', 'فهد', 'سلمان', 'يوسف', 'إبراهيم'];
          const templateData = [];
          for (let i = 0; i < 1000; i++) {
            templateData.push({
              'الاسم الأول': firstNames[Math.floor(Math.random() * firstNames.length)] + " " + (i + 1), 
              'اللقب': 'طالب',
              'رقم القيد': (i + 1).toString(),
              'رقم الصفحة': (Math.floor(i / 10) + 1).toString(),
              'الحالة': 'مستمر',
              'الملاحظات': 'توليد تلقائي'
            });
          }
          const worksheet = XLSX.utils.json_to_sheet(templateData);
          const workbook = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(workbook, worksheet, "نموذج 1000 طالب");
          XLSX.writeFile(workbook, "نموذج_سجل_1000_طالب.xlsx");
        };

        const readExcel = (file) => {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
              try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheetName]);
                resolve(jsonData);
              } catch (err) { reject(err); }
            };
            reader.onerror = (error) => reject(error);
            reader.readAsArrayBuffer(file);
          });
        };

        // ==========================================
        // UI COMPONENTS
        // ==========================================
        const SkeletonLoader = () => (
          <div className="animate-pulse space-y-6">
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
              {[...Array(4)].map((_, i) => (
                <div key={i} className="bg-white p-4 rounded-2xl border border-slate-100 h-24"></div>
              ))}
            </div>
            <div className="bg-white p-2 rounded-2xl border border-slate-100 h-14"></div>
          </div>
        );

        const Modal = ({ children, onClose, zIndex = "z-50" }) => (
          <div className={`fixed inset-0 bg-slate-900/60 ${zIndex} flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in overflow-y-auto`} onClick={onClose}>
            <div className="w-full max-w-lg relative" onClick={e => e.stopPropagation()}>{children}</div>
          </div>
        );

        const AlertModal = ({ message, type, onClose }) => (
          <Modal onClose={onClose} zIndex="z-[60]">
            <div className="bg-white rounded-2xl p-6 text-center shadow-2xl animate-slide-up">
              <div className={`w-16 h-16 rounded-full mx-auto flex items-center justify-center mb-4 ${type === 'error' ? 'bg-red-100 text-red-500' : 'bg-green-100 text-green-500'}`}>
                {type === 'error' ? <AlertCircle size={32} /> : <CheckCircle2 size={32} />}
              </div>
              <p className="text-slate-800 font-bold mb-6">{message}</p>
              <button onClick={onClose} className="w-full py-3 bg-slate-900 text-white rounded-xl font-bold">حسناً</button>
            </div>
          </Modal>
        );

        const ConfirmModal = ({ title, message, onConfirm, onCancel, isDestructive = false }) => (
          <Modal onClose={onCancel} zIndex="z-[60]">
            <div className="bg-white rounded-2xl p-6 text-center shadow-2xl animate-slide-up">
              <h3 className="text-xl font-bold text-slate-800 mb-2">{title}</h3>
              <p className="text-slate-500 mb-8">{message}</p>
              <div className="flex gap-3">
                <button onClick={onCancel} className="flex-1 py-3 bg-slate-100 rounded-xl font-bold">إلغاء</button>
                <button onClick={onConfirm} className={`flex-1 py-3 text-white rounded-xl font-bold ${isDestructive ? 'bg-red-500' : 'bg-blue-600'}`}>تأكيد</button>
              </div>
            </div>
          </Modal>
        );

        const StatCard = ({ title, value, icon, colorClass }) => (
          <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex flex-col items-center justify-center text-center gap-2">
            <div className={`p-3 rounded-2xl ${colorClass} text-white shadow-lg`}>{icon}</div>
            <div>
              <div className="text-2xl font-black text-slate-800 font-mono">{value}</div>
              <div className="text-xs text-slate-500 font-bold mt-1">{title}</div>
            </div>
          </div>
        );

        const StatusBadge = ({ status }) => {
           if (status === 'transferred') return <span className="inline-flex items-center gap-1.5 bg-amber-50 text-amber-600 px-2.5 py-1 rounded-lg text-xs font-bold border border-amber-100">منقول</span>;
           if (status === 'left') return <span className="inline-flex items-center gap-1.5 bg-rose-50 text-rose-600 px-2.5 py-1 rounded-lg text-xs font-bold border border-rose-100">تارك</span>;
           return <span className="inline-flex items-center gap-1.5 bg-emerald-50 text-emerald-600 px-2.5 py-1 rounded-lg text-xs font-bold border border-emerald-100">مستمر</span>;
        };

        const PrintView = ({ students, title }) => {
          const sortedStudents = useMemo(() => {
             return [...students]
               .sort((a, b) => a.firstName.localeCompare(b.firstName))
               .map((s, i) => ({ ...s, printIndex: i + 1 }));
          }, [students]);

          const ROWS_PER_COLUMN_MAX = 31; 
          const COLUMNS_PER_PAGE = 2;
          const MAX_ITEMS_PER_PAGE = ROWS_PER_COLUMN_MAX * COLUMNS_PER_PAGE;
          
          const totalItems = sortedStudents.length;
          const totalPages = Math.ceil(totalItems / MAX_ITEMS_PER_PAGE);
          const printDate = new Date().toLocaleDateString('ar-EG');
          
          const pages = [];
          for (let i = 0; i < totalPages; i++) {
            pages.push(sortedStudents.slice(i * MAX_ITEMS_PER_PAGE, (i + 1) * MAX_ITEMS_PER_PAGE));
          }
          
          return (
            <div className="print-only text-[9.5pt] dir-rtl">
              {pages.map((pageStudents, pageIndex) => (
                <div key={pageIndex} className="print-page-container">
                   {/* Header */}
                   <div className="flex justify-between items-end border-b-2 border-black pb-2 mb-4 w-full h-[40px]">
                      <div className="text-[10px] font-medium text-gray-500 w-32 text-right">صفحة {pageIndex + 1} من {totalPages}</div>
                      <h1 className="text-xl font-bold flex-1 text-center">{title || "فهرس القيد العام"}</h1>
                      <div className="text-[10px] font-medium text-gray-500 w-32 text-left">تاريخ: {printDate}</div>
                   </div>

                   {/* Columns */}
                   <div className="flex flex-row gap-[8mm] flex-1">
                     {[0, 1].map((colIndex) => {
                       const colStudents = pageStudents.slice(colIndex * ROWS_PER_COLUMN_MAX, (colIndex + 1) * ROWS_PER_COLUMN_MAX);
                       return (
                         <div key={colIndex} className="flex-1 flex flex-col">
                           <table className="w-full border-collapse table-fixed">
                             <thead>
                               <tr className="bg-gray-100 h-[36px]">
                                 <th className="p-1 text-center w-[35px] text-[8.5pt]">ت</th>
                                 <th className="p-1 text-right">الاسم الكامل</th>
                                 <th className="p-1 text-center w-[40px] font-bold text-[8.5pt]">ق</th>
                                 <th className="p-1 text-center w-[40px] font-bold text-[8.5pt]">ص</th>
                               </tr>
                             </thead>
                             <tbody>
                               {Array.from({ length: ROWS_PER_COLUMN_MAX }).map((_, rowIndex) => {
                                 const s = colStudents[rowIndex];
                                 return (
                                   <tr key={rowIndex} className="h-[31px]">
                                     <td className="px-1 text-center font-medium">{s ? s.printIndex : ''}</td>
                                     <td className="px-2 align-middle whitespace-nowrap overflow-hidden leading-relaxed font-bold">
                                       {s ? cleanName(s.firstName) : ''}
                                     </td>
                                     <td className="px-1 text-center font-bold font-mono text-[10.5pt] align-middle">{s ? s.regNumber : ''}</td>
                                     <td className="px-1 text-center font-bold font-mono text-[10.5pt] align-middle">{s ? s.pageNumber : ''}</td>
                                   </tr>
                                 );
                               })}
                             </tbody>
                           </table>
                         </div>
                       );
                     })}
                   </div>
                </div>
              ))}
            </div>
          );
        };

        const Login = () => {
          const [email, setEmail] = useState('');
          const [password, setPassword] = useState('');
          const [error, setError] = useState('');
          const [loading, setLoading] = useState(false);
          const handleSubmit = async (e) => {
            e.preventDefault();
            setLoading(true);
            try { await signInWithEmailAndPassword(auth, email, password); } 
            catch (err) { setError('بيانات الدخول غير صحيحة'); } 
            finally { setLoading(false); }
          };
          return (
            <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4" dir="rtl">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-md p-8 animate-fade-in">
                <div className="text-center mb-8">
                  <div className="w-16 h-16 bg-blue-600 rounded-2xl mx-auto mb-4 flex items-center justify-center shadow-lg"><Users className="w-8 h-8 text-white" /></div>
                  <h2 className="text-2xl font-bold text-slate-800">تسجيل الدخول</h2>
                </div>
                <form onSubmit={handleSubmit} className="space-y-4">
                  <input type="email" required className="w-full px-4 py-3 rounded-xl border border-slate-300 outline-none text-left bg-slate-50" dir="ltr" placeholder="البريد الإلكتروني" value={email} onChange={(e) => setEmail(e.target.value)} />
                  <input type="password" required className="w-full px-4 py-3 rounded-xl border border-slate-300 outline-none text-left bg-slate-50" dir="ltr" placeholder="كلمة المرور" value={password} onChange={(e) => setPassword(e.target.value)} />
                  {error && <p className="text-red-500 text-sm text-center">{error}</p>}
                  <button type="submit" disabled={loading} className="w-full bg-slate-900 text-white font-bold py-4 rounded-xl shadow-lg transition-all">{loading ? 'جاري التحقق...' : 'دخول'}</button>
                </form>
              </div>
            </div>
          );
        };

        const App = () => {
          const [user, setUser] = useState(null);
          const [loading, setLoading] = useState(true);
          const [students, setStudents] = useState([]);
          const [view, setView] = useState('list');
          const [selectedId, setSelectedId] = useState(null);
          const [search, setSearch] = useState('');
          const [debouncedQuery, setDebouncedQuery] = useState(''); 
          const [selectedRegFilter, setSelectedRegFilter] = useState(''); 
          const [statusFilter, setStatusFilter] = useState('ALL');
          const [sortBy, setSortBy] = useState('recent');
          const [letterFilter, setLetterFilter] = useState('ALL');
          const [showPrintModal, setShowPrintModal] = useState(false);
          const [printRegInput, setPrintRegInput] = useState('');
          const [visibleCount, setVisibleCount] = useState(150);
          const loadMoreRef = useRef(null);
          const [importing, setImporting] = useState(false);
          const [printMode, setPrintMode] = useState('list');
          const [alertConfig, setAlertConfig] = useState(null);
          const [confirmConfig, setConfirmConfig] = useState(null);

          const stats = useMemo(() => {
            const active = students.filter(s => !s.isDeleted);
            return {
                total: active.length,
                activeOnly: active.filter(s => (s.status || 'active') === 'active').length,
                regs: new Set(active.map(s => s.regNumber)).size,
                others: active.filter(s => (s.status || 'active') !== 'active').length,
                deleted: students.filter(s => s.isDeleted).length
            };
          }, [students]);

          useEffect(() => {
            const unsub = onAuthStateChanged(auth, (u) => {
              setUser(u);
              if (u) fetchStudents();
              else setLoading(false);
            });
            return () => unsub();
          }, []);

          useEffect(() => {
            const timer = setTimeout(() => setDebouncedQuery(search), 300);
            return () => clearTimeout(timer);
          }, [search]);

          useEffect(() => {
            const observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting) setVisibleCount((prev) => prev + 50);
            }, { threshold: 0.1 });
            if (loadMoreRef.current) observer.observe(loadMoreRef.current);
            return () => observer.disconnect();
          }, [students.length]);

          const fetchStudents = async () => {
            try {
              const snap = await getDocs(studentsCollection);
              const data = [];
              snap.forEach(d => {
                 const raw = d.data();
                 data.push({ id: d.id, ...raw, createdAt: raw.createdAt?.toMillis ? raw.createdAt.toMillis() : (raw.createdAt || Date.now()) });
              });
              data.sort((a,b) => b.createdAt - a.createdAt);
              setStudents(data);
              setLoading(false);
            } catch (e) { console.error(e); }
          };

          const handleImport = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            setImporting(true);
            try {
              const rows = await readExcel(file);
              const batch = writeBatch(db);
              let count = 0;
              rows.forEach(row => {
                 const fName = row['الاسم الكامل'] || row['firstName'] || row['الاسم الأول'];
                 const reg = row['رقم القيد'] || row['regNumber'];
                 const page = row['رقم الصفحة'] || row['pageNumber'];
                 if (fName && reg) {
                    const ref = doc(studentsCollection);
                    batch.set(ref, {
                       firstName: String(fName).trim(),
                       regNumber: String(reg).trim(),
                       pageNumber: String(page || '').trim(),
                       isDeleted: false,
                       createdAt: Date.now() + count
                    });
                    count++;
                 }
              });
              await batch.commit();
              fetchStudents();
              setAlertConfig({ message: `تم استيراد ${count} سجل بنجاح`, type: 'success' });
            } catch (e) { setAlertConfig({ message: "فشل الاستيراد", type: 'error' }); }
            setImporting(false);
          };

          const executeDeleteAll = async () => {
             setConfirmConfig(null);
             setLoading(true);
             try {
               const snap = await getDocs(studentsCollection);
               const CHUNK_SIZE = 400;
               const allDocs = snap.docs;
               for (let i = 0; i < allDocs.length; i += CHUNK_SIZE) {
                  const batch = writeBatch(db);
                  const chunk = allDocs.slice(i, i + CHUNK_SIZE);
                  chunk.forEach((d) => batch.delete(d.ref));
                  await batch.commit();
               }
               setStudents([]);
               setAlertConfig({ message: 'تم حذف كافة البيانات بنجاح', type: 'success' });
               setView('list');
             } catch (e) { setAlertConfig({ message: "فشل حذف البيانات", type: 'error' }); }
             finally { setLoading(false); }
          };

          const filtered = useMemo(() => {
            let res = students.filter(s => view === 'trash' ? s.isDeleted : !s.isDeleted);
            if (selectedRegFilter) res = res.filter(s => s.regNumber === selectedRegFilter);
            if (letterFilter !== 'ALL') res = res.filter(s => s.firstName.startsWith(letterFilter));
            if (statusFilter !== 'ALL') res = res.filter(s => (s.status || 'active') === statusFilter);
            if (debouncedQuery) {
               const q = debouncedQuery.toLowerCase();
               res = res.filter(s => s.firstName.toLowerCase().includes(q) || (s.lastName && s.lastName.toLowerCase().includes(q)));
            }
            if (sortBy === 'alphabetical') res.sort((a,b) => a.firstName.localeCompare(b.firstName));
            else res.sort((a,b) => b.createdAt - a.createdAt);
            return res;
          }, [students, debouncedQuery, selectedRegFilter, statusFilter, sortBy, letterFilter, view]);

          const displayed = useMemo(() => filtered.slice(0, visibleCount), [filtered, visibleCount]);
          const arabicLetters = ['أ', 'ا', 'ب', 'ت', 'ث', 'ج', 'ح', 'خ', 'د', 'ذ', 'ر', 'ز', 'س', 'ش', 'ص', 'ض', 'ط', 'ظ', 'ع', 'غ', 'ف', 'ق', 'ك', 'ل', 'م', 'ن', 'هـ', 'و', 'ي'];

          if (!user) return <Login />;

          return (
            <>
              <div className="min-h-screen no-print pb-20">
                <header className="bg-white border-b sticky top-0 z-40 shadow-sm backdrop-blur-md bg-white/80">
                  <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                    <div className="flex items-center gap-2 font-bold text-lg text-slate-800 cursor-pointer" onClick={() => setView('list')}>
                      <div className="bg-slate-900 text-white p-2 rounded-xl shadow-lg shadow-slate-900/10"><Users size={20} /></div>
                      <span>سجل القيود</span>
                    </div>
                    <div className="flex items-center gap-2">
                      <button onClick={() => setView('settings')} className="p-2.5 text-slate-500 hover:bg-slate-100 rounded-full transition-colors"><Settings size={22} /></button>
                      <button onClick={() => setConfirmConfig({ title: "تسجيل خروج", message: "هل أنت متأكد؟", onConfirm: () => signOut(auth) })} className="p-2.5 text-red-500 hover:bg-red-50 rounded-full transition-colors"><LogOut size={22} /></button>
                    </div>
                  </div>
                </header>

                <main className="max-w-7xl mx-auto px-4 py-6">
                    {loading ? <SkeletonLoader /> : (
                        <div className="animate-fade-in space-y-6">
                          {view === 'trash' && (
                            <div className="flex items-center justify-between bg-red-50 p-4 rounded-2xl border border-red-100 animate-slide-up">
                                <div className="flex items-center gap-2 text-red-700 font-bold">
                                    <Trash2 size={24} />
                                    <span>سلة المهملات</span>
                                </div>
                                <button onClick={() => setView('list')} className="flex items-center gap-2 bg-white text-slate-700 px-4 py-2 rounded-xl text-sm font-bold shadow-sm hover:bg-slate-50 transition-colors"><ArrowLeft size={18}/> العودة</button>
                            </div>
                          )}

                          {view !== 'trash' && (
                            <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                                <StatCard title="إجمالي الطلاب" value={stats.total} icon={<Users size={20}/>} colorClass="bg-blue-600" />
                                <StatCard title="المستمرون" value={stats.activeOnly} icon={<UserCheck size={20}/>} colorClass="bg-emerald-600" />
                                <StatCard title="القيود" value={stats.regs} icon={<FileSpreadsheet size={20}/>} colorClass="bg-indigo-600" />
                                <StatCard title="أخرى" value={stats.others} icon={<AlertTriangle size={20}/>} colorClass="bg-amber-500" />
                            </div>
                          )}

                          <div className="bg-white p-2 rounded-2xl border shadow-sm flex flex-col lg:flex-row gap-4">
                            <div className="flex-1 flex flex-col gap-2">
                                <div className="relative flex items-center bg-slate-50 rounded-xl border px-3 py-2">
                                    <Search className="text-slate-400 ml-2" size={20} />
                                    <input className="flex-1 bg-transparent outline-none text-slate-700 h-8 font-bold text-sm" placeholder="ابحث باسم الطالب..." value={search} onChange={(e) => setSearch(e.target.value)} />
                                </div>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-2 items-center">
                                    <select value={selectedRegFilter} onChange={(e) => setSelectedRegFilter(e.target.value)} className="bg-slate-50 rounded-xl px-2 py-1.5 border text-xs font-bold outline-none">
                                        <option value="">جميع القيود</option>
                                        {Array.from(new Set(students.filter(s => !s.isDeleted).map(s => s.regNumber))).sort().map(r => <option key={r} value={r}>قيد {r}</option>)}
                                    </select>
                                    <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} className="bg-slate-50 rounded-xl px-2 py-1.5 border text-xs font-bold outline-none">
                                        <option value="ALL">كل الحالات</option>
                                        <option value="active">مستمر</option>
                                        <option value="transferred">منقول</option>
                                        <option value="left">تارك</option>
                                    </select>
                                    <select value={sortBy} onChange={e => setSortBy(e.target.value)} className="bg-slate-50 rounded-xl px-2 py-1.5 border text-xs font-bold outline-none">
                                        <option value="recent">الأحدث</option>
                                        <option value="alphabetical">أبجدي</option>
                                    </select>
                                    <select value={letterFilter} onChange={e => setLetterFilter(e.target.value)} className="bg-slate-50 rounded-xl px-2 py-1.5 border text-xs font-bold outline-none">
                                        <option value="ALL">كل الحروف</option>
                                        {arabicLetters.map(l => <option key={l} value={l}>{l}</option>)}
                                    </select>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => { setSelectedId(null); setView('add'); }} className="flex-1 lg:flex-none bg-slate-900 text-white px-5 py-2 rounded-xl text-sm font-bold flex items-center justify-center gap-2 shadow-lg hover:bg-slate-800 transition-colors"><Plus size={18} /> إضافة</button>
                                <button onClick={() => setShowPrintModal(true)} className="flex-1 lg:flex-none bg-white text-slate-700 border px-5 py-2 rounded-xl text-sm font-bold flex items-center justify-center gap-2 hover:bg-slate-50 transition-colors"><Printer size={18} /> طباعة</button>
                            </div>
                          </div>

                          <div className="hidden md:block bg-white rounded-3xl border shadow-xl overflow-hidden">
                            <table className="w-full text-right border-collapse">
                              <thead className="bg-slate-50/80 border-b-2 border-slate-200 text-slate-500 text-xs font-bold uppercase">
                                <tr>
                                  <th className="p-4 w-16 text-center">#</th>
                                  <th className="p-4">اسم الطالب</th>
                                  <th className="p-4 w-32 text-center">رقم القيد</th>
                                  <th className="p-4 w-28 text-center">الصفحة</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y-2 divide-slate-100 text-sm">
                                {displayed.map((s, idx) => (
                                  <tr key={s.id} onClick={() => { setSelectedId(s.id); setView('detail'); }} className="hover:bg-blue-50/40 cursor-pointer transition-all border-b border-slate-50 group">
                                    <td className="p-4 text-center text-slate-400 font-mono">{idx + 1}</td>
                                    <td className="p-4 font-bold text-slate-800 group-hover:text-blue-700 transition-colors">{cleanName(s.firstName)} {s.lastName || ""}</td>
                                    <td className="p-4 text-center"><span className="bg-[#5314cd] text-white px-3 py-1.5 rounded-lg font-mono inline-block min-w-[50px] shadow-sm">{s.regNumber}</span></td>
                                    <td className="p-4 text-center"><span className="bg-[#FFA500] text-white px-3 py-1.5 rounded-lg font-mono inline-block min-w-[50px] shadow-sm">{s.pageNumber}</span></td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>

                          <div className="md:hidden space-y-3">
                             {displayed.map((s, idx) => (
                                 <div key={s.id} onClick={() => { setSelectedId(s.id); setView('detail'); }} className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 relative mb-2 hover:bg-slate-50 group transition-colors">
                                    <div className={`absolute top-0 bottom-0 left-0 w-1.5 ${s.status === 'left' ? 'bg-rose-500' : s.status === 'transferred' ? 'bg-amber-500' : 'bg-emerald-500'}`}></div>
                                    <h3 className="font-bold text-slate-800 group-hover:text-blue-700 transition-colors">{cleanName(s.firstName)} {s.lastName || ""}</h3>
                                    <div className="mt-4 flex gap-2 border-t border-slate-100 pt-2">
                                        <span className="bg-[#5314cd] text-white px-3 py-1 rounded-lg text-sm font-bold shadow-sm">ق {s.regNumber}</span>
                                        <span className="bg-[#FFA500] text-white px-3 py-1 rounded-lg text-sm font-bold shadow-sm">ص {s.pageNumber}</span>
                                    </div>
                                 </div>
                             ))}
                          </div>
                          <div ref={loadMoreRef} className="h-10"></div>
                        </div>
                    )}
                </main>

                {(view === 'add' || view === 'edit') && (
                    <Modal onClose={() => setView('list')}>
                      <div className="bg-white rounded-3xl shadow-2xl p-6 space-y-6">
                        <h2 className="text-xl font-bold">{view === 'add' ? 'إضافة سجل طالب' : 'تعديل بيانات الطالب'}</h2>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const form = new FormData(e.target);
                            const regNum = String(form.get('regNumber')).trim();
                            const pageNum = String(form.get('pageNumber')).trim();
                            
                            // Check duplication: Same Reg AND Same Page
                            const isDuplicate = students.some(s => 
                                !s.isDeleted && 
                                s.regNumber === regNum && 
                                s.pageNumber === pageNum && 
                                s.id !== selectedId
                            );

                            if (isDuplicate) {
                                setAlertConfig({ message: "خطأ: هذا القيد مسجل بالفعل في نفس الصفحة لطالب آخر.", type: 'error' });
                                return;
                            }

                            const data = {
                                firstName: form.get('firstName'),
                                lastName: form.get('lastName'), // Optional
                                regNumber: regNum,
                                pageNumber: pageNum,
                                notes: form.get('notes'),
                                status: form.get('status') || 'active',
                                isDeleted: false,
                                createdAt: view === 'edit' ? new Date(form.get('createdAt')).getTime() : Date.now()
                            };
                            try {
                                if (view === 'edit') await updateDoc(doc(db, "students", selectedId), data);
                                else await addDoc(studentsCollection, data);
                                fetchStudents();
                                setView('list');
                                setAlertConfig({ message: 'تم الحفظ بنجاح', type: 'success' });
                            } catch(err) { setAlertConfig({ message: "حدث خطأ", type: 'error' }); }
                        }} className="space-y-4">
                           <input name="firstName" required defaultValue={view === 'edit' ? cleanName(students.find(s=>s.id===selectedId)?.firstName) : ''} className="w-full p-4 rounded-xl bg-slate-50 outline-none border focus:border-blue-500 font-bold" placeholder="اسم الطالب" />
                           <input name="lastName" defaultValue={view === 'edit' ? students.find(s=>s.id===selectedId)?.lastName : ''} className="w-full p-4 rounded-xl bg-slate-50 outline-none border focus:border-blue-500 font-bold" placeholder="اللقب (اختياري)" />
                           <div className="grid grid-cols-2 gap-4">
                             <input name="regNumber" required className="w-full p-4 rounded-xl bg-slate-50 border outline-none text-center font-bold" placeholder="رقم القيد" defaultValue={view === 'edit' ? students.find(s=>s.id===selectedId)?.regNumber : ''} />
                             <input name="pageNumber" required className="w-full p-4 rounded-xl bg-slate-50 border outline-none text-center font-bold" placeholder="رقم الصفحة" defaultValue={view === 'edit' ? students.find(s=>s.id===selectedId)?.pageNumber : ''} />
                           </div>
                           <input type="date" name="createdAt" className="w-full p-4 rounded-xl bg-slate-50 border outline-none font-bold" defaultValue={view === 'edit' ? formatDateForInput(students.find(s=>s.id===selectedId)?.createdAt) : formatDateForInput(Date.now())} />
                           <div>
                              <label className="block text-xs font-bold text-slate-400 mb-3 uppercase tracking-widest">حالة الطالب</label>
                              <div className="grid grid-cols-3 gap-3">
                                <label className="cursor-pointer group">
                                    <input type="radio" name="status" value="active" className="peer hidden" defaultChecked={view==='add' || students.find(s=>s.id===selectedId)?.status === 'active'} />
                                    <div className="py-3 px-2 rounded-2xl border-2 border-slate-100 text-center font-bold text-sm text-slate-500 peer-checked:bg-emerald-500 peer-checked:text-white peer-checked:border-emerald-500 transition-all">مستمر</div>
                                </label>
                                <label className="cursor-pointer group">
                                    <input type="radio" name="status" value="transferred" className="peer hidden" defaultChecked={students.find(s=>s.id===selectedId)?.status === 'transferred'} />
                                    <div className="py-3 px-2 rounded-2xl border-2 border-slate-100 text-center font-bold text-sm text-slate-500 peer-checked:bg-amber-500 peer-checked:text-white peer-checked:border-amber-500 transition-all">منقول</div>
                                </label>
                                <label className="cursor-pointer group">
                                    <input type="radio" name="status" value="left" className="peer hidden" defaultChecked={students.find(s=>s.id===selectedId)?.status === 'left'} />
                                    <div className="py-3 px-2 rounded-2xl border-2 border-slate-100 text-center font-bold text-sm text-slate-500 peer-checked:bg-rose-500 peer-checked:text-white peer-checked:border-rose-500 transition-all">تارك</div>
                                </label>
                              </div>
                           </div>
                           <input name="notes" defaultValue={view === 'edit' ? students.find(s=>s.id===selectedId)?.notes : ''} className="w-full p-4 rounded-xl bg-slate-50 outline-none border focus:border-blue-500 font-bold" placeholder="ملاحظات (اختياري)" />
                           <button className="w-full bg-slate-900 text-white py-4 rounded-xl font-bold shadow-xl hover:bg-slate-800 transition-colors">حفظ</button>
                        </form>
                      </div>
                    </Modal>
                )}

                {view === 'settings' && (
                    <Modal onClose={() => setView('list')}>
                      <div className="bg-white rounded-2xl shadow-xl p-6 space-y-4">
                        <h2 className="text-xl font-bold flex items-center gap-2"><Settings size={20}/> الإعدادات</h2>
                        <button onClick={() => setView('trash')} className="w-full py-4 bg-slate-50 rounded-xl font-bold flex justify-between px-4 hover:bg-slate-100 transition-colors"><span>سلة المهملات</span> <ArrowRight size={16}/></button>
                        <button onClick={() => exportToExcel(students.filter(s=>!s.isDeleted))} className="w-full py-4 bg-emerald-50 text-emerald-700 rounded-xl font-bold px-4 flex items-center gap-2 hover:bg-emerald-100 transition-transform active:scale-95"><Download size={20}/> تصدير Excel</button>
                        <button onClick={generate1000Template} className="w-full py-4 bg-indigo-50 text-indigo-700 rounded-xl font-bold px-4 flex items-center gap-2 hover:bg-indigo-100 transition-transform active:scale-95"><FileSpreadsheet size={20}/> نموذج 1000 طالب</button>
                        <label className="w-full py-4 bg-slate-900 text-white rounded-xl font-bold flex items-center justify-between px-4 cursor-pointer hover:bg-slate-800 transition-colors">
                            <span className="flex items-center gap-2"><Upload size={20}/> استيراد من Excel</span>
                            <input type="file" className="hidden" accept=".xlsx" onChange={handleImport} disabled={importing} />
                        </label>
                        <div className="pt-4 border-t border-slate-100 mt-2">
                           <button onClick={() => setConfirmConfig({ title: "حذف شامل", message: "هل أنت متأكد من حذف كافة البيانات نهائياً؟", onConfirm: executeDeleteAll, isDestructive: true })} className="w-full py-4 bg-red-50 text-red-600 rounded-xl font-bold px-4 flex items-center gap-2 hover:bg-red-100 transition-transform active:scale-95"><Trash2 size={20}/> حذف كافة البيانات</button>
                        </div>
                      </div>
                    </Modal>
                )}

                {view === 'detail' && selectedId && (() => {
                    const s = students.find(x => x.id === selectedId);
                    if (!s) return null;
                    const statusLabels = { 'active': 'مستمر', 'transferred': 'منقول', 'left': 'تارك' };
                    const statusColors = { 'active': 'bg-emerald-100 text-emerald-700', 'transferred': 'bg-amber-100 text-amber-700', 'left': 'bg-rose-100 text-rose-700' };

                    return (
                      <Modal onClose={() => setView('list')}>
                         <div className="bg-white rounded-3xl shadow-2xl p-6 md:p-8 space-y-8 animate-slide-up relative overflow-hidden">
                             <div className="absolute top-0 right-0 w-32 h-32 bg-slate-50 rounded-full -mr-10 -mt-10"></div>
            
                            <div className="relative">
                                <h1 className="text-3xl font-extrabold text-slate-900 mb-1">{cleanName(s.firstName)}</h1>
                                <h2 className="text-xl font-bold text-slate-400">{s.lastName || ""}</h2>
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                               <div className="bg-slate-900 text-white p-6 rounded-2xl shadow-xl flex flex-col items-center justify-center transform transition-transform hover:scale-[1.02]">
                                   <span className="text-slate-400 text-xs font-bold uppercase tracking-wider mb-2">رقم القيد</span>
                                   <span className="text-5xl font-mono font-black">{s.regNumber}</span>
                               </div>
                               <div className="bg-white border-2 border-slate-100 p-6 rounded-2xl shadow-sm flex flex-col items-center justify-center transform transition-transform hover:scale-[1.02]">
                                   <span className="text-slate-400 text-xs font-bold uppercase tracking-wider mb-2">رقم الصفحة</span>
                                   <span className="text-5xl font-mono font-black text-slate-800">{s.pageNumber}</span>
                               </div>
                            </div>

                            <div className="bg-slate-50 rounded-2xl p-6 border border-slate-100 space-y-4">
                                <div className="flex justify-between items-center border-b border-slate-200 pb-4">
                                    <div className="flex items-center gap-3">
                                        <div className="p-2 bg-white rounded-lg shadow-sm"><Calendar size={20} className="text-slate-500"/></div>
                                        <div>
                                            <div className="text-xs font-bold text-slate-400">تاريخ التسجيل</div>
                                            <div className="font-bold text-slate-800">{new Date(s.createdAt).toLocaleDateString('ar-EG')}</div>
                                        </div>
                                    </div>
                                </div>
                                <div className="flex justify-between items-center">
                                    <div className="flex items-center gap-3">
                                        <div className="p-2 bg-white rounded-lg shadow-sm"><Info size={20} className="text-slate-500"/></div>
                                        <div>
                                            <div className="text-xs font-bold text-slate-400">حالة القيد</div>
                                            <div className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-sm font-bold mt-1 ${statusColors[s.status] || statusColors['active']}`}>
                                                {statusLabels[s.status] || 'مستمر'}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                {s.notes && (
                                    <div className="pt-4 border-t border-slate-200">
                                        <div className="text-xs font-bold text-slate-400 mb-1">ملاحظات</div>
                                        <p className="text-slate-700 font-medium leading-relaxed">{s.notes}</p>
                                    </div>
                                )}
                            </div>

                            <button onClick={() => { setSelectedId(s.id); setPrintMode('single'); setTimeout(() => window.print(), 500); }} className="w-full bg-blue-600 text-white py-4 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-blue-700 transition-all shadow-lg shadow-blue-200"><Printer size={20}/> طباعة البطاقة</button>
                            <div className="flex gap-3">
                                <button onClick={() => setView('edit')} className="flex-1 bg-slate-100 py-3 rounded-xl font-bold hover:bg-slate-200 text-slate-700 transition-colors">تعديل البيانات</button>
                                {view !== 'trash' && (
                                    <button onClick={() => setConfirmConfig({ title: "حذف الطالب", message: "نقل إلى سلة المهملات؟", onConfirm: async () => { await updateDoc(doc(db, "students", s.id), { isDeleted: true }); fetchStudents(); setView('list'); setConfirmConfig(null); } })} className="flex-1 bg-red-50 text-red-600 py-3 rounded-xl font-bold hover:bg-red-100 transition-colors">حذف</button>
                                )}
                            </div>
                         </div>
                      </Modal>
                    );
                })()}

                {showPrintModal && (
                    <Modal onClose={() => setShowPrintModal(false)}>
                       <div className="bg-white rounded-2xl p-6 text-center space-y-4 shadow-xl">
                          <h3 className="text-lg font-bold">خيارات الطباعة</h3>
                          <button onClick={() => { setPrintMode('list'); setPrintRegInput(''); setShowPrintModal(false); setTimeout(() => window.print(), 500); }} className="w-full py-3 bg-slate-900 text-white rounded-xl font-bold hover:bg-slate-800 transition-colors">طباعة السجل الحالي بالكامل</button>
                          <div className="text-slate-400 text-xs">أو اطبع قيداً محدداً</div>
                          <select value={printRegInput} onChange={(e) => setPrintRegInput(e.target.value)} className="w-full p-3 border rounded-xl text-center font-bold outline-none focus:ring-2 focus:ring-blue-500">
                               <option value="">اختر رقم القيد...</option>
                               {Array.from(new Set(students.filter(s => !s.isDeleted).map(s => s.regNumber))).sort().map(r => <option key={r} value={r}>قيد {r}</option>)}
                          </select>
                          <button onClick={() => { setPrintMode('list'); setSelectedRegFilter(printRegInput); setShowPrintModal(false); setTimeout(() => window.print(), 500); }} className="w-full py-3 bg-blue-600 text-white rounded-xl font-bold disabled:opacity-50 hover:bg-blue-700 transition-colors" disabled={!printRegInput}>طباعة القيد المختار</button>
                       </div>
                    </Modal>
                )}

                {confirmConfig && <ConfirmModal title={confirmConfig.title} message={confirmConfig.message} onConfirm={confirmConfig.onConfirm} onCancel={() => setConfirmConfig(null)} isDestructive={confirmConfig.isDestructive} />}
                {alertConfig && <AlertModal message={alertConfig.message} type={alertConfig.type} onClose={() => setAlertConfig(null)} />}
              </div>
              
              {printMode === 'list' && <PrintView students={filtered} title={selectedRegFilter ? `سجل قيد رقم ${selectedRegFilter}` : "فهرس القيد العام"} />}
              {printMode === 'single' && students.find(s=>s.id===selectedId) && <SingleStudentPrint student={students.find(s=>s.id===selectedId)} />}
            </>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
