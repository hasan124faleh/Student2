<body>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef, useCallback } from 'react';
        import ReactDOM from 'react-dom/client';
        import { 
          Users, LogOut, Settings, Search, Plus, Printer, 
          Trash2, FileSpreadsheet, Download, Upload, AlertTriangle, ArrowRight, Save, X, FileText, CheckCircle2, XCircle, AlertCircle, ArrowUp, Filter, UserCheck, SortAsc, Type, ChevronDown, ListFilter, RotateCcw, Info, Calendar, Clock, ArrowLeft, Palette, Loader2, BarChart3, PieChart, Moon, Sun, RefreshCw, Copy, Check, Eye, EyeOff, Grid, List, ZoomIn, ZoomOut, Heart, Star, Award, Bell, BellOff, DownloadCloud, UploadCloud, Shield, Key, BookOpen, GraduationCap, Users2, FileOutput, FileInput, Layers, Sparkles, Link2, Hash, Flag, Compass, Globe, Map, Bookmark, FolderOpen, FolderPlus, Archive, Inbox, Send, MessageSquare, Phone, Mail, Github, GitBranch, GitCommit, GitMerge

        import * as XLSX from 'xlsx';

        // ==========================================
        // FIREBASE CONFIG
        // ==========================================
        const firebaseConfig = {
          apiKey: "AIzaSyC3Hyi-tVMui0ZyPsezvoxxSFjCJQBme9Q",
          authDomain: "ss-app-87ac7.firebaseapp.com",
          projectId: "ss-app-87ac7",
          storageBucket: "ss-app-87ac7.firebasestorage.app",
          messagingSenderId: "7671656513",
          appId: "1:7671656513:web:21b51edb450bddd1aad6c0",
          measurementId: "G-LQPLFRBGKH"
        };

        const app = initializeApp(firebaseConfig);
        
        // Initialize Firestore with Persistent Local Cache
        const db = initializeFirestore(app, {
            localCache: persistentLocalCache()
        });

        const auth = getAuth(app);
        const studentsCollection = collection(db, "students");

        // ==========================================
        // UTILS
        // ==========================================
        const cleanName = (name) => {
            if (!name) return "";
            return name.replace(/\s+\d+$/, '').trim();
        };

        const formatDateForInput = (timestamp) => {
            if (!timestamp) return new Date().toISOString().split('T')[0];
            return new Date(timestamp).toISOString().split('T')[0];
        };

        const formatDate = (timestamp) => {
            if (!timestamp) return '';
            return new Date(timestamp).toLocaleDateString('ar-EG', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        };

        const formatDateTime = (timestamp) => {
            if (!timestamp) return '';
            return new Date(timestamp).toLocaleString('ar-EG', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        };

        const exportToExcel = (students) => {
          const statusMap = { 'active': 'مستمر', 'transferred': 'منقول', 'left': 'تارك', 'graduated': 'متخرج' };
          const data = students.filter(s => !s.isDeleted).map(s => ({
            'الاسم الرباعي': cleanName(s.firstName),
            'العائلة': s.lastName || '',
            'رقم القيد': s.regNumber,
            'رقم الصفحة': s.pageNumber,
            'الحالة الدراسية': statusMap[s.status || 'active'] || 'مستمر',
            'ملاحظات': s.notes || '',
            'تاريخ التسجيل': formatDate(s.createdAt)
          }));
          const worksheet = XLSX.utils.json_to_sheet(data);
          const workbook = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(workbook, worksheet, "الطلاب");
          XLSX.writeFile(workbook, `سجل_القيود_${new Date().toISOString().split('T')[0]}.xlsx`);
        };

        const generateTemplate = () => {
          const firstNames = ['محمد', 'أحمد', 'عبدالله', 'علي', 'عمر', 'خالد', 'سعد', 'سعيد', 'صالح', 'فهد', 'سلمان', 'يوسف', 'إبراهيم'];
          const secondNames = ['حسين', 'حسن', 'عبدالرحمن', 'محمود', 'مصطفى', 'جعفر', 'عباس', 'كاظم', 'رضا', 'مهدي'];
          const thirdNames = ['علي', 'محمد', 'جاسم', 'كريم', 'خلف', 'سالم', 'حمزة', 'فاضل'];
          const fourthNames = ['عبدالله', 'ناصر', 'منصور', 'خليفة', 'سلطان', 'يحيى', 'زكريا'];
          const titles = ['الشمري', 'العتيبي', 'القحطاني', 'العنزي', 'الحربي', 'الزهراني', 'المالكي', 'الدوسري', 'التميمي', 'الخالدي'];

          const templateData = [];
          
          for (let reg = 1; reg <= 10; reg++) {
            for (let i = 0; i < 200; i++) {
               const n1 = firstNames[Math.floor(Math.random() * firstNames.length)];
               const n2 = secondNames[Math.floor(Math.random() * secondNames.length)];
               const n3 = thirdNames[Math.floor(Math.random() * thirdNames.length)];
               const n4 = fourthNames[Math.floor(Math.random() * fourthNames.length)];
               const title = titles[Math.floor(Math.random() * titles.length)];
               
               const pageNum = Math.floor(i / 30) + 1;

               templateData.push({
                  'الاسم الرباعي': `${n1} ${n2} ${n3} ${n4}`, 
                  'العائلة': title,
                  'رقم القيد': reg.toString(),
                  'رقم الصفحة': pageNum.toString(),
                  'الحالة الدراسية': 'مستمر',
                  'ملاحظات': ''
               });
            }
          }

          const worksheet = XLSX.utils.json_to_sheet(templateData);
          const workbook = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(workbook, worksheet, "نموذج 2000 طالب");
          XLSX.writeFile(workbook, "نموذج_سجل_القيود_الكبير.xlsx");
        };

        const readExcel = (file) => {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
              try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheetName]);
                resolve(jsonData);
              } catch (err) { reject(err); }
            };
            reader.onerror = (error) => reject(error);
            reader.readAsArrayBuffer(file);
          });
        };

        // طلب إذن الإشعارات
        const requestNotificationPermission = async () => {
          if (!('Notification' in window)) return;
          if (Notification.permission !== 'granted' && Notification.permission !== 'denied') {
            await Notification.requestPermission();
          }
        };

        // عرض إشعار
        const showNotification = (title, message, icon = '📋') => {
          if (Notification.permission === 'granted') {
            new Notification(title, { body: message, icon });
          }
        };

        // حفظ الإعدادات في localStorage
        const saveToLocalStorage = (key, value) => {
          try {
            localStorage.setItem(key, JSON.stringify(value));
          } catch (e) {
            console.error('Error saving to localStorage:', e);
          }
        };

        const loadFromLocalStorage = (key, defaultValue) => {
          try {
            const item = localStorage.getItem(key);
            return item ? JSON.parse(item) : defaultValue;
          } catch (e) {
            console.error('Error loading from localStorage:', e);
            return defaultValue;
          }
        };

        // ==========================================
        // UI COMPONENTS
        // ==========================================
        const SkeletonLoader = () => (
          <div className="animate-pulse space-y-4">
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
              {[...Array(4)].map((_, i) => (
                <div key={i} className="bg-white p-3 rounded-xl border border-slate-100 h-20"></div>
              ))}
            </div>
            <div className="bg-white p-2 rounded-xl border border-slate-100 h-12"></div>
            <div className="bg-white p-4 rounded-xl border border-slate-100 h-64"></div>
          </div>
        );

        const Modal = ({ children, onClose, zIndex = "z-50", title }) => (
          <div className={`fixed inset-0 bg-black/60 ${zIndex} flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in overflow-y-auto`} onClick={onClose}>
            <div className="w-full max-w-lg relative" onClick={e => e.stopPropagation()}>
                <div className="bg-white rounded-2xl shadow-2xl overflow-hidden">
                  <div className="flex items-center justify-between p-4 border-b">
                    {title && <h3 className="text-lg font-bold">{title}</h3>}
                    <button 
                        onClick={onClose} 
                        className="p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-full transition-all"
                        title="إغلاق"
                    >
                        <X size={20} />
                    </button>
                  </div>
                  <div className="p-5">
                    {children}
                  </div>
                </div>
            </div>
          </div>
        );

        const AlertModal = ({ message, type, onClose }) => (
          <Modal onClose={onClose} zIndex="z-[60]">
            <div className="text-center">
              <div className={`w-16 h-16 rounded-full mx-auto flex items-center justify-center mb-4 ${type === 'error' ? 'bg-red-100' : 'bg-green-100'}`}>
                {type === 'error' ? <AlertCircle size={32} className="text-red-500" /> : <CheckCircle2 size={32} className="text-green-500" />}
              </div>
              <p className="text-slate-800 font-bold mb-6 text-lg">{message}</p>
              <button onClick={onClose} className="w-full py-3 bg-slate-900 text-white rounded-xl font-bold hover:bg-slate-800 transition-colors">حسناً</button>
            </div>
          </Modal>
        );

        const ConfirmModal = ({ title, message, onConfirm, onCancel, isDestructive = false }) => (
          <Modal onClose={onCancel} zIndex="z-[60]" title={title}>
            <div className="text-center">
              <p className="text-slate-500 mb-8 text-base">{message}</p>
              <div className="flex gap-3">
                <button onClick={onCancel} className="flex-1 py-3 bg-slate-100 rounded-xl font-bold hover:bg-slate-200 transition-colors">إلغاء</button>
                <button onClick={onConfirm} className={`flex-1 py-3 text-white rounded-xl font-bold transition-colors ${isDestructive ? 'bg-red-500 hover:bg-red-600' : 'bg-blue-600 hover:bg-blue-700'}`}>تأكيد</button>
              </div>
            </div>
          </Modal>
        );

        const StatCard = ({ title, value, icon, colorClass, onClick, trend }) => (
          <div onClick={onClick} className={`bg-white p-4 rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition-all ${onClick ? 'cursor-pointer active:scale-95' : ''}`}>
            <div className="flex items-center justify-between mb-2">
              <div className={`p-2.5 rounded-xl ${colorClass} text-white shadow-md`}>{icon}</div>
              {trend !== undefined && (
                <span className={`text-xs font-bold px-2 py-1 rounded-full ${trend > 0 ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                  {trend > 0 ? '+' : ''}{trend}%
                </span>
              )}
            </div>
            <div>
              <div className="text-2xl font-black text-slate-800">{value}</div>
              <div className="text-xs text-slate-500 font-bold mt-1">{title}</div>
            </div>
          </div>
        );

        const Tooltip = ({ children, text }) => (
          <div className="tooltip">
            {children}
            <span className="tooltip-text">{text}</span>
          </div>
        );

        const EmptyState = ({ message, icon }) => (
          <div className="text-center py-16 px-4">
            <div className="text-7xl mb-4 opacity-50">{icon || '📭'}</div>
            <p className="text-slate-400 font-bold text-lg">{message || 'لا توجد بيانات'}</p>
          </div>
        );

        const SingleStudentPrint = ({ student }) => {
          const statusLabels = { 'active': 'مستمر', 'transferred': 'منقول', 'left': 'تارك', 'graduated': 'متخرج' };
          const printDate = new Date().toLocaleDateString('ar-EG');
          return (
            <div className="hidden print:flex flex-col items-center justify-start w-full h-screen bg-white p-0 overflow-hidden">
              <div className="w-[190mm] h-[250mm] border-[6px] border-double border-slate-800 p-6 rounded-none relative overflow-hidden flex flex-col justify-between mx-auto mt-0 shadow-none">
                <div className="absolute top-2 right-2 w-16 h-16 border-t-4 border-r-4 border-slate-900"></div>
                <div className="absolute top-2 left-2 w-16 h-16 border-t-4 border-l-4 border-slate-900"></div>
                <div className="absolute bottom-2 right-2 w-16 h-16 border-b-4 border-r-4 border-slate-900"></div>
                <div className="absolute bottom-2 left-2 w-16 h-16 border-b-4 border-l-4 border-slate-900"></div>

                <div className="text-center border-b-2 border-slate-900 pb-4 mb-4 relative z-10">
                  <div className="flex justify-between items-start mb-2 px-2">
                    <div className="text-sm font-bold leading-relaxed">جمهورية العراق<br/>وزارة التربية<br/>المديرية العامة للتربية</div>
                    <div className="w-20 h-20 border-2 border-slate-800 rounded-full flex items-center justify-center bg-slate-50 shadow-sm"><span className="text-3xl">🎓</span></div>
                    <div className="text-sm font-bold leading-relaxed text-left">التاريخ: {printDate}<br/>العدد: ............</div>
                  </div>

                  <p className="text-lg font-bold text-slate-600 mt-2 bg-slate-100 inline-block px-6 py-1 rounded-full border border-slate-300">نسخة طبق الأصل من سجل القيد</p>
                </div>

                <div className="flex-1 flex flex-col gap-4 justify-start pt-2 px-4 relative z-10">
                   <div className="text-center space-y-3 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                      <span className="text-lg font-bold text-slate-500 block">الاسم الرباعي والعائلة</span>
                      <div className="text-3xl font-black text-slate-900 pb-1">{cleanName(student.firstName)} {student.lastName || ''}</div>
                   </div>

                   <div className="grid grid-cols-2 gap-6 my-2">
                      <div className="border-2 border-slate-800 p-4 text-center rounded-xl bg-white shadow-[2px_2px_0px_0px_rgba(30,41,59,1)]">
                        <span className="text-base font-bold text-slate-600 uppercase block mb-1">رقم القيد العام</span>
                        <div className="text-5xl font-mono font-black text-slate-900 tracking-wider">{student.regNumber}</div>
                      </div>
                      <div className="border-2 border-slate-800 p-4 text-center rounded-xl bg-white shadow-[2px_2px_0px_0px_rgba(30,41,59,1)]">
                        <span className="text-base font-bold text-slate-600 uppercase block mb-1">رقم الصفحة</span>
                        <div className="text-5xl font-mono font-black text-slate-900 tracking-wider">{student.pageNumber}</div>
                      </div>
                   </div>

                   <div className="grid grid-cols-2 gap-6 text-right px-2 mt-2">
                      <div className="flex flex-col border-b-2 border-slate-200 pb-2">
                         <span className="text-base font-bold text-slate-500 mb-1">الوضع الأكاديمي</span>
                         <span className="text-2xl font-bold text-slate-900">{statusLabels[student.status || 'active']}</span>
                      </div>

        const themeColors = {
          slate: { primary: 'bg-slate-900', hover: 'hover:bg-slate-800', secondary: 'bg-blue-600', secondaryHover: 'hover:bg-blue-700', ring: 'focus:ring-blue-500', name: 'الأساسي (أزرق)' },
          purple: { primary: 'bg-violet-900', hover: 'hover:bg-violet-800', secondary: 'bg-purple-600', secondaryHover: 'hover:bg-purple-700', ring: 'focus:ring-purple-500', name: 'بنفسجي' },
          emerald: { primary: 'bg-teal-900', hover: 'hover:bg-teal-800', secondary: 'bg-emerald-600', secondaryHover: 'hover:bg-emerald-700', ring: 'focus:ring-emerald-500', name: 'أخضر' },
          rose: { primary: 'bg-rose-900', hover: 'hover:bg-rose-800', secondary: 'bg-red-600', secondaryHover: 'hover:bg-red-700', ring: 'focus:ring-red-500', name: 'أحمر' },
          amber: { primary: 'bg-amber-900', hover: 'hover:bg-amber-800', secondary: 'bg-orange-600', secondaryHover: 'hover:bg-orange-700', ring: 'focus:ring-orange-500', name: 'برتقالي' },
        };
        
        const App = () => {
          const [user, setUser] = useState(null);
          const [loading, setLoading] = useState(true);
          const [students, setStudents] = useState([]);

          const [yearFilter, setYearFilter] = useState('ALL');
          const [showPrintModal, setShowPrintModal] = useState(false);
          const [printRegInput, setPrintRegInput] = useState('');
          const [visibleCount, setVisibleCount] = useState(150);
          const loadMoreRef = useRef(null);
          const [importing, setImporting] = useState(false);
          const [importProgress, setImportProgress] = useState(0);
          const [printMode, setPrintMode] = useState('list');
          const [alertConfig, setAlertConfig] = useState(null);
          const [confirmConfig, setConfirmConfig] = useState(null);
          const [showScrollTop, setShowScrollTop] = useState(false);
          const [similarStudents, setSimilarStudents] = useState([]);
          const [colorTheme, setColorTheme] = useState(loadFromLocalStorage('appTheme', 'slate'));
          const [isDarkMode, setIsDarkMode] = useState(loadFromLocalStorage('darkMode', false));
          const [showThemeModal, setShowThemeModal] = useState(false);
          const [showSearchHistory, setShowSearchHistory] = useState(false);
          const [searchHistory, setSearchHistory] = useState(loadFromLocalStorage('searchHistory', []));
          const [showKeyboardShortcuts, setShowKeyboardShortcuts] = useState(false);
          const [selectedStudents, setSelectedStudents] = useState([]);
          const [showBulkActions, setShowBulkActions] = useState(false);
          const [viewMode, setViewMode] = useState(loadFromLocalStorage('viewMode', 'table')); // 'table' or 'grid'
          const [refreshing, setRefreshing] = useState(false);

          const currentTheme = themeColors[colorTheme] || themeColors.slate;

          const [stats, setStats] = useState({ total: 0, active: 0, graduated: 0, transferred: 0, left: 0 });

          // طلب إذن الإشعارات
          useEffect(() => {
            requestNotificationPermission();
          }, []);

          // حفظ الإعدادات
          useEffect(() => {
            saveToLocalStorage('appTheme', colorTheme);
          }, [colorTheme]);

          useEffect(() => {
            saveToLocalStorage('darkMode', isDarkMode);
            if (isDarkMode) {
                document.documentElement.classList.add('dark');

                document.documentElement.classList.remove('dark');
            }
          }, [isDarkMode]);

          useEffect(() => {
            saveToLocalStorage('viewMode', viewMode);
          }, [viewMode]);

          // إضافة اختصارات لوحة المفاتيح
          useEffect(() => {
            const handleKeyDown = (e) => {
              // Ctrl+F للبحث
              if (e.ctrlKey && e.key === 'f') {
                e.preventDefault();
                document.getElementById('searchInput')?.focus();
              }
              // Ctrl+N لإضافة طالب جديد
              if (e.ctrlKey && e.key === 'n') {
                e.preventDefault();
                setSelectedId(null);
                setView('add');
                setSimilarStudents([]);
              }
              // Ctrl+P للطباعة
              if (e.ctrlKey && e.key === 'p') {
                e.preventDefault();
                setShowPrintModal(true);
              }
              // Ctrl+E للتصدير
              if (e.ctrlKey && e.key === 'e') {
                e.preventDefault();
                exportToExcel(students.filter(s => !s.isDeleted));
              }
              // Ctrl+D للوضع المظلم
              if (e.ctrlKey && e.key === 'd') {
                e.preventDefault();
                setIsDarkMode(!isDarkMode);
              }
              // ? لإظهار اختصارات لوحة المفاتيح
              if (e.key === '?' && !e.ctrlKey && !e.altKey) {
                e.preventDefault();
                setShowKeyboardShortcuts(true);
              }
              // Esc لإغلاق النوافذ
              if (e.key === 'Escape') {
                if (showKeyboardShortcuts) setShowKeyboardShortcuts(false);
                if (showThemeModal) setShowThemeModal(false);
                if (showPrintModal) setShowPrintModal(false);
              }
            };

            window.addEventListener('keydown', handleKeyDown);
            return () => window.removeEventListener('keydown', handleKeyDown);
          }, [isDarkMode, showKeyboardShortcuts, showThemeModal, showPrintModal]);

          // حساب الإحصائيات
          const regsCount = useMemo(() => {
             return new Set(students.filter(s => !s.isDeleted).map(s => s.regNumber)).size;
          }, [students]);

          const regStats = useMemo(() => {
             const active = students.filter(s => !s.isDeleted);
             const statsMap = {};
             active.forEach(s => {
                 const reg = s.regNumber;
                 if (!statsMap[reg]) {
                     statsMap[reg] = { total: 0, active: 0, transferred: 0, left: 0, graduated: 0 };
                 }
                 statsMap[reg].total++;
                 const status = s.status || 'active';
                 if (statsMap[reg][status] !== undefined) {
                     statsMap[reg][status]++;
                 }
             });
             return Object.entries(statsMap).map(([reg, counts]) => ({ reg, ...counts })).sort((a, b) => Number(a.reg) - Number(b.reg));
          }, [students]);

          const statusStats = useMemo(() => {
            const active = students.filter(s => !s.isDeleted);
            const counts = { active: 0, transferred: 0, left: 0, graduated: 0 };
            active.forEach(s => {
                const st = s.status || 'active';
                if (counts[st] !== undefined) counts[st]++;
            });
            return [
                { label: 'مستمر', count: counts.active, color: 'bg-emerald-100 text-emerald-700', icon: '✅' },
                { label: 'منقول', count: counts.transferred, color: 'bg-amber-100 text-amber-700', icon: '🔄' },
                { label: 'تارك', count: counts.left, color: 'bg-rose-100 text-rose-700', icon: '❌' },
                { label: 'متخرج', count: counts.graduated, color: 'bg-blue-100 text-blue-700', icon: '🎓' }
            ];
          }, [students]);

          const years = useMemo(() => {
             const y = new Set(students.map(s => {
                const d = new Date(s.createdAt);
                return isNaN(d.getFullYear()) ? null : d.getFullYear();
             }).filter(y => y !== null));
             return Array.from(y).sort((a,b) => b - a);
          }, [students]);

          // تحديث الإحصائيات
          const refreshStats = async () => {
             try {
                 const baseConstraints = [where("isDeleted", "==", false)];
                 if (selectedRegFilter) baseConstraints.push(where("regNumber", "==", selectedRegFilter));
                 
                 const totalQ = query(studentsCollection, ...baseConstraints);
                 const totalSnap = await getCountFromServer(totalQ);
                 const total = totalSnap.data().count;

                 const activeQ = query(studentsCollection, ...baseConstraints, where("status", "==", "active"));
                 const activeSnap = await getCountFromServer(activeQ);
                 const active = activeSnap.data().count;

                 const graduatedQ = query(studentsCollection, ...baseConstraints, where("status", "==", "graduated"));
                 const graduatedSnap = await getCountFromServer(graduatedQ);
                 const graduated = graduatedSnap.data().count;

                 const transferredQ = query(studentsCollection, ...baseConstraints, where("status", "==", "transferred"));
                 const transferredSnap = await getCountFromServer(transferredQ);
                 const transferred = transferredSnap.data().count;

                 const leftQ = query(studentsCollection, ...baseConstraints, where("status", "==", "left"));
                 const leftSnap = await getCountFromServer(leftQ);
                 const left = leftSnap.data().count;

                 setStats({ total, active, graduated, transferred, left });
             } catch (error) {
                 console.error("Error fetching stats:", error);
             }
          };

          useEffect(() => {
             if (user) {
                 refreshStats();
             }
          }, [user, selectedRegFilter]);

          // مراقبة حالة المصادقة
          useEffect(() => {
            const unsub = onAuthStateChanged(auth, (u) => {
              setUser(u);
              if (!u) setLoading(false);
            });
            return () => unsub();
          }, []);

          // تحميل الطلاب
          useEffect(() => {
            if (!user) return;
            setLoading(true);
            const unsubscribe = onSnapshot(studentsCollection, (snapshot) => {
               const data = [];
               snapshot.forEach(d => {
                  const raw = d.data();
                  const createdAt = raw.createdAt?.toMillis ? raw.createdAt.toMillis() : (raw.createdAt || Date.now());
                  data.push({ id: d.id, ...raw, createdAt });
               });
               data.sort((a,b) => b.createdAt - a.createdAt);
               setStudents(data);
               setLoading(false);
            }, (error) => {
               console.error("Error fetching students:", error);
               setAlertConfig({ message: "فشل تحميل البيانات", type: 'error' });
               setLoading(false);
            });
            return () => unsubscribe();
          }, [user]);

          // تأخير البحث
          useEffect(() => {
            const timer = setTimeout(() => {
              setDebouncedQuery(search);
              if (search.trim()) {
                setSearchHistory(prev => {
                  const newHistory = [search, ...prev.filter(s => s !== search)].slice(0, 5);
                  saveToLocalStorage('searchHistory', newHistory);
                  return newHistory;
                });
              }
            }, 300);
            return () => clearTimeout(timer);

                setShowScrollTop(window.scrollY > 300);

             return () => window.removeEventListener('scroll', handleScroll);
          }, []);

          useEffect(() => {
            const observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting) setVisibleCount((prev) => prev + 50);
            }, { threshold: 0.1 });
            if (loadMoreRef.current) observer.observe(loadMoreRef.current);
            return () => observer.disconnect();
          }, [students.length]);

          // استيراد الملف
          const handleImport = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            setImporting(true);
            setImportProgress(0);
            try {
              const rows = await readExcel(file);
              const totalRows = rows.length;
              let count = 0;
              let batch = writeBatch(db);
              let batchCount = 0;
              
              for (let i = 0; i < totalRows; i++) {
                 const row = rows[i];
                 const fName = row['الاسم الرباعي'] || row['الاسم الكامل'] || row['firstName'] || row['الاسم الأول'];
                 const reg = row['رقم القيد'] || row['regNumber'];
                 const page = row['رقم الصفحة'] || row['pageNumber'];
                 if (fName && reg) {
                    const ref = doc(studentsCollection);
                    batch.set(ref, {
                       firstName: String(fName).trim(),
                       lastName: row['العائلة'] || '',
                       regNumber: String(reg).trim(),

                       status: 'active',
                       isDeleted: false,
                       notes: row['ملاحظات'] || '',
                       createdAt: Date.now() + count
                    });
                    count++;
                    batchCount++;
                    
                    if (batchCount === 400) {
                        await batch.commit();
                        batch = writeBatch(db);
                        batchCount = 0;
                        setImportProgress(Math.round((i / totalRows) * 100));
                    }
                 }
              }
              
              if (batchCount > 0) {
                  await batch.commit();
              }
              
              setImportProgress(100);
              await refreshStats();
              showNotification('تم الاستيراد', `تم استيراد ${count} سجل بنجاح`);
              setAlertConfig({ message: `تم استيراد ${count} سجل بنجاح`, type: 'success' });
            } catch (e) { 
              setAlertConfig({ message: "فشل الاستيراد", type: 'error' }); 
            }
            setImporting(false);
            setTimeout(() => setImportProgress(0), 500);
          };

          // حذف جميع البيانات
          const executeDeleteAll = async () => {
             setConfirmConfig(null);
             setLoading(true);
             try {
               const snap = await getDocs(studentsCollection);
               const CHUNK_SIZE = 400;
               const allDocs = snap.docs;
               for (let i = 0; i < allDocs.length; i += CHUNK_SIZE) {
                  const batch = writeBatch(db);
                  const chunk = allDocs.slice(i, i + CHUNK_SIZE);
                  chunk.forEach((d) => batch.delete(d.ref));
                  await batch.commit();
               }
               await refreshStats();
               setAlertConfig({ message: 'تم حذف جميع البيانات بنجاح', type: 'success' });
               setView('list');
             } catch (e) { 
               setAlertConfig({ message: "فشل حذف البيانات", type: 'error' }); 
             }
             finally { setLoading(false); }
          };

          // استعادة طالب
          const handleRestore = async (id) => {
            try {
                await updateDoc(doc(db, "students", id), { isDeleted: false });
                await refreshStats();
                setAlertConfig({ message: 'تمت استعادة السجل بنجاح', type: 'success' });
            } catch(e) { console.error(e); }
          };

          // حذف نهائي
          const handleDeleteForever = (id) => {
            setConfirmConfig({
                title: "حذف نهائي",
                message: "هل أنت متأكد من حذف هذا السجل نهائياً؟ لا يمكن التراجع عن هذا الإجراء.",
                isDestructive: true,
                onConfirm: async () => {
                    await deleteDoc(doc(db, "students", id));
                    await refreshStats();
                    setConfirmConfig(null);
                    setAlertConfig({ message: 'تم الحذف النهائي', type: 'success' });
                }
            });
          };

          // التحقق من الأسماء المشابهة
          const checkSimilarStudents = (val) => {
            const name = val.trim();
            if (name.length < 2) {
                setSimilarStudents([]);
                return;
            }
            const matches = students.filter(s => 
                !s.isDeleted && 
                s.id !== selectedId &&
                s.firstName && s.firstName.includes(name)
            );
            setSimilarStudents(matches.slice(0, 5));
          };

          // تحديث البيانات
          const handleRefresh = async () => {
            setRefreshing(true);
            await refreshStats();
            setTimeout(() => setRefreshing(false), 500);
          };

          // تصفية الطلاب
          const filtered = useMemo(() => {
            let res = students.filter(s => view === 'trash' ? s.isDeleted : !s.isDeleted);
            if (selectedRegFilter) res = res.filter(s => s.regNumber === selectedRegFilter);
            if (yearFilter !== 'ALL') res = res.filter(s => {
              const year = s.createdAt ? new Date(s.createdAt).getFullYear().toString() : '';
              return year === yearFilter;
            });
            if (statusFilter !== 'ALL') res = res.filter(s => (s.status || 'active') === statusFilter);
            if (debouncedQuery) {
               const q = debouncedQuery.toLowerCase();
               res = res.filter(s => {
                   const fullName = `${s.firstName || ''} ${s.lastName || ''}`.toLowerCase();
                   return fullName.includes(q);
               });
               res.sort((a, b) => {
                   const aName = `${a.firstName || ''} ${a.lastName || ''}`.toLowerCase();
                   const bName = `${b.firstName || ''} ${b.lastName || ''}`.toLowerCase();
                   
                   const aIndex = aName.indexOf(q);
                   const bIndex = bName.indexOf(q);
                   
                   if (aIndex !== bIndex) {
                       return aIndex - bIndex;
                   }
                   
                   if (sortBy === 'alphabetical') return (a.firstName || '').localeCompare(b.firstName || '');
                   return (b.createdAt || 0) - (a.createdAt || 0);
               });
            } else {
               if (sortBy === 'alphabetical') res.sort((a,b) => (a.firstName || '').localeCompare(b.firstName || ''));
               else res.sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));
            }
            return res;
          }, [students, debouncedQuery, selectedRegFilter, statusFilter, sortBy, yearFilter, view]);

          const displayed = useMemo(() => filtered.slice(0, visibleCount), [filtered, visibleCount]);

          // إحصائيات سريعة
          const quickStats = useMemo(() => {
            const total = students.filter(s => !s.isDeleted).length;
            const today = new Date().toDateString();
            const todayNew = students.filter(s => !s.isDeleted && new Date(s.createdAt).toDateString() === today).length;
            return { total, todayNew };
          }, [students]);

          if (loading && students.length === 0) {

                  <p className="text-slate-400 text-sm mt-2">الرجاء الانتظار قليلاً</p>
                </div>
              </div>
            );
          }

          if (!user) return <Login />;

                      </div>
                      <div>
                        <h1 className="font-black text-lg text-slate-800">سجل القيد العام</h1>

                    <div className="flex items-center gap-2">

                                <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} className="bg-slate-50 rounded-xl px-3 py-2.5 border border-slate-200 text-sm font-medium outline-none focus:border-blue-500 transition-colors">

                                    <option value="recent">🕒 الأحدث أولاً</option>
                                    <option value="alphabetical">🔤 ترتيب أبجدي</option>

                                <select value={yearFilter} onChange={e => setYearFilter(e.target.value)} className="bg-slate-50 rounded-xl px-3 py-2.5 border border-slate-200 text-sm font-medium outline-none focus:border-blue-500 transition-colors">
                                    <option value="ALL">📅 جميع السنوات</option>
                                    {years.map(y => <option key={y} value={y}>{y}</option>)}
                                </select>

                                <button

                                >
                                  <RotateCcw size={16} />
                                  <span>إعادة تعيين</span>
                                </button>
                            </div>
                          </div>

                          {/* أزرار الإجراءات السريعة */}
                          <div className="flex gap-3">
                                <Tooltip text="إضافة طالب جديد (Ctrl+N)">
                                  <button onClick={() => { setSelectedId(null); setView('add'); setSimilarStudents([]); }} className={`flex-1 ${currentTheme.primary} ${currentTheme.hover} text-white px-4 py-3.5 rounded-xl font-bold flex items-center justify-center gap-2 shadow-lg transition-all text-sm hover:shadow-xl active:scale-95`}>

                                <Tooltip text="طباعة السجل (Ctrl+P)">

                                    <Printer size={20} /> طباعة السجل

                                {selectedStudents.length > 0 && (

                                    </button>

                          </div>

                          {/* عرض الجدول أو الشبكة */}
                          {viewMode === 'table' ? (
                            <div className="bg-white rounded-2xl border shadow-xl overflow-hidden">

                                              setSelectedStudents(displayed.map(s => s.id));

                                          }}
                                          checked={selectedStudents.length === displayed.length && displayed.length > 0}

                                      </th>
                                      <th className="px-4 py-3 text-sm font-bold text-slate-500">#</th>

                                      <th className="px-4 py-3 text-sm font-bold text-slate-500 text-center">تاريخ التسجيل</th>

                                    </tr>
                                  </thead>
                                  <tbody className="divide-y divide-slate-100">
                                    {displayed.map((s, idx) => (
                                      <tr 
                                        key={s.id}

                                        className={`hover:bg-blue-50/50 cursor-pointer transition-colors group ${
                                          selectedStudents.includes(s.id) ? 'bg-blue-50/30' : ''
                                        }`}
                                      >
                                        <td className="px-4 py-3" onClick={(e) => e.stopPropagation()}>
                                          <input 
                                            type="checkbox" 
                                            className="w-4 h-4 rounded border-slate-300"
                                            checked={selectedStudents.includes(s.id)}
                                            onChange={(e) => {
                                              if (e.target.checked) {

                                        </td>

                                            <div className="flex items-center gap-2">

                                      setAlertConfig({ message: 'تم نقل الطالب إلى سلة المحذوفات', type: 'success' }); 
                                      await refreshStats();
                                    } })} className="flex-1 bg-red-50 text-red-600 py-3.5 rounded-xl font-bold hover:bg-red-100 transition-colors text-base">
                                      حذف
                                    </button>
                                )}
                            </div>
                         </div>
                      </Modal>
                    );
                })()}

                {/* نافذة خيارات الطباعة */}
                {showPrintModal && (
                    <Modal onClose={() => setShowPrintModal(false)} title="خيارات الطباعة">
                       <div className="space-y-4">
                          <button onClick={() => { setPrintMode('list'); setPrintRegInput(''); setShowPrintModal(false); setTimeout(() => window.print(), 500); }} className={`w-full py-4 ${currentTheme.primary} ${currentTheme.hover} text-white rounded-xl font-bold transition-colors text-base flex items-center justify-center gap-2`}>
                            <Printer size={20}/> طباعة السجل الحالي بالكامل
                          </button>
                          
                          <div className="relative">
                            <div className="absolute inset-0 flex items-center">
                              <div className="w-full border-t border-slate-200"></div>
                            </div>
                            <div className="relative flex justify-center text-xs">
                              <span className="px-2 bg-white text-slate-400">أو</span>
                            </div>
                          </div>
                          
                          <select value={printRegInput} onChange={(e) => setPrintRegInput(e.target.value)} className={`w-full p-3.5 border-2 rounded-xl text-center font-bold outline-none focus:border-${currentTheme.ring.split('-')[1]}-500 transition-colors text-base`}>
                               <option value="">اختر رقم القيد...</option>
                               {Array.from(new Set(students.filter(s => !s.isDeleted).map(s => s.regNumber))).sort().map(r => <option key={r} value={r}>قيد رقم {r}</option>)}
                          </select>
                          
                          <button onClick={() => { setPrintMode('list'); setSelectedRegFilter(printRegInput); setShowPrintModal(false); setTimeout(() => window.print(), 500); }} className={`w-full py-4 ${currentTheme.secondary} ${currentTheme.secondaryHover} text-white rounded-xl font-bold disabled:opacity-50 transition-colors text-base flex items-center justify-center gap-2`} disabled={!printRegInput}>
                            <Printer size={20}/> طباعة القيد المحدد
                          </button>
                       </div>
                    </Modal>
                )}

                {/* نافذة اختصارات لوحة المفاتيح */}
                {showKeyboardShortcuts && (
                  <Modal onClose={() => setShowKeyboardShortcuts(false)} title="اختصارات لوحة المفاتيح">
                    <div className="space-y-3">
                      {[
                        { key: 'Ctrl + N', desc: 'إضافة طالب جديد' },
                        { key: 'Ctrl + F', desc: 'بحث' },
                        { key: 'Ctrl + P', desc: 'طباعة' },
                        { key: 'Ctrl + E', desc: 'تصدير Excel' },
                        { key: 'Ctrl + D', desc: 'تغيير الوضع (ليلي/نهاري)' },
                        { key: '?', desc: 'عرض هذه الاختصارات' },
                        { key: 'Esc', desc: 'إغلاق النوافذ المنبثقة' }
                      ].map((item, i) => (
                        <div key={i} className="flex items-center justify-between p-3 bg-slate-50 rounded-lg">
                          <span className="font-bold text-slate-700">{item.desc}</span>
                          <span className="bg-white px-3 py-1.5 rounded-lg text-sm font-mono border shadow-sm">{item.key}</span>
                        </div>
                      ))}
                    </div>
                  </Modal>
                )}

                {/* نافذة الإجراءات الجماعية */}
                {showBulkActions && selectedStudents.length > 0 && (
                  <Modal onClose={() => setShowBulkActions(false)} title={`إجراءات جماعية (${selectedStudents.length} طالب)`}>
                    <div className="space-y-3">
                      <button className="w-full py-4 bg-emerald-100 text-emerald-700 rounded-xl font-bold flex items-center gap-3 justify-center hover:bg-emerald-200 transition-colors">
                        <CheckCircle2 size={20}/> تغيير الحالة إلى مستمر
                      </button>
                      <button className="w-full py-4 bg-blue-100 text-blue-700 rounded-xl font-bold flex items-center gap-3 justify-center hover:bg-blue-200 transition-colors">
                        <Award size={20}/> تغيير الحالة إلى متخرج
                      </button>
                      <button className="w-full py-4 bg-amber-100 text-amber-700 rounded-xl font-bold flex items-center gap-3 justify-center hover:bg-amber-200 transition-colors">
                        <RotateCcw size={20}/> تغيير الحالة إلى منقول
                      </button>
                      <button className="w-full py-4 bg-red-100 text-red-700 rounded-xl font-bold flex items-center gap-3 justify-center hover:bg-red-200 transition-colors">
                        <Trash2 size={20}/> نقل إلى سلة المحذوفات
                      </button>
                    </div>
                  </Modal>
                )}

                {/* نوافذ التأكيد والتنبيه */}
                {confirmConfig && <ConfirmModal {...confirmConfig} onCancel={() => setConfirmConfig(null)} />}
                {alertConfig && <AlertModal {...alertConfig} onClose={() => setAlertConfig(null)} />}
                
                {/* نافذة التحميل */}
                {importing && (
                  <Modal onClose={() => {}} zIndex="z-[80]">
                    <div className="text-center py-8">
                      <div className="relative flex items-center justify-center mb-6">
                          <div className="loading-spinner w-20 h-20"></div>
                          <div className="absolute text-xl font-bold text-blue-800">{importProgress}%</div>
                      </div>
                      <h3 className="text-2xl font-bold text-slate-800 mb-2">جاري استيراد البيانات...</h3>
                      <p className="text-slate-500 mb-6">يرجى الانتظار قليلاً</p>
                      <div className="w-full bg-slate-200 rounded-full h-3 overflow-hidden">
                          <div className="bg-blue-600 h-3 rounded-full transition-all duration-300" style={{ width: `${importProgress}%` }}></div>
                      </div>
                    </div>
                  </Modal>
                )}
              </div>
              
              {/* صفحات الطباعة المخفية */}
              {printMode === 'list' && <PrintView students={filtered} title={selectedRegFilter ? `كشف الطلاب - قيد رقم ${selectedRegFilter}` : "كشف القيد العام"} />}
              {printMode === 'single' && students.find(s=>s.id===selectedId) && <SingleStudentPrint student={students.find(s=>s.id===selectedId)} />}
            </>
          );
        };

        // أيقونة لوحة المفاتيح (لأنها غير موجودة في المكتبة المستوردة)
        const Keyboard = (props) => (
          <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect>
            <line x1="6" y1="8" x2="6" y2="8"></line>
            <line x1="10" y1="8" x2="10" y2="8"></line>
            <line x1="14" y1="8" x2="14" y2="8"></line>
            <line x1="18" y1="8" x2="18" y2="8"></line>
            <line x1="6" y1="12" x2="6" y2="12"></line>
            <line x1="10" y1="12" x2="10" y2="12"></line>
            <line x1="14" y1="12" x2="14" y2="12"></line>
            <line x1="18" y1="12" x2="18" y2="12"></line>
            <line x1="6" y1="16" x2="18" y2="16"></line>
          </svg>
        );

        // أيقونة السجل (History)
        const History = (props) => (
          <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        );

        // أيقونة الطبقات (Layers)
        const Layers = (props) => (
          <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
